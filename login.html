<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | PT. Bisa Media Grup</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="icon" type="image/png" href="media/logo.png" />
</head>
<body class="login-body">
  <main class="login-page">
    <img class="login-page-watermark" src="media/logo.png" alt="" aria-hidden="true" />

    <section class="login-card" aria-label="Login PT. Bisa Media Grup">
      <div class="login-card__brand">
        <div class="brand-header">
          <img class="brand-logo brand-logo--login" src="media/logo.png" alt="Logo PT. Bisa Media Grup" />
          <span class="brand-name brand-name--light">PT. Bisa Media Grup</span>
        </div>

        <img class="brand-panel-watermark" src="media/logo.png" alt="" aria-hidden="true" />

        <div class="welcome">
          <h1>Selamat<br />Datang.</h1>

          <div class="tagline-box">
            <span class="tagline-label">Tagline</span>
            <strong>Work Can Be Fun</strong>
          </div>
        </div>
      </div>

      <div class="login-card__form">
        <form id="loginForm" class="login-form" novalidate>
          <h2>Login</h2>

          <div class="form-field">
            <label for="username">Email / Username</label>
            <input
              id="username"
              name="username"
              type="text"
              placeholder="Masukan Email dan Username"
              autocomplete="username"
            />
          </div>

          <div class="form-field">
            <div class="form-label-row">
              <label for="password">Password</label>
              <button id="forgotPassword" class="link-button" type="button">
                Lupa Password
              </button>
            </div>

            <div class="password-input">
              <input
                id="password"
                name="password"
                type="password"
                placeholder="Masukan Password"
                autocomplete="current-password"
              />

              <button
                id="togglePassword"
                class="password-toggle"
                type="button"
                aria-label="Tampilkan password"
              >
                <svg class="icon icon--muted" viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M3 3l18 18"></path>
                  <path d="M10.6 10.6a2 2 0 002.8 2.8"></path>
                  <path d="M9.9 4.25A10.5 10.5 0 0112 4c5.1 0 8.7 4.8 9 5.3.3.45.3.95 0 1.4a17.7 17.7 0 01-3.15 3.55"></path>
                  <path d="M6.55 6.55C4.45 8.05 3.2 9.95 3 10.3c-.3.45-.3.95 0 1.4C3.4 12.3 7 17 12 17a9.9 9.9 0 004.25-.95"></path>
                </svg>
              </button>
            </div>

            <small>Minimal 8 karakter, termasuk huruf, angka, dan simbol.</small>
          </div>

          <label class="remember-option">
            <input id="rememberMe" type="checkbox" />
            <span>Ingat Saya</span>
          </label>

          <p id="loginMessage" class="form-message" aria-live="polite"></p>

          <button class="primary-button" type="submit">Login</button>
        </form>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
