<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rekap Divisi | Bisa Media</title>
  <link rel="stylesheet" href="../../assets/css/style.css?v=20261031" />
  <link rel="icon" type="image/png" href="../../media/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    /* ==========================================================================
       GLOBAL TYPOGRAPHY & RESET
       ========================================================================== */
    * {
      box-sizing: border-box;
    }

    body,
    input,
    button,
    table,
    select,
    textarea {
      font-family: 'Outfit', sans-serif !important;
    }

    /* ===== MAIN PANEL & TABLE ===== */
    .rekap-panel {
      position: relative;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
      padding: 20px !important;
      margin-bottom: 24px;
      overflow: visible !important;
      min-height: 440px;
      box-sizing: border-box;
    }

    .rekap-panel-accent {
      height: 3.5px;
      background: #0076C5;
      width: 100% !important;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
      margin: 0 0 16px 0 !important;
    }

    /* ===== TOOLBAR (Sisi Kiri: Filter, Kalender, Excel, Search - Sesuai Gambar 1) ===== */
    .rekap-toolbar {
      padding: 0 0 14px 0 !important;
      margin: 0 0 14px 0 !important;
      background: transparent !important;
      border-bottom: 1px dashed #cbd5e1 !important;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      position: relative;
      z-index: 50;
    }

    .toolbar-left-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Icon Toolbar Buttons (Filter, Kalender, Excel) */
    .btn-toolbar-icon {
      width: 34px;
      height: 34px;
      padding: 0;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      color: #3b82f6;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      transition: all 0.15s ease;
      position: relative;
    }

    .btn-toolbar-icon:hover {
      border-color: #0284c7;
      color: #0284c7;
      background: #f0f9ff;
    }

    .btn-toolbar-icon svg {
      width: 17px;
      height: 17px;
      stroke-width: 2.2;
    }

    /* Official Excel Button */
    .btn-toolbar-icon.btn-excel {
      border-color: #cbd5e1;
      background: #ffffff;
      padding: 0;
    }

    .btn-toolbar-icon.btn-excel:hover {
      background: #f0fdf4;
      border-color: #107c41;
      transform: translateY(-1px);
    }

    /* Search Input Pill */
    .rekap-search-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .rekap-search-icon {
      position: absolute;
      left: 12px;
      width: 15px;
      height: 15px;
      color: #64748b;
      pointer-events: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
    }

    .rekap-search-input {
      height: 36px;
      padding: 0 14px 0 34px;
      background: #ffffff;
      border: 1.2px solid #cbd5e1;
      border-radius: 20px;
      font-size: 13px;
      color: #1e293b;
      outline: none;
      width: 220px;
      transition: all 0.15s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }

    .rekap-search-input:focus {
      border-color: #28a5de;
      box-shadow: 0 0 0 3px rgba(40, 165, 222, 0.15);
      width: 260px;
    }

    .rekap-search-input::placeholder {
      color: #94a3b8;
      font-style: italic;
    }

    /* ===== FILTER FUNNEL POPOVER (100% PERSIS SCREENSHOT 1 & 2) ===== */
    .filter-popover-wrap {
      position: relative;
      display: inline-block;
    }

    .rekap-filter-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 250px;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      padding: 16px;
      z-index: 200;
      box-sizing: border-box;
      display: none;
    }

    .rekap-filter-dropdown.is-active {
      display: block;
      animation: popoverFadeIn 0.15s ease-out;
    }

    @keyframes popoverFadeIn {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .filter-group-label {
      font-size: 13.5px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 8px;
      display: block;
    }

    .filter-select-box {
      position: relative;
      width: 100%;
      margin-bottom: 16px;
    }

    .filter-select-input {
      width: 100%;
      height: 38px;
      border: 1.5px solid #28a5de;
      border-radius: 8px;
      padding: 0 30px 0 12px;
      font-size: 13px;
      color: #334155;
      background: #ffffff;
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      box-sizing: border-box;
      transition: all 0.15s ease;
    }

    .filter-select-input::placeholder {
      color: #94a3b8;
    }

    .filter-select-arrow {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: #64748b;
      font-size: 12px;
      transition: transform 0.2s ease;
    }

    .filter-select-box.is-open .filter-select-input {
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
    }

    .filter-select-box.is-open .filter-select-arrow {
      transform: translateY(-50%) rotate(180deg);
      color: #0284c7;
    }

    .filter-options-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #ffffff;
      border: 1.5px solid #28a5de;
      border-top: none;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      z-index: 50;
      max-height: 180px;
      overflow-y: auto;
      display: none;
      padding: 4px 0;
      box-sizing: border-box;
    }

    .filter-select-box.is-open .filter-options-list {
      display: block;
    }

    .rekap-filter-item {
      padding: 8px 12px;
      font-size: 12.5px;
      color: #475569;
      cursor: pointer;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .rekap-filter-item:hover {
      background: #f0f9ff;
      color: #0284c7;
    }

    .rekap-filter-item.is-selected {
      background: #e0f2fe;
      color: #0284c7;
      font-weight: 600;
    }

    .filter-actions-row {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .btn-filter-reset {
      flex: 1;
      height: 38px;
      border: 1.5px solid #28a5de;
      border-radius: 8px;
      background: #ffffff;
      color: #0f172a;
      font-size: 13.5px;
      font-weight: 700;
      font-style: italic;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
    }

    .btn-filter-reset:hover {
      background: #f0f9ff;
      border-color: #0076c5;
    }

    .btn-filter-apply {
      flex: 1;
      height: 38px;
      border: none;
      border-radius: 8px;
      background: #28a5de;
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 700;
      font-style: italic;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 1px 3px rgba(40, 165, 222, 0.25);
    }

    .btn-filter-apply:hover {
      background: #0076c5;
    }

    /* ===== DUAL MONTH CALENDAR POPOVER ===== */
    .rekap-calendar-popover {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 580px;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
      padding: 16px 18px;
      z-index: 200;
      box-sizing: border-box;
      display: none;
    }

    .rekap-calendar-popover.is-active {
      display: block;
      animation: popoverFadeIn 0.15s ease-out;
    }

    .calendar-popover-content {
      display: flex;
      gap: 16px;
    }

    .calendar-presets-col {
      width: 130px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-right: 1px solid #e2e8f0;
      padding-right: 12px;
    }

    .calendar-preset-btn {
      padding: 6px 10px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      background: #f8fafc;
      color: #334155;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.12s ease;
    }

    .calendar-preset-btn:hover {
      background: #e0f2fe;
      border-color: #28a5de;
      color: #0284c7;
    }

    .calendar-months-col {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .month-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #1e293b;
    }

    .month-nav-btn {
      width: 24px;
      height: 24px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      background: #ffffff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #475569;
    }

    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      text-align: center;
    }

    .month-day-name {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      padding: 4px 0;
    }

    .month-day {
      font-size: 12px;
      padding: 6px 0;
      border-radius: 4px;
      cursor: pointer;
      color: #334155;
      user-select: none;
    }

    .month-day:hover {
      background: #f1f5f9;
    }

    .month-day.is-selected {
      background: #0284c7 !important;
      color: #ffffff !important;
      font-weight: 600;
    }

    .month-day.in-range {
      background: #e0f2fe;
      color: #0284c7;
    }

    .calendar-popover-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #e2e8f0;
      margin-top: 14px;
      padding-top: 12px;
    }

    .calendar-range-text {
      font-size: 12.5px;
      color: #475569;
      font-style: italic;
    }

    .calendar-footer-actions {
      display: flex;
      gap: 8px;
    }

    .btn-cal-cancel {
      padding: 6px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #ffffff;
      color: #475569;
      font-size: 12.5px;
      cursor: pointer;
    }

    .btn-cal-apply {
      padding: 6px 16px;
      border: none;
      border-radius: 6px;
      background: #28a5de;
      color: #ffffff;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    /* ===== TABLE & STICKY COLUMN ===== */
    .rekap-table-wrap {
      width: 100%;
      overflow-x: auto;
      min-height: 380px;
    }

    .rekap-table {
      width: 100%;
      border-collapse: separate !important; border-spacing: 0 !important;
      font-size: 13px;
      white-space: nowrap;
    }

    .rekap-table thead th {
      padding: 12px 14px;
      font-weight: 600;
      color: #0f172a !important;
      background: #f4f4f5 !important;
      border-bottom: 1px solid #e4e4e7 !important;
      text-align: left;
      white-space: nowrap;
      text-transform: none;
      font-size: 13.5px;
    }

    .rekap-table tbody td {
      padding: 12px 14px;
      border-bottom: 1px solid #f1f5f9;
      color: #334155;
      vertical-align: middle;
    }

    .rekap-table tbody tr:hover {
      background-color: #f8fafc;
    }

    .rekap-table tbody tr:hover td.col-sticky-action {
      background-color: #f8fafc !important;
    }

    .rekap-cell-italic {
      font-style: italic;
    }

    /* Sticky Action Column */
    .rekap-table th.col-sticky-action,
    .rekap-table td.col-sticky-action {
      position: sticky !important;
      right: 0 !important;
      z-index: 10;
      background-color: #ffffff !important;
      border-left: 1px solid #e2e8f0 !important;
      box-shadow: -4px 0 8px -2px rgba(0, 0, 0, 0.05);
      text-align: center !important;
    }

    .rekap-table th.col-sticky-action {
      position: sticky !important;
      right: 0 !important;
      z-index: 11;
      background-color: #f4f4f5 !important;
      border-left: 1px solid #e2e8f0 !important;
      box-shadow: -4px 0 8px -2px rgba(0, 0, 0, 0.05);
      text-align: center !important;
    }

    /* Action View Button (Cyan rounded-square with eye icon - Sesuai Permintaan) */
    .btn-rekap-view {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: #28a5de;
      color: #ffffff;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s ease;
      box-shadow: 0 1px 3px rgba(40, 165, 222, 0.3);
    }

    .btn-rekap-view:hover {
      background: #0284c7;
      transform: translateY(-1px);
      box-shadow: 0 3px 6px rgba(40, 165, 222, 0.4);
    }

    .btn-rekap-view svg {
      width: 17px;
      height: 17px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Badges Margin */
    .badge-margin {
      display: inline-block;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 12px;
      text-align: center;
    }

    .badge-margin-positive {
      background: #dcfce7;
      color: #15803d;
    }

    .badge-margin-negative {
      background: #fee2e2;
      color: #b91c1c;
    }

    .badge-margin-na {
      background: #f1f5f9;
      color: #64748b;
      font-weight: 500;
    }

    /* ==========================================================================
       MODAL DETAIL: "Lihat Rekap Divisi" (100% PERSIS SCREENSHOT 2)
       ========================================================================== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      overflow-y: auto;
    }

    .modal-overlay.is-active,
    .modal-overlay.is-open {
      display: flex !important;
      opacity: 1 !important;
      pointer-events: auto !important;
      visibility: visible !important;
    }

    .rekap-modal-box {
      background: #ffffff;
      border-radius: 14px;
      width: 100%;
      max-width: 820px;
      margin: auto;
      overflow: visible !important;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      position: relative;
      border: 1px solid #e2e8f0;
      box-sizing: border-box;
      animation: modalFadeIn 0.2s ease-out;
    }

    @keyframes modalFadeIn {
      from {
        opacity: 0;
        transform: scale(0.97) translateY(8px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal-accent-line {
      height: 3.5px;
      background: #0076C5;
      width: 100%;
      border-radius: 14px 14px 0 0;
    }

    .modal-inner-padding {
      padding: 24px 28px 28px;
    }

    .modal-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .modal-title-text {
      font-size: 18px;
      font-weight: 600;
      color: #1e293b;
      margin: 0;
    }

    .modal-title-text em {
      font-style: italic;
      font-weight: 700;
    }

    .btn-modal-close-x {
      width: 22px;
      height: 22px;
      border: 1px solid #71717a;
      border-radius: 4px;
      background: transparent;
      color: #1e293b;
      font-size: 13px;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      transition: all 0.15s ease;
    }

    .btn-modal-close-x:hover {
      background: #f1f5f9;
      border-color: #0f172a;
    }

    .modal-divider-dashed {
      border-bottom: 1px dashed #cbd5e1;
      margin-bottom: 20px;
    }

    /* 7 Fields Grid (Sesuai Screenshot 2) */
    .rekap-form-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px 18px;
    }

    .modal-field {
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .modal-field.span-all {
      grid-column: 1 / -1;
    }

    .modal-field-label {
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .modal-field-value {
      height: 38px;
      border: 1.2px solid #cbd5e1;
      border-radius: 8px;
      background: #f8fafc;
      padding: 0 14px;
      display: flex;
      align-items: center;
      font-size: 13px;
      color: #475569;
      font-style: italic;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* Modal Action Buttons */
    .modal-footer-row {
      margin-top: 56px;
      display: flex;
      justify-content: flex-end;
    }

    /* Button Outline Keluar (Sesuai Gambar 2) */
    .btn-modal-keluar,
    .btn-modal-outline {
      height: 38px;
      padding: 0 38px;
      border: 1.5px solid #38bdf8;
      border-radius: 6px;
      background: #ffffff;
      color: #0f172a;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-modal-keluar:hover,
    .btn-modal-outline:hover {
      background: #f0f9ff;
      border-color: #0284c7;
      color: #0284c7;
    }
  
    /* Table Styles - Consistent with Kas & Bank UI (Rounded Header Edges) */
    table,
    [class*="-table"] {
      border-collapse: separate !important;
      border-spacing: 0 !important;
    }

    thead th {
      background: #f4f4f5 !important;
      color: #0f172a !important;
      font-family: 'Outfit', sans-serif !important;
      font-size: 13.5px !important;
      font-weight: 600 !important;
      text-transform: none !important;
      letter-spacing: 0 !important;
      border-top: 1px solid #e4e4e7 !important;
      border-bottom: 1px solid #e4e4e7 !important;
      vertical-align: middle !important;
    }/* Sticky Kolom Nomor (#) - Fixed di Kiri */
    thead th:first-child,
    tbody td:first-child {
      position: sticky !important;
      left: 0 !important;
      z-index: 10 !important;
      background-color: #ffffff !important;
      border-right: 1px solid #e2e8f0 !important;
      box-shadow: 4px 0 8px -2px rgba(0, 0, 0, 0.05) !important;
      text-align: center !important;
      width: 48px !important;
      min-width: 48px !important;
      max-width: 55px !important;
    }

    thead th:first-child {
      z-index: 12 !important;
      background-color: #f4f4f5 !important;
      border-top-left-radius: 8px !important;
      border-bottom-left-radius: 8px !important;
      border-left: 1px solid #e4e4e7 !important;
      border-top: 1px solid #e4e4e7 !important;
      border-bottom: 1px solid #e4e4e7 !important;
    }

    tbody tr:hover td:first-child {
      background-color: #f8fafc !important;
    }

    thead th:last-child {
      border-top-right-radius: 8px !important;
      border-bottom-right-radius: 8px !important;
      border-right: 1px solid #e4e4e7 !important;
    }

    tbody tr {
      border-bottom: 1px solid #f1f5f9;
      transition: background 0.15s ease;
    }

    tbody td {
      border-bottom: 1px solid #f1f5f9;
      vertical-align: middle;
      color: #334155;
      font-family: 'Outfit', sans-serif;
    }

    tbody tr:hover,
    tbody tr:hover td {
      background-color: #f8fafc !important;
    }

    /* Sticky Aksi Column */
    th.col-sticky-action,
    td.col-sticky-action {
      position: sticky !important;
      right: 0 !important;
      z-index: 10;
      background-color: #ffffff !important;
      border-left: 1px solid #e2e8f0 !important;
      box-shadow: -4px 0 8px -2px rgba(0, 0, 0, 0.05);
      text-align: center !important;
    }

    th.col-sticky-action {
      z-index: 11;
      background-color: #f4f4f5 !important;

      /* ===== SAFE LOCALSTORAGE READER ===== */
      function getStoredList(primaryKey, fallbackKey, defaultData, thirdKey) {
        try {
          const keys = [primaryKey, fallbackKey, thirdKey].filter(Boolean);
          for (let i = 0; i < keys.length; i++) {
            const raw = localStorage.getItem(keys[i]);
            if (raw) {
              const parsed = JSON.parse(raw);
              if (Array.isArray(parsed) && parsed.length > 0) return parsed;
            }
          }
          // Jika ada array kosong di primaryKey dan fallback juga kosong, kembalikan array kosong dari primaryKey
          if (primaryKey) {
            const rawPri = localStorage.getItem(primaryKey);
            if (rawPri) {
              const parsedPri = JSON.parse(rawPri);
              if (Array.isArray(parsedPri)) return parsedPri;
            }
          }
        } catch (e) {
          console.warn('[Rekap Divisi] Gagal membaca storage:', e);
        }
        return Array.isArray(defaultData) ? defaultData.slice() : [];
      }

      /* ===== DAFTAR 41 DIVISI DEFAULT SESUAI MASTER COA (KOLOM Q) ===== */
      const DEFAULT_MASTER_DIVISI_LIST = [
        'Accounting', 'Agency', 'CEO Office', 'Clining Service', 'COO Office',
        'Event', 'General', 'Head Of Finance', 'Head Of Human Resource', 'Head Of IT',
        'Head Of Marketing', 'HR', 'Live HUB', 'Manager Operation', 'Manager TAP',
        'Manager TSP', 'Marketing', 'MCN', 'Pentry', 'Probability', 'Produksi',
        'SPV Account Management', 'SPV Advertiser', 'SPV Content Management', 'SPV Creative',
        'SPV IT Programer', 'SPV KOL Management', 'SPV Live Management', 'SPV Marketing',
        'Staf Account Management', 'Staf Administrasi Umum', 'Staf Advertiser',
        'Staf Content Management', 'Staf Creative', 'Staf Information Technology',
        'Staf KOL Management', 'Staf Live Management', 'Staf Marketing Communication',
        'Staf Public Relation', 'TAP', 'TSP'
      ];

      /* ===== EKSTRAKSI DIVISI DARI MASTER COA (DIVISI DEFAULT) ===== */
      function getMasterCoaContext() {
        const coaList = getStoredList(MASTER_COA_KEY, null, DEFAULT_MASTER_COA_LIST);
        const coaMap = {};
        const divSet = new Set();
        const divisions = [];

        // 1. Ambil daftar divisi dari Master Divisi / Master COA
        let masterDivList = [];
        try {
          const raw = localStorage.getItem(MASTER_DIVISI_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length > 0) {
              masterDivList = parsed.map(function (d) {
                if (typeof d === 'string') return d.trim();
                return (d.nama || d.divisi || '').trim();
              }).filter(Boolean);
            }
          }
        } catch (e) {}

        if (!masterDivList || masterDivList.length === 0) {
          masterDivList = DEFAULT_MASTER_DIVISI_LIST.slice();
        } else {
          // Pastikan semua 41 divisi default tersedia tanpa duplikasi
          DEFAULT_MASTER_DIVISI_LIST.forEach(function (def) {
            if (!masterDivList.some(function (m) { return m.toLowerCase() === def.toLowerCase(); })) {
              masterDivList.push(def);
            }
          });
        }

        masterDivList.forEach(function (d) {
          if (d && !divSet.has(d.toLowerCase())) {
            divSet.add(d.toLowerCase());
            divisions.push(d);
          }
        });

        // 2. Petakan kode COA ke Divisi Default dari Master COA
        (Array.isArray(coaList) ? coaList : []).forEach(function (c) {
          if (!c) return;
          const kode = String(c.kode || '').trim();
          const devis = String(c.devisDefault || c.divisiDefault || c.divisi || '').trim();
          if (kode && devis) {
            coaMap[kode] = devis;
          }
          if (devis && !divSet.has(devis.toLowerCase())) {
            divSet.add(devis.toLowerCase());
            divisions.push(devis);
          }
        });

        return {
          coaList: coaList,
          coaMap: coaMap,
          divisions: divisions
        };
      }

      /* ===== PENCOCOKAN DIVISI & RELASI KODE COA ===== */
      function isAliasMatch(a, b) {
        if (!a || !b) return false;
        const x = a.toLowerCase();
        const y = b.toLowerCase();
        if (x === y) return true;
        // Penanganan penamaan alias/singkatan divisi umum
        if ((x === 'hr' && (y === 'human resource' || y === 'human resource (hr)' || y === 'head of human resource')) ||
            (y === 'hr' && (x === 'human resource' || x === 'human resource (hr)' || x === 'head of human resource'))) {
          return true;
        }
        return false;
      }

      function isItemMatchDivisi(targetDiv, item, coaMap) {
        if (!targetDiv || !item) return false;
        const t = String(targetDiv).trim();

        // 1. Cek Divisi Pengecualian (jika ada pada transaksi)
        if (item.divisiPengecualian && item.divisiPengecualian !== '-' && String(item.divisiPengecualian).trim()) {
          const exc = String(item.divisiPengecualian).trim();
          if (exc.toLowerCase() === t.toLowerCase() || isAliasMatch(exc, t)) {
            return true;
          }
        }

        // 2. Cek Divisi dari transaksi
        if (item.divisi && String(item.divisi).trim() && String(item.divisi).trim() !== '-') {
          const d = String(item.divisi).trim();
          if (d.toLowerCase() === t.toLowerCase() || isAliasMatch(d, t)) {
            return true;
          }
        }

        // 3. Cek Divisi Default dari Kode COA (Master COA)
        if (item.kodeCoa && coaMap) {
          const coaDiv = String(coaMap[String(item.kodeCoa).trim()] || '').trim();
          if (coaDiv && (coaDiv.toLowerCase() === t.toLowerCase() || isAliasMatch(coaDiv, t))) {
            return true;
          }
        }

        return false;
      }

      function isDateInRange(dateStr, startStr, endStr) {
        if (!startStr && !endStr) return true;
        if (!dateStr) return true;
        const d = String(dateStr).trim().substring(0, 10);
        if (startStr && d < startStr) return false;
        if (endStr && d > endStr) return false;
        return true;
      }

      /* ===== PERHITUNGAN AGREGASI REKAP DIVISI SESUAI SPESIFIKASI =====
         1. Divisi: Auto Fill dari Master COA ( Divisi Default )
         2. Pendapatan: Auto Fill dari Pendapatan ( DPP ) => {yang Divisi nya sama}
         3. Beban: Auto Fill dari Pengeluaran & Beban ( Beban Diakui ) => {yang Divisi nya sama}
         4. Payroll: Auto Fill dari Payroll ( Beban Bruto ) => {yang Divisi nya sama}
         5. Penyusutan: Auto Fill dari Penyusutan Aset => {yang Divisi nya sama}
         6. Laba Sebelum Pajak: Pendapatan - Beban - Payroll - Penyusutan
         7. Margin: Sebelum Pajak ÷ Pendapatan // Format persen (%). Kalau pendapatan 0 => "n.a."
      ================================================================ */
      function computeRekapData() {
        const coaCtx = getMasterCoaContext();
        const coaMap = coaCtx.coaMap;
        const divisions = coaCtx.divisions.slice();

        const pndList = getStoredList(PENDAPATAN_KEY, PENDAPATAN_FALLBACK_KEY, DEFAULT_PENDAPATAN_LIST);
        const expList = getStoredList(PENGELUARAN_KEY, PENGELUARAN_FALLBACK_KEY, DEFAULT_PENGELUARAN_LIST);
        const payList = getStoredList(PAYROLL_KEY, PAYROLL_FALLBACK_KEY, DEFAULT_PAYROLL_LIST, PAYROLL_LEGACY_KEY);
        const astList = getStoredList(PENYUSUTAN_KEY, DAFTAR_ASET_KEY, DEFAULT_PENYUSUTAN_LIST);

        // Kumpulkan divisi dari transaksi yang mungkin belum terdaftar di Master COA
        const divSet = new Set(divisions.map(function (d) { return d.toLowerCase(); }));
        [pndList, expList, payList, astList].forEach(function (list) {
          (Array.isArray(list) ? list : []).forEach(function (it) {
            if (!it) return;
            const d = String(it.divisi || (it.kodeCoa && coaMap[it.kodeCoa]) || '').trim();
            if (d && !divSet.has(d.toLowerCase())) {
              divSet.add(d.toLowerCase());
              divisions.push(d);
            }
          });
        });

        // Hitung agregasi per divisi
        const aggregated = divisions.map(function (divName, idx) {
          // 1. Pendapatan (DPP)
          let pendapatan = 0;
          pndList.forEach(function (p) {
            if (!p) return;
            if (isDateInRange(p.tanggalPengakuan, filterState.startDate, filterState.endDate)) {
              if (isItemMatchDivisi(divName, p, coaMap)) {
                pendapatan += Number(p.dpp) || 0;
              }
            }
          });

          // 2. Beban (Beban Diakui)
          let beban = 0;
          expList.forEach(function (e) {
            if (!e) return;
            if (isDateInRange(e.tanggalPengakuan, filterState.startDate, filterState.endDate)) {
              if (isItemMatchDivisi(divName, e, coaMap)) {
                beban += Number(e.bebanDiAkui !== undefined ? e.bebanDiAkui : (e.bebanDiakui !== undefined ? e.bebanDiakui : (e.dpp || 0))) || 0;
              }
            }
          });

          // 3. Payroll (Beban Bruto)
          let payroll = 0;
          payList.forEach(function (py) {
            if (!py) return;
            if (isItemMatchDivisi(divName, py, coaMap)) {
              payroll += Number(py.bebanBruto !== undefined ? py.bebanBruto : (py.totalGajiBruto !== undefined ? py.totalGajiBruto : (py.gajiBruto || 0))) || 0;
            }
          });

          // 4. Penyusutan (Beban Bulan Ini / Penyusutan Bulan)
          let penyusutan = 0;
          astList.forEach(function (ast) {
            if (!ast) return;
            if (isItemMatchDivisi(divName, ast, coaMap)) {
              penyusutan += Number(ast.bebanBulanIni !== undefined ? ast.bebanBulanIni : (ast.penyusutanBulan !== undefined ? ast.penyusutanBulan : (ast.perBulan || 0))) || 0;
            }
          });

          // 5. Laba Sebelum Pajak: Pendapatan - Beban - Payroll - Penyusutan
          const labaSebelumPajak = pendapatan - beban - payroll - penyusutan;

          // 6. Margin: Sebelum Pajak ÷ Pendapatan // Format persen (%). Kalau pendapatan 0 => "n.a."
          let margin = 'n.a.';
          if (pendapatan !== 0) {
            margin = Number(((labaSebelumPajak / pendapatan) * 100).toFixed(1));
          }

          return {
            id: 'DIV-' + String(idx + 1).padStart(3, '0'),
            divisi: divName,
            pendapatan: pendapatan,
            beban: beban,
            payroll: payroll,
            penyusutan: penyusutan,
            labaSebelumPajak: labaSebelumPajak,
            margin: margin
          };
        });

        return {
          data: aggregated,
          divisions: divisions
        };
      }

      // State Filters
      let filterState = {
        search: '',
        divisi: '',
        marginStatus: '',
        startDate: '',
        endDate: ''
      };

      // Komputasi data awal
      let rekapResult = computeRekapData();
      let rekapData = rekapResult.data;
      let divisiOptions = ['Semua Divisi'].concat(rekapResult.divisions);

      function refreshRekapData() {
        rekapResult = computeRekapData();
        rekapData = rekapResult.data;
        divisiOptions = ['Semua Divisi'].concat(rekapResult.divisions);
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(rekapData));
        } catch (e) {
          console.warn('[Rekap Divisi] Gagal cache data:', e);
        }
        renderDivisiFilterList(filterDivisi ? filterDivisi.value : '');
        renderTable();
      }

      const tableBody = document.getElementById('rekapTableBody');
      const searchInput = document.getElementById('rekapSearch');
      const btnExportExcel = document.getElementById('btnExportExcel');

      // Modal Elements (Sesuai Gambar)
      const detailModal = document.getElementById('rekapDetailModal');
      const detailDivisi = document.getElementById('detailDivisi');
      const detailPendapatan = document.getElementById('detailPendapatan');
      const detailBeban = document.getElementById('detailBeban');
      const detailPayroll = document.getElementById('detailPayroll');
      const detailPenyusutan = document.getElementById('detailPenyusutan');
      const detailLabaSebelumPajak = document.getElementById('detailLabaSebelumPajak');
      const detailMargin = document.getElementById('detailMargin');
      const btnCloseDetailX = document.getElementById('btnCloseDetailX');
      const btnKeluarDetail = document.getElementById('btnKeluarDetail');

      // Filter Funnel Popover Elements
      const btnFilter = document.getElementById('btnFilter');
      const filterDropdown = document.getElementById('filterDropdown');
      const filterDivisi = document.getElementById('filterDivisi');
      const boxFilterDivisi = document.getElementById('boxFilterDivisi');
      const listFilterDivisi = document.getElementById('listFilterDivisi');
      const btnResetFilter = document.getElementById('btnResetFilter');
      const btnApplyFilter = document.getElementById('btnApplyFilter');

      // Calendar Filter Elements
      const btnCalendar = document.getElementById('btnCalendar');
      const calendarDropdown = document.getElementById('calendarDropdown');
      const labelMonth1 = document.getElementById('labelMonth1');
      const labelMonth2 = document.getElementById('labelMonth2');
      const gridMonth1 = document.getElementById('gridMonth1');
      const gridMonth2 = document.getElementById('gridMonth2');
      const btnPrevMonth = document.getElementById('btnPrevMonth');
      const btnNextMonth = document.getElementById('btnNextMonth');
      const calendarRangeDisplay = document.getElementById('calendarRangeDisplay');
      const btnCancelCalendar = document.getElementById('btnCancelCalendar');
      const btnApplyCalendar = document.getElementById('btnApplyCalendar');

      /* ===== FORMATTING UTILITIES ===== */
      function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function formatRupiahSpasi(num) {
        const val = Math.round(Number(num) || 0);
        return 'Rp ' + val.toLocaleString('id-ID');
      }

      function formatMarginPercent(num) {
        if (num === 'n.a.' || num === null || num === undefined || isNaN(num)) {
          return 'n.a.';
        }
        const val = Number(num);
        return val.toFixed(1) + '%';
      }

      function closeModals() {
        if (detailModal) detailModal.classList.remove('is-active');
      }

      function openViewRekap(id) {
        const item = rekapData.find(function (x) { return String(x.id) === String(id); });
        if (!item) return;

        if (detailDivisi) detailDivisi.textContent = item.divisi || '-';
        if (detailPendapatan) detailPendapatan.textContent = formatRupiahSpasi(item.pendapatan);
        if (detailBeban) detailBeban.textContent = item.beban ? formatRupiahSpasi(item.beban) : 'Rp. 0';
        if (detailPayroll) detailPayroll.textContent = item.payroll ? formatRupiahSpasi(item.payroll) : 'Rp. 0';
        if (detailPenyusutan) detailPenyusutan.textContent = item.penyusutan ? formatRupiahSpasi(item.penyusutan) : 'Rp. 0';
        if (detailLabaSebelumPajak) detailLabaSebelumPajak.textContent = formatRupiahSpasi(item.labaSebelumPajak);
        if (detailMargin) {
          detailMargin.textContent = (item.pendapatan === 0 || item.margin === 'n.a.') ? 'n.a.' : formatMarginPercent(item.margin);
        }

        if (detailModal) detailModal.classList.add('is-active');
      }

      /* ===== FILTERING LOGIC ===== */
      function getFilteredData() {
        return rekapData.filter(function (item) {
          if (filterState.search) {
            const q = filterState.search.toLowerCase();
            const matchDiv = (item.divisi || '').toLowerCase().includes(q);
            if (!matchDiv) return false;
          }

          if (filterState.divisi && filterState.divisi !== 'Semua Divisi') {
            if ((item.divisi || '').trim().toLowerCase() !== filterState.divisi.toLowerCase()) return false;
          }

          return true;
        });
      }

      /* ===== RENDER TABLE ===== */
      function renderTable() {
        if (!tableBody) return;
        const filtered = getFilteredData();
        tableBody.innerHTML = '';

        if (filtered.length === 0) {
          const emptyRow = document.createElement('tr');
          emptyRow.innerHTML = '<td colspan="9" style="text-align: center; padding: 48px 16px; color: #94a3b8; font-style: italic;">' +
            'Tidak ada data rekap divisi yang sesuai' +
            '</td>';
          tableBody.appendChild(emptyRow);
          return;
        }

        filtered.forEach(function (item, idx) {
          const tr = document.createElement('tr');

          let marginBadge = '';
          if (item.margin === 'n.a.' || item.pendapatan === 0) {
            marginBadge = '<span class="badge-margin badge-margin-na">n.a.</span>';
          } else if (Number(item.margin) >= 0) {
            marginBadge = '<span class="badge-margin badge-margin-positive">' + escapeHtml(formatMarginPercent(item.margin)) + '</span>';
          } else {
            marginBadge = '<span class="badge-margin badge-margin-negative">' + escapeHtml(formatMarginPercent(item.margin)) + '</span>';
          }

          tr.innerHTML = [
            '<td style="text-align: center; color: #64748b; font-size: 13px;">' + (idx + 1) + '</td>',
            '<td style="font-weight: 600; color: #0f172a;">' + escapeHtml(item.divisi) + '</td>',
            '<td class="rekap-cell-italic" style="text-align: right; font-weight: 500; color: #0284c7;">' + escapeHtml(formatRupiahSpasi(item.pendapatan)) + '</td>',
            '<td class="rekap-cell-italic" style="text-align: right; color: #475569;">' + escapeHtml(item.beban ? formatRupiahSpasi(item.beban) : 'Rp. 0') + '</td>',
            '<td class="rekap-cell-italic" style="text-align: right; color: #475569;">' + escapeHtml(item.payroll ? formatRupiahSpasi(item.payroll) : 'Rp. 0') + '</td>',
            '<td class="rekap-cell-italic" style="text-align: right; color: #475569;">' + escapeHtml(item.penyusutan ? formatRupiahSpasi(item.penyusutan) : 'Rp. 0') + '</td>',
            '<td class="rekap-cell-italic" style="text-align: right; font-weight: 600; color: #0f172a;">' + escapeHtml(formatRupiahSpasi(item.labaSebelumPajak)) + '</td>',
            '<td style="text-align: right;">' + marginBadge + '</td>',
            '<td class="col-sticky-action" style="text-align: center;">' +
              '<button type="button" class="btn-rekap-view" data-view-id="' + escapeHtml(item.id) + '" aria-label="Lihat Detail" title="Lihat Rekap Divisi">' +
                '<svg viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>' +
              '</button>' +
            '</td>'
          ].join('');

          tableBody.appendChild(tr);
        });
      }

      /* ===== TABLE VIEW ACTION LISTENER ===== */
      if (tableBody) {
        tableBody.addEventListener('click', function (e) {
          const viewBtn = e.target.closest('[data-view-id]');
          if (viewBtn) {
            e.stopPropagation();
            const id = viewBtn.getAttribute('data-view-id');
            openViewRekap(id);
          }
        });
      }

      if (btnCloseDetailX) {
        btnCloseDetailX.addEventListener('click', closeModals);
      }
      if (btnKeluarDetail) {
        btnKeluarDetail.addEventListener('click', closeModals);
      }

      /* ===== SEARCH REAL-TIME ===== */
      if (searchInput) {
        searchInput.addEventListener('input', function () {
          filterState.search = this.value.trim();
          renderTable();
        });
      }

      /* ===== DROPDOWN FILTER POPOVER (SINKRON DARI MASTER COA) ===== */
      let selectedDivisi = '';

      function renderDivisiFilterList(query) {
        if (!listFilterDivisi) return;
        listFilterDivisi.innerHTML = '';
        const q = (query || '').toLowerCase().trim();

        const filteredOpts = divisiOptions.filter(function (opt) {
          if (!q) return true;
          return opt.toLowerCase().includes(q);
        });

        if (filteredOpts.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'rekap-filter-item';
          empty.style.color = '#94a3b8';
          empty.style.fontStyle = 'italic';
          empty.textContent = 'Tidak ditemukan';
          listFilterDivisi.appendChild(empty);
          return;
        }

        filteredOpts.forEach(function (opt) {
          const item = document.createElement('div');
          item.className = 'rekap-filter-item';
          if (selectedDivisi === opt || (!selectedDivisi && opt === 'Semua Divisi')) {
            item.classList.add('is-selected');
          }
          item.textContent = opt;
          item.addEventListener('click', function (e) {
            e.stopPropagation();
            if (opt === 'Semua Divisi') {
              selectedDivisi = '';
              filterDivisi.value = '';
              filterDivisi.placeholder = 'Pilih Divisi';
            } else {
              selectedDivisi = opt;
              filterDivisi.value = opt;
            }
            closeDivisiFilter();
          });
          listFilterDivisi.appendChild(item);
        });
      }

      function openDivisiFilter() {
        if (!boxFilterDivisi) return;
        boxFilterDivisi.classList.add('is-open');
        filterDivisi.placeholder = 'Cari Divisi';
        renderDivisiFilterList(filterDivisi.value);
      }

      function closeDivisiFilter() {
        if (!boxFilterDivisi) return;
        boxFilterDivisi.classList.remove('is-open');
        if (selectedDivisi) {
          filterDivisi.value = selectedDivisi;
        } else {
          filterDivisi.value = '';
          filterDivisi.placeholder = 'Pilih Divisi';
        }
      }

      if (filterDivisi) {
        filterDivisi.addEventListener('click', function (e) {
          e.stopPropagation();
          const isOpen = boxFilterDivisi.classList.contains('is-open');
          if (isOpen) {
            closeDivisiFilter();
          } else {
            openDivisiFilter();
          }
        });

        filterDivisi.addEventListener('input', function () {
          if (!boxFilterDivisi.classList.contains('is-open')) {
            boxFilterDivisi.classList.add('is-open');
          }
          renderDivisiFilterList(this.value);
        });
      }

      if (btnFilter) {
        btnFilter.addEventListener('click', function (e) {
          e.stopPropagation();
          if (calendarDropdown) calendarDropdown.classList.remove('is-active');
          filterDropdown.classList.toggle('is-active');
          if (!filterDropdown.classList.contains('is-active')) {
            closeDivisiFilter();
          }
        });
      }

      if (btnResetFilter) {
        btnResetFilter.addEventListener('click', function (e) {
          e.stopPropagation();
          selectedDivisi = '';
          filterDivisi.value = '';
          filterDivisi.placeholder = 'Pilih Divisi';
          filterState.divisi = '';
          closeDivisiFilter();
          filterDropdown.classList.remove('is-active');
          renderTable();
        });
      }

      if (btnApplyFilter) {
        btnApplyFilter.addEventListener('click', function (e) {
          e.stopPropagation();
          filterState.divisi = selectedDivisi || filterDivisi.value.trim();
          if (filterState.divisi === 'Semua Divisi') filterState.divisi = '';
          closeDivisiFilter();
          filterDropdown.classList.remove('is-active');
          renderTable();
        });
      }

      /* ===== DUAL MONTH CALENDAR PICKER ===== */
      let calendarBaseDate = new Date(2026, 5, 1);
      let tempCalStart = null;
      let tempCalEnd = null;

      const monthNamesIndo = [
        'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
        'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
      ];
      const dayNames = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];

      function renderDualCalendar() {
        if (!gridMonth1 || !gridMonth2) return;

        const m1 = new Date(calendarBaseDate.getFullYear(), calendarBaseDate.getMonth(), 1);
        const m2 = new Date(calendarBaseDate.getFullYear(), calendarBaseDate.getMonth() + 1, 1);

        labelMonth1.textContent = monthNamesIndo[m1.getMonth()] + ' ' + m1.getFullYear();
        labelMonth2.textContent = monthNamesIndo[m2.getMonth()] + ' ' + m2.getFullYear();

        renderSingleMonthGrid(gridMonth1, m1);
        renderSingleMonthGrid(gridMonth2, m2);
        updateCalendarDisplayFooter();
      }

      function renderSingleMonthGrid(container, monthDate) {
        container.innerHTML = '';
        dayNames.forEach(function (d) {
          const header = document.createElement('div');
          header.className = 'month-day-name';
          header.textContent = d;
          container.appendChild(header);
        });

        const y = monthDate.getFullYear();
        const m = monthDate.getMonth();
        const firstDay = new Date(y, m, 1).getDay();
        const totalDays = new Date(y, m + 1, 0).getDate();

        for (let i = 0; i < firstDay; i++) {
          const blank = document.createElement('div');
          container.appendChild(blank);
        }

        for (let d = 1; d <= totalDays; d++) {
          const cell = document.createElement('div');
          cell.className = 'month-day';
          cell.textContent = d;

          const dateStr = y + '-' + String(m + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');

          if (tempCalStart && dateStr === tempCalStart) {
            cell.classList.add('is-selected');
          }
          if (tempCalEnd && dateStr === tempCalEnd) {
            cell.classList.add('is-selected');
          }
          if (tempCalStart && tempCalEnd && dateStr > tempCalStart && dateStr < tempCalEnd) {
            cell.classList.add('in-range');
          }

          cell.addEventListener('click', function (e) {
            e.stopPropagation();
            if (!tempCalStart || (tempCalStart && tempCalEnd)) {
              tempCalStart = dateStr;
              tempCalEnd = null;
            } else if (tempCalStart && !tempCalEnd) {
              if (dateStr >= tempCalStart) {
                tempCalEnd = dateStr;
              } else {
                tempCalEnd = tempCalStart;
                tempCalStart = dateStr;
              }
            }
            renderDualCalendar();
          });

          container.appendChild(cell);
        }
      }

      function updateCalendarDisplayFooter() {
        if (!calendarRangeDisplay) return;
        if (tempCalStart && tempCalEnd) {
          calendarRangeDisplay.textContent = tempCalStart + ' s/d ' + tempCalEnd;
        } else if (tempCalStart) {
          calendarRangeDisplay.textContent = 'Mulai: ' + tempCalStart;
        } else {
          calendarRangeDisplay.textContent = 'Semua Tanggal';
        }
      }

      if (btnPrevMonth) {
        btnPrevMonth.addEventListener('click', function (e) {
          e.stopPropagation();
          calendarBaseDate.setMonth(calendarBaseDate.getMonth() - 1);
          renderDualCalendar();
        });
      }

      if (btnNextMonth) {
        btnNextMonth.addEventListener('click', function (e) {
          e.stopPropagation();
          calendarBaseDate.setMonth(calendarBaseDate.getMonth() + 1);
          renderDualCalendar();
        });
      }

      if (btnCalendar) {
        btnCalendar.addEventListener('click', function (e) {
          e.stopPropagation();
          if (filterDropdown) filterDropdown.classList.remove('is-active');
          calendarDropdown.classList.toggle('is-active');
          if (calendarDropdown.classList.contains('is-active')) {
            renderDualCalendar();
          }
        });
      }

      document.querySelectorAll('.calendar-preset-btn').forEach(function (btn) {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          const preset = this.getAttribute('data-preset');
          const now = new Date(2026, 5, 15);
          const curY = now.getFullYear();
          const curM = String(now.getMonth() + 1).padStart(2, '0');
          const lastD = new Date(curY, now.getMonth() + 1, 0).getDate();

          if (preset === 'today') {
            const todayStr = curY + '-' + curM + '-15';
            tempCalStart = todayStr;
            tempCalEnd = todayStr;
          } else if (preset === 'this-month') {
            tempCalStart = curY + '-' + curM + '-01';
            tempCalEnd = curY + '-' + curM + '-' + String(lastD).padStart(2, '0');
          } else if (preset === 'last-month') {
            const prevMonthDate = new Date(curY, now.getMonth() - 1, 1);
            const pY = prevMonthDate.getFullYear();
            const pM = String(prevMonthDate.getMonth() + 1).padStart(2, '0');
            const pLastD = new Date(pY, prevMonthDate.getMonth() + 1, 0).getDate();
            tempCalStart = pY + '-' + pM + '-01';
            tempCalEnd = pY + '-' + pM + '-' + String(pLastD).padStart(2, '0');
          } else if (preset === 'this-year') {
            tempCalStart = curY + '-01-01';
            tempCalEnd = curY + '-12-31';
          } else if (preset === 'reset') {
            tempCalStart = null;
            tempCalEnd = null;
          }
          renderDualCalendar();
        });
      });

      if (btnCancelCalendar) {
        btnCancelCalendar.addEventListener('click', function (e) {
          e.stopPropagation();
          calendarDropdown.classList.remove('is-active');
        });
      }

      if (btnApplyCalendar) {
        btnApplyCalendar.addEventListener('click', function (e) {
          e.stopPropagation();
          filterState.startDate = tempCalStart;
          filterState.endDate = tempCalEnd;
          calendarDropdown.classList.remove('is-active');
          refreshRekapData();
        });
      }

      /* ===== EXCEL EXPORT (ACTIVE OFFICIAL MICROSOFT EXCEL ENGINE) ===== */
      async function exportRekapExcel() {
        const rows = getFilteredData();
        if (!rows || rows.length === 0) {
          if (typeof Swal !== 'undefined') {
            Swal.fire({ icon: 'warning', title: 'Data Kosong', text: 'Tidak ada data rekap divisi untuk diekspor.' });
          }
          return;
        }

        const filename = 'Laporan_Rekap_Divisi_' + new Date().toISOString().slice(0, 10) + '.xlsx';
        const headers = [
          'No',
          'Divisi',
          'Pendapatan',
          'Beban',
          'Payroll',
          'Penyusutan',
          'Laba Sebelum Pajak',
          'Margin (%)'
        ];

        const exportData = rows.map(function (item, idx) {
          return [
            idx + 1,
            item.divisi || '-',
            item.pendapatan || 0,
            item.beban || 0,
            item.payroll || 0,
            item.penyusutan || 0,
            item.labaSebelumPajak || 0,
            (item.margin === 'n.a.' || item.pendapatan === 0) ? 'n.a.' : formatMarginPercent(item.margin)
          ];
        });

        if (typeof window.exportBisaExcel === 'function') {
          await window.exportBisaExcel({
            title: 'LAPORAN REKAPITULASI KINERJA KEUANGAN PER DIVISI',
            filename: filename,
            sheetName: 'Rekap Divisi',
            headers: headers,
            rows: exportData
          });
        } else if (typeof window.exportTableToExcel === 'function') {
          await window.exportTableToExcel('rekapTable', filename, 'LAPORAN REKAP DIVISI');
        } else {
          let csv = headers.join(',') + '\n';
          exportData.forEach(function (r) {
            csv += r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(',') + '\n';
          });
          const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.setAttribute('href', url);
          link.setAttribute('download', filename.replace('.xlsx', '.csv'));
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        }
      }
      window.exportRekapExcel = exportRekapExcel;

      if (btnExportExcel) {
        btnExportExcel.addEventListener('click', exportRekapExcel);
      }

      /* ===== GLOBAL CLICK LISTENER (TUTUP POPUP & MODAL) ===== */
      document.addEventListener('click', function (e) {
        if (!e.target.closest('#filterDropdown') && !e.target.closest('#btnFilter')) {
          if (filterDropdown) filterDropdown.classList.remove('is-active');
          closeDivisiFilter();
        } else if (!e.target.closest('#boxFilterDivisi')) {
          closeDivisiFilter();
        }
        if (!e.target.closest('#calendarDropdown') && !e.target.closest('#btnCalendar')) {
          if (calendarDropdown) calendarDropdown.classList.remove('is-active');
        }
        if (e.target === detailModal) {
          closeModals();
        }
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          closeModals();
          if (filterDropdown) filterDropdown.classList.remove('is-active');
          if (calendarDropdown) calendarDropdown.classList.remove('is-active');
        }
      });

      /* ===== AUTO REAL-TIME UPDATE EVENT LISTENERS ===== */
      window.addEventListener('storage', function (e) {
        if (!e.key || [
          MASTER_COA_KEY,
          MASTER_DIVISI_KEY,
          PENDAPATAN_KEY,
          PENDAPATAN_FALLBACK_KEY,
          PENGELUARAN_KEY,
          PENGELUARAN_FALLBACK_KEY,
          PAYROLL_KEY,
          PAYROLL_FALLBACK_KEY,
          PAYROLL_LEGACY_KEY,
          PENYUSUTAN_KEY,
          DAFTAR_ASET_KEY
        ].indexOf(e.key) !== -1) {
          refreshRekapData();
        }
      });

      window.addEventListener('payroll_data_changed', refreshRekapData);
      window.addEventListener('focus', refreshRekapData);
      window.addEventListener('pageshow', refreshRekapData);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) refreshRekapData();
      });
      window.addEventListener('accounting-rekap-sync', refreshRekapData);

      // Initial Render
      refreshRekapData();
    });
  </script>
</body>

</html>
