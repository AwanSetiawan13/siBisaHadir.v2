<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budget vs Actual | Bisa Media</title>
  <link rel="stylesheet" href="../../assets/css/style.css?v=20261031" />
  <link rel="icon" type="image/png" href="../../media/logo.png" />

  <!-- Fonts & SweetAlert2 -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    /* Global Font & Reset */
    body {
      font-family: 'Outfit', sans-serif;
      color: #334155;
      background-color: #f8fafc;
      margin: 0;
      padding: 0;
    }

    /* Main Container Card */
    .budget-panel {
      position: relative;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
      padding: 20px !important;
      margin-bottom: 24px;
      overflow: visible !important;
      min-height: 440px;
      box-sizing: border-box;
    }

    /* Brand Top Accent Line (Persis Screenshot 1 & 2) */
    .budget-panel-accent {
      height: 3.5px;
      background: #0076C5;
      width: 100% !important;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
      margin: 0 0 16px 0 !important;
    }

    /* ===== TOOLBAR (Persis Screenshot 1 & 2) ===== */
    .budget-toolbar {
      padding: 0 0 14px 0 !important;
      margin: 0 0 14px 0 !important;
      background: transparent !important;
      border-bottom: 1px dashed #cbd5e1 !important;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      position: relative;
      z-index: 50;
    }

    .toolbar-left-group {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Toolbar Square Icon Buttons */
    .btn-toolbar-icon {
      width: 34px;
      height: 34px;
      padding: 0;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      color: #3b82f6;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      transition: all 0.15s ease;
      position: relative;
    }

    .btn-toolbar-icon:hover {
      border-color: #0284c7;
      color: #0284c7;
      background: #f0f9ff;
    }

    .btn-toolbar-icon svg {
      width: 17px;
      height: 17px;
      stroke-width: 2;
    }

    /* Official Excel Icon (Green #107c41) */
    .btn-toolbar-icon.btn-excel {
      color: #107c41;
      border-color: #cbd5e1;
    }

    .btn-toolbar-icon.btn-excel:hover {
      background: #f0fdf4;
      border-color: #107c41;
      color: #0d6334;
    }

    /* Search Pill Input */
    .budget-search-wrapper {
      position: relative;
      width: 220px;
    }

    .budget-search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      color: #94a3b8;
      stroke: #94a3b8;
      stroke-width: 2;
      fill: none;
      pointer-events: none;
    }

    .budget-search-input {
      width: 100%;
      height: 36px;
      border: 1.2px solid #cbd5e1;
      border-radius: 18px;
      padding: 0 14px 0 34px;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      color: #1e293b;
      background: #ffffff;
      outline: none;
      box-sizing: border-box;
      transition: all 0.15s ease;
    }

    .budget-search-input:focus {
      border-color: #28a5de;
      box-shadow: 0 0 0 3px rgba(40, 165, 222, 0.15);
    }

    .budget-search-input::placeholder {
      color: #94a3b8;
      font-style: italic;
    }

    /* Tombol Tambah (Konsisten: background #28a5de, hover #0076C5, font Outfit 13px bold, + Tambah) */
    .btn-tambah-budget {
      height: 36px;
      padding: 0 18px;
      border: none;
      border-radius: 6px;
      background: #28a5de;
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 2px 4px rgba(40, 165, 222, 0.25);
      transition: background 0.15s ease, transform 0.1s ease;
      white-space: nowrap;
    }

    .btn-tambah-budget:hover {
      background: #0284c7;
      transform: translateY(-1px);
    }

    .btn-tambah-budget:active {
      transform: scale(0.98);
    }

    /* ===== FILTER FUNNEL POPOVER ===== */
    .filter-popover-wrap {
      position: relative;
    }

    .budget-filter-dropdown {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 310px;
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.14);
      z-index: 1000;
      padding: 16px 18px 18px;
      display: none;
      box-sizing: border-box;
      animation: popoverFadeIn 0.15s ease;
    }

    .budget-filter-dropdown.is-active {
      display: block;
    }

    @keyframes popoverFadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .filter-group-label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 6px;
      margin-top: 10px;
    }

    .filter-group-label:first-child {
      margin-top: 0;
    }

    .filter-select-box {
      position: relative;
      width: 100%;
    }

    .filter-select-input {
      width: 100%;
      height: 38px;
      border: 1.5px solid #28a5de;
      border-radius: 8px;
      padding: 0 30px 0 12px;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      color: #334155;
      background: #ffffff;
      outline: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      box-sizing: border-box;
      transition: all 0.15s ease;
    }

    .filter-select-input::placeholder {
      color: #94a3b8;
    }

    .filter-select-arrow {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: none;
      color: #0284c7;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .filter-select-box.is-open .filter-select-input {
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
      border-color: #28a5de;
    }

    .filter-select-box.is-open .filter-select-arrow {
      transform: translateY(-50%) rotate(180deg);
      color: #0076C5;
    }

    .filter-options-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #ffffff;
      border: 1.5px solid #28a5de;
      border-top: none;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.12);
      z-index: 1050;
      max-height: 180px;
      overflow-y: auto;
      display: none;
      padding: 4px;
      box-sizing: border-box;
    }

    .filter-select-box.is-open .filter-options-list {
      display: block;
    }

    .budget-filter-item {
      padding: 8px 12px;
      font-size: 13px;
      color: #334155;
      cursor: pointer;
      border-radius: 6px;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .budget-filter-item:hover {
      background: #f0f9ff;
      color: #0284c7;
      font-weight: 600;
    }

    .budget-filter-item.is-selected {
      background: #e0f2fe;
      color: #0284c7;
      font-weight: 600;
    }

    .filter-actions-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 18px;
    }

    .btn-filter-reset {
      flex: 1;
      height: 38px;
      border: 1.5px solid #28a5de;
      background: #f8fafc;
      color: #0f172a;
      border-radius: 8px;
      font-family: 'Outfit', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      font-style: italic;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-filter-reset:hover {
      background: #e2e8f0;
      border-color: #0284c7;
    }

    .btn-filter-apply {
      flex: 1;
      height: 38px;
      border: none;
      background: #28a5de;
      color: #ffffff;
      border-radius: 8px;
      font-family: 'Outfit', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      font-style: italic;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-filter-apply:hover {
      background: #0284c7;
    }

    /* ===== CALENDAR RANGE POPOVER ===== */
    .budget-calendar-popover {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 580px;
      background: #ffffff;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.15);
      z-index: 1000;
      display: none;
      box-sizing: border-box;
      animation: popoverFadeIn 0.15s ease;
      overflow: hidden;
    }

    .budget-calendar-popover.is-active {
      display: block;
    }

    .calendar-popover-content {
      display: flex;
      padding: 16px;
      gap: 16px;
    }

    .calendar-presets-col {
      width: 140px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-right: 1px solid #e2e8f0;
      padding-right: 14px;
    }

    .calendar-preset-btn {
      padding: 7px 10px;
      font-family: 'Outfit', sans-serif;
      font-size: 12.5px;
      text-align: left;
      background: transparent;
      border: none;
      border-radius: 6px;
      color: #475569;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .calendar-preset-btn:hover,
    .calendar-preset-btn.is-active {
      background: #e0f2fe;
      color: #0284c7;
      font-weight: 600;
    }

    .calendar-months-col {
      flex: 1;
      display: flex;
      gap: 14px;
    }

    .month-box {
      flex: 1;
    }

    .month-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #1e293b;
    }

    .month-nav-btn {
      width: 24px;
      height: 24px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      background: #ffffff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #475569;
    }

    .month-nav-btn:hover {
      background: #f1f5f9;
      color: #0284c7;
    }

    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      text-align: center;
    }

    .month-day-name {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      padding: 4px 0;
    }

    .month-day {
      padding: 6px 0;
      font-size: 12px;
      border-radius: 4px;
      cursor: pointer;
      color: #334155;
      transition: all 0.1s ease;
    }

    .month-day:hover:not(.is-empty) {
      background: #f1f5f9;
    }

    .month-day.is-empty {
      cursor: default;
    }

    .month-day.is-in-range {
      background: #e0f2fe;
      color: #0284c7;
      border-radius: 0;
    }

    .month-day.is-start-date {
      background: #0284c7 !important;
      color: #ffffff !important;
      border-radius: 4px 0 0 4px !important;
    }

    .month-day.is-end-date {
      background: #0284c7 !important;
      color: #ffffff !important;
      border-radius: 0 4px 4px 0 !important;
    }

    .month-day.is-single-date {
      background: #0284c7 !important;
      color: #ffffff !important;
      border-radius: 4px !important;
    }

    .calendar-popover-footer {
      padding: 10px 16px;
      background: #f8fafc;
      border-top: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .calendar-range-text {
      font-size: 12.5px;
      color: #475569;
      font-style: italic;
    }

    .calendar-footer-actions {
      display: flex;
      gap: 8px;
    }

    .btn-cal-cancel {
      height: 34px;
      padding: 0 18px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #f8fafc;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-cal-cancel:hover {
      background: #e2e8f0;
    }

    .btn-cal-apply {
      height: 34px;
      padding: 0 20px;
      border: none;
      border-radius: 6px;
      background: #1d68f2;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-cal-apply:hover {
      background: #1558cf;
    }

    /* ===== TABLE & HORIZONTAL SCROLL & STICKY COLUMN ===== */
    .budget-table-wrap {
      width: 100%;
      overflow-x: auto;
      min-height: 420px;
    }

    .budget-table {
      width: 100%;
      border-collapse: separate !important; border-spacing: 0 !important;
      font-size: 13px;
      white-space: nowrap;
    }

    .budget-table thead th {
      padding: 12px 14px;
      font-weight: 600;
      color: #0f172a !important;
      background: #f4f4f5 !important;
      border-bottom: 1px solid #e4e4e7 !important;
      text-align: left;
      font-size: 13.5px;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    .budget-table tbody td {
      padding: 12px 14px;
      color: #334155;
      border-bottom: 1px solid #f1f5f9;
      vertical-align: middle;
      transition: background 0.1s ease;
    }

    .budget-table tbody tr:hover td {
      background-color: #f8fafc !important;
    }

    /* Sticky Action Column (Always docked at right on scroll) */
    .col-sticky-action {
      position: sticky;
      right: 0;
      background: #ffffff;
      z-index: 10;
      box-shadow: -4px 0 8px rgba(0, 0, 0, 0.03);
      text-align: center !important;
      width: 50px;
    }

    .budget-table thead th.col-sticky-action {
      position: sticky !important;
      right: 0 !important;
      z-index: 11;
      background-color: #f4f4f5 !important;
      border-left: 1px solid #e2e8f0 !important;
      box-shadow: -4px 0 8px -2px rgba(0, 0, 0, 0.05);
      text-align: center !important;
    }

    .budget-table tbody tr:hover td.col-sticky-action {
      background-color: #f8fafc !important;
    }

    /* Three Dots Action Button */
    .btn-action-trigger {
      width: 32px;
      height: 32px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #0f172a;
      background: transparent;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .btn-action-trigger:hover {
      background: #f1f5f9;
    }

    .btn-action-trigger svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
      pointer-events: none;
    }

    /* Floating Action Menu */
    .budget-action-menu {
      position: fixed;
      background: #ffffff;
      border: 1px solid rgba(0, 0, 0, .08);
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, .14);
      z-index: 2147483000 !important;
      min-width: 145px;
      padding: 6px;
      display: none;
      animation: menuFadeIn 0.12s ease-out;
    }

    .budget-action-menu.is-open,
    .budget-action-menu.is-active {
      display: block !important;
      visibility: visible !important;
      opacity: 1 !important;
      pointer-events: auto !important;
    }

    .budget-action-menu button {
      width: 100%;
      text-align: left;
      padding: 7px 10px;
      font-family: 'Outfit', sans-serif;
      font-size: 12.5px;
      color: #334155;
      background: transparent;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.1s ease;
    }

    .budget-action-menu button:hover {
      color: #0f172a;
      background: #f1f5f9;
    }

    .budget-action-icon {
      width: 24px;
      height: 24px;
      border-radius: 5px;
      background: #0076C5;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .budget-action-icon svg {
      width: 14px;
      height: 14px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .budget-action-menu button.is-danger {
      color: #dc2626;
    }

    .budget-action-menu button.is-danger:hover {
      background: #fef2f2;
    }

    .budget-action-menu .budget-action-icon.is-danger {
      background: #dc2626;
    }

    /* Badges Status Budget */
    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 12px;
      text-align: center;
      white-space: nowrap;
    }

    .badge-under {
      background: #dcfce7;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }

    .badge-near {
      background: #fef3c7;
      color: #b45309;
      border: 1px solid #fde68a;
    }

    .badge-over {
      background: #fee2e2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }

    .badge-coa-aktif {
      background: #e0f2fe;
      color: #0284c7;
      border: 1px solid #bae6fd;
    }

    .badge-coa-nonaktif {
      background: #f1f5f9;
      color: #64748b;
      border: 1px solid #e2e8f0;
    }

    /* % Terpakai Badge */
    .percent-badge {
      font-weight: 600;
      font-size: 12px;
      display: inline-block;
      min-width: 48px;
      text-align: right;
    }

    .percent-safe {
      color: #16a34a;
    }

    .percent-warning {
      color: #d97706;
    }

    .percent-danger {
      color: #dc2626;
    }
  
    /* Table Styles - Consistent with Kas & Bank UI (Rounded Header Edges) */
    table,
    [class*="-table"] {
      border-collapse: separate !important;
      border-spacing: 0 !important;
    }

    thead th {
      background: #f4f4f5 !important;
      color: #0f172a !important;
      font-family: 'Outfit', sans-serif !important;
      font-size: 13.5px !important;
      font-weight: 600 !important;
      text-transform: none !important;
      letter-spacing: 0 !important;
      border-top: 1px solid #e4e4e7 !important;
      border-bottom: 1px solid #e4e4e7 !important;
      vertical-align: middle !important;
    }

    /* Sticky Kolom Nomor (#) - Fixed di Kiri */
    thead th:first-child,
    tbody td:first-child {
      position: sticky !important;
      left: 0 !important;
      z-index: 10 !important;
      background-color: #ffffff !important;
      border-right: 1px solid #e2e8f0 !important;
      box-shadow: 4px 0 8px -2px rgba(0, 0, 0, 0.05) !important;
      text-align: center !important;
      width: 48px !important;
      min-width: 48px !important;
      max-width: 55px !important;
    }

    thead th:first-child {
      z-index: 12 !important;
      background-color: #f4f4f5 !important;
      border-top-left-radius: 8px !important;
      border-bottom-left-radius: 8px !important;
      border-left: 1px solid #e4e4e7 !important;
      border-top: 1px solid #e4e4e7 !important;
      border-bottom: 1px solid #e4e4e7 !important;
    }

    tbody tr:hover td:first-child {
      background-color: #f8fafc !important;
    }

    thead th:last-child {
      border-top-right-radius: 8px !important;
      border-bottom-right-radius: 8px !important;
      border-right: 1px solid #e4e4e7 !important;
    }

    tbody tr {
      border-bottom: 1px solid #f1f5f9;
      transition: background 0.15s ease;
    }

    tbody td {
      border-bottom: 1px solid #f1f5f9;
      vertical-align: middle;
      color: #334155;
      font-family: 'Outfit', sans-serif;
    }

    tbody tr:hover,
    tbody tr:hover td {
      background-color: #f8fafc !important;
    }

    /* Sticky Aksi Column */
    th.col-sticky-action,
    td.col-sticky-action {
      position: sticky !important;
      right: 0 !important;
      z-index: 10;
      background-color: #ffffff !important;
      border-left: 1px solid #e2e8f0 !important;
      box-shadow: -4px 0 8px -2px rgba(0, 0, 0, 0.05);
      text-align: center !important;
    }

    th.col-sticky-action {
      z-index: 11;
      background-color: #f4f4f5 !important;
      border-top-right-radius: 8px !important;
      border-bottom-right-radius: 8px !important;

      /* ===== FORMATTING UTILITIES ===== */
      function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function formatRupiahSpasi(num) {
        const val = Math.round(Number(num) || 0);
        if (val < 0) {
          return '-Rp ' + Math.abs(val).toLocaleString('id-ID');
        }
        return 'Rp ' + val.toLocaleString('id-ID');
      }

      function getStatusBadge(status) {
        const s = (status || '').toLowerCase();
        if (s.includes('under')) {
          return '<span class="badge-status badge-under">Under Budget</span>';
        }
        if (s.includes('near') || s.includes('warning')) {
          return '<span class="badge-status badge-near">Near Budget</span>';
        }
        if (s.includes('over')) {
          return '<span class="badge-status badge-over">Over Budget</span>';
        }
        return '<span class="badge-status badge-under">' + escapeHtml(status) + '</span>';
      }

      function getStatusCOABadge(status) {
        const s = (status || '').toLowerCase();
        if (s === 'aktif') {
          return '<span class="badge-status badge-coa-aktif">Aktif</span>';
        }
        return '<span class="badge-status badge-coa-nonaktif">Non-Aktif</span>';
      }

      function getPercentBadge(percent) {
        const p = parseFloat(percent) || 0;
        let colorClass = 'percent-safe';
        if (p >= 100) {
          colorClass = 'percent-danger';
        } else if (p >= 85) {
          colorClass = 'percent-warning';
        }
        return '<span class="percent-badge ' + colorClass + '">' + p.toFixed(1) + '%</span>';
      }

      /* ===== FILTERING LOGIC ===== */
      function getFilteredData() {
        return budgetData.filter(function (item) {
          if (filterState.search) {
            const q = filterState.search.toLowerCase();
            const matchPeriode = (item.periode || '').toLowerCase().includes(q);
            const matchKode = (item.kodeCOA || '').toLowerCase().includes(q);
            const matchNama = (item.namaAkunCOA || '').toLowerCase().includes(q);
            const matchDiv = (item.divisi || '').toLowerCase().includes(q);
            const matchKel = (item.kelompokCOA || '').toLowerCase().includes(q);
            if (!matchPeriode && !matchKode && !matchNama && !matchDiv && !matchKel) return false;
          }

          if (filterState.divisi && filterState.divisi !== 'Semua Divisi') {
            if ((item.divisi || '').toLowerCase() !== filterState.divisi.toLowerCase()) return false;
          }

          if (filterState.status && filterState.status !== 'Semua Status') {
            if ((item.status || '').toLowerCase() !== filterState.status.toLowerCase()) return false;
          }

          if (filterState.kelompok && filterState.kelompok !== 'Semua Kelompok') {

          }

          return true;
        });

      /* ===== FLOATING ACTION MENU ===== */
      function closeActionMenus() {
        if (actionMenu) {

        }
        currentActionId = null;

      function openActionMenu(button) {
        if (!actionMenu || !button) return;
        const id = button.getAttribute('data-action-toggle');

        if ((actionMenu.classList.contains('is-open') || actionMenu.classList.contains('is-active')) && String(currentActionId) === String(id)) {
          closeActionMenus();
          return;
        }

        currentActionId = id;
        actionMenu.classList.add('is-open');
        actionMenu.classList.add('is-active');

        const rect = button.getBoundingClientRect();
        const menuWidth = actionMenu.offsetWidth || 145;
        const menuHeight = actionMenu.offsetHeight || 130;

        let left = rect.left - menuWidth + 24;
        let top = rect.bottom + 6;

        if (left < 10) left = 10;
        if (left + menuWidth > window.innerWidth - 10) {
          left = window.innerWidth - menuWidth - 10;
        }
        if (top + menuHeight > window.innerHeight - 10) {
          top = rect.top - menuHeight - 6;
        }

        actionMenu.style.top = Math.max(10, top) + 'px';
        actionMenu.style.left = Math.max(10, left) + 'px';
      }

      // Number & Currency Helpers
      function parseNumber(val) {
        if (!val) return 0;

      function formatRupiahInput(num) {
        if (isNaN(num)) return 'Rp -';

      // Auto Calculation of Sisa Budget & % Terpakai
      function calculateBudgetFields() {
        const b = parseNumber(crudBudget.value);

        if (b > 0) {
          const pct = ((a / b) * 100).toFixed(1);
          crudPersenTerpakai.value = pct + '%';

          if (!crudStatus.dataset.userEdited) {
            if (a > b) {
              crudStatus.value = 'Over Budget';
            } else if (a >= b * 0.85) {
              crudStatus.value = 'Waspada';
            } else {
              crudStatus.value = 'Dalam Budget';
            }
          }
        } else {
          crudPersenTerpakai.value = '0%';
          if (!crudStatus.dataset.userEdited) {
            crudStatus.value = 'Dalam Budget';
          }
        }
      }

        const pctStr = (typeof item.persenTerpakai === 'number' ? item.persenTerpakai.toFixed(1) : item.persenTerpakai) + '%';
        detailPersenTerpakai.textContent = pctStr;
        detailStatus.textContent = item.status || 'Dalam Budget';
        detailDivisiPengecualian.textContent = item.divisiPengecualian || '-';
        detailKelompokCOA.textContent = item.kelompokCOA || '-';
        detailStatusCOA.textContent = item.statusCOA || 'OK';

        if (budgetDetailModal) {
          budgetDetailModal.classList.add('is-active');
        }
      }

      // Close Modals
      function closeBudgetModals() {
        if (budgetCrudModal) budgetCrudModal.classList.remove('is-active');
        if (budgetDetailModal) budgetDetailModal.classList.remove('is-active');
        if (wrapCoaModal) wrapCoaModal.classList.remove('is-open');
      }

      if (btnCloseCrudX) btnCloseCrudX.addEventListener('click', closeBudgetModals);
      if (btnCloseDetailX) btnCloseDetailX.addEventListener('click', closeBudgetModals);
      if (btnKeluarBudgetDetail) btnKeluarBudgetDetail.addEventListener('click', closeBudgetModals);

      [budgetCrudModal, budgetDetailModal].forEach(function (modal) {
        if (modal) {
          modal.addEventListener('click', function (e) {
            if (e.target === modal) closeBudgetModals();
          });
        }
      });

      // Submit Form Tambah / Edit
      if (formBudgetCrud) {
        formBudgetCrud.addEventListener('submit', function (e) {
          e.preventDefault();

          const bVal = parseNumber(crudBudget.value);
          const aVal = parseNumber(crudActualBeban.value);
          const sisaVal = bVal - aVal;
          const pctVal = bVal > 0 ? parseFloat(((aVal / bVal) * 100).toFixed(1)) : 0;

          const recordData = {
            periode: crudPeriode.value.trim() || 'Sep 2026',
            kodeCOA: crudKodeCOA.value.trim() || '5007',
            namaAkunCOA: crudNamaAkunCOA.value.trim() || 'Beban Operasional',
            divisi: crudDivisi.value.trim() || 'General',
            budget: bVal,
            actualBeban: aVal,
            sisaBudget: sisaVal,
            persenTerpakai: pctVal,
            status: crudStatus.value.trim() || (aVal > bVal ? 'Over Budget' : 'Dalam Budget'),
            divisiPengecualian: crudDivisiPengecualian.value.trim() || '-',
            kelompokCOA: crudKelompokCOA.value.trim() || 'Beban',
            statusCOA: crudStatusCOA.value.trim() || 'OK'
          };

          if (currentEditingId) {
            // Update Existing Item
            const idx = budgetData.findIndex(function (x) { return String(x.id) === String(currentEditingId); });
            if (idx !== -1) {
              recordData.id = budgetData[idx].id;
              budgetData[idx] = recordData;
            }
          } else {
            // Add New Item
            recordData.id = Date.now();
            budgetData.unshift(recordData);
          }

          saveData(budgetData);
          renderTable();
          closeBudgetModals();

          if (typeof Swal !== 'undefined') {
            Swal.fire({
              icon: 'success',
              title: currentEditingId ? 'Berhasil Diperbarui' : 'Berhasil Disimpan',
              text: currentEditingId ? 'Data budget vs actual berhasil diubah.' : 'Data budget baru berhasil ditambahkan.',
              timer: 1500,
              showConfirmButton: false
            });
          }
        });
      }

      // Connect Toolbar Button Tambah
      if (btnTambahBudget) {
        btnTambahBudget.addEventListener('click', function () {
          openAddBudgetModal();
        });
      }


      /* ===== REAL-TIME SEARCH ===== */
      if (searchInput) {
        searchInput.addEventListener('input', function () {
          filterState.search = this.value.trim();
          renderTable();
        });
      }

      /* ===== FILTER FUNNEL DROPDOWN: DIVISI, STATUS, KELOMPOK ===== */
      const divisiOptions = ['Semua Divisi', 'Operasional', 'Marketing', 'Finance', 'IT / Tech', 'HR / GA', 'Creative'];
      const statusOptions = ['Semua Status', 'Under Budget', 'Near Budget', 'Over Budget'];
      const kelompokOptions = ['Semua Kelompok', 'Beban Operasional', 'Beban Pemasaran', 'Beban Umum & Administrasi'];

      function setupDropdownFilter(boxEl, inputEl, listEl, options, stateKey) {
        if (!boxEl || !inputEl || !listEl) return;

        function renderList(q) {
          listEl.innerHTML = '';
          const searchVal = (q || '').toLowerCase().trim();
          const filtered = options.filter(opt => !searchVal || opt.toLowerCase().includes(searchVal));

          filtered.forEach(opt => {
            const item = document.createElement('div');
            item.className = 'budget-filter-item';
            if (filterState[stateKey] === opt || (!filterState[stateKey] && opt.startsWith('Semua'))) {
              item.classList.add('is-selected');
            }
            item.textContent = opt;
            item.addEventListener('click', function (e) {
              e.stopPropagation();
              if (opt.startsWith('Semua')) {
                filterState[stateKey] = '';
                inputEl.value = '';
                inputEl.placeholder = opt;
              } else {
                filterState[stateKey] = opt;
                inputEl.value = opt;
              }
              boxEl.classList.remove('is-open');
            });
            listEl.appendChild(item);
          });
        }

        inputEl.addEventListener('click', function (e) {
          e.stopPropagation();
          const isOpen = boxEl.classList.contains('is-open');
          // close other boxes
          [boxFilterDivisi, boxFilterStatus, boxFilterKelompok].forEach(b => b && b !== boxEl && b.classList.remove('is-open'));
          if (isOpen) {
            boxEl.classList.remove('is-open');
          } else {
            boxEl.classList.add('is-open');
            renderList(inputEl.value);
          }
        });

        inputEl.addEventListener('input', function () {
          boxEl.classList.add('is-open');
          renderList(this.value);
        });
      }

      setupDropdownFilter(boxFilterDivisi, filterDivisi, listFilterDivisi, divisiOptions, 'divisi');
      setupDropdownFilter(boxFilterStatus, filterStatus, listFilterStatus, statusOptions, 'status');
      setupDropdownFilter(boxFilterKelompok, filterKelompok, listFilterKelompok, kelompokOptions, 'kelompok');

      if (btnFilter) {
        btnFilter.addEventListener('click', function (e) {
          e.stopPropagation();
          filterDropdown.classList.toggle('is-active');
          if (calendarDropdown) calendarDropdown.classList.remove('is-active');
        });
      }

      if (btnResetFilter) {
        btnResetFilter.addEventListener('click', function () {
          filterState.divisi = '';
          filterState.status = '';
          filterState.kelompok = '';
          if (filterDivisi) { filterDivisi.value = ''; filterDivisi.placeholder = 'Pilih Divisi'; }
          if (filterStatus) { filterStatus.value = ''; filterStatus.placeholder = 'Pilih Status'; }
          if (filterKelompok) { filterKelompok.value = ''; filterKelompok.placeholder = 'Pilih Kelompok COA'; }
          [boxFilterDivisi, boxFilterStatus, boxFilterKelompok].forEach(b => b && b.classList.remove('is-open'));
          filterDropdown.classList.remove('is-active');
          renderTable();
        });
      }

      if (btnApplyFilter) {
        btnApplyFilter.addEventListener('click', function () {
          [boxFilterDivisi, boxFilterStatus, boxFilterKelompok].forEach(b => b && b.classList.remove('is-open'));
          filterDropdown.classList.remove('is-active');
          renderTable();
        });
      }

      /* ===== CALENDAR FILTER (DUAL MONTH) ===== */
      let calViewYear = 2026;
      let calViewMonth = 8; // Sep (0-indexed)
      let tempCalStart = null;
      let tempCalEnd = null;

      function renderDualCalendar() {
        if (!gridMonth1 || !gridMonth2) return;
        const monthNames = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

        // Month 1
        const y1 = calViewYear;
        const m1 = calViewMonth;
        labelMonth1.textContent = monthNames[m1] + ' ' + y1;

        // Month 2
        let y2 = y1;
        let m2 = m1 + 1;
        if (m2 > 11) { m2 = 0; y2++; }
        labelMonth2.textContent = monthNames[m2] + ' ' + y2;

        renderMonthDays(gridMonth1, y1, m1);
        renderMonthDays(gridMonth2, y2, m2);
        updateCalendarDisplay();
      }

      function renderMonthDays(container, year, month) {
        container.innerHTML = '';
        const dayNames = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
        dayNames.forEach(d => {
          const el = document.createElement('div');
          el.className = 'month-day-name';
          el.textContent = d;
          container.appendChild(el);
        });

        const firstDayIdx = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDayIdx; i++) {
          const empty = document.createElement('div');
          empty.className = 'month-day is-empty';
          container.appendChild(empty);
        }

        for (let day = 1; day <= totalDays; day++) {
          const dayEl = document.createElement('div');
          dayEl.className = 'month-day';
          dayEl.textContent = day;

          const dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');

          if (tempCalStart && !tempCalEnd && tempCalStart === dateStr) {
            dayEl.classList.add('is-single-date');
          } else if (tempCalStart && tempCalEnd) {
            if (dateStr === tempCalStart) dayEl.classList.add('is-start-date');
            else if (dateStr === tempCalEnd) dayEl.classList.add('is-end-date');
            else if (dateStr > tempCalStart && dateStr < tempCalEnd) dayEl.classList.add('is-in-range');
          }

          dayEl.addEventListener('click', function (e) {
            e.stopPropagation();
            if (!tempCalStart || (tempCalStart && tempCalEnd)) {
              tempCalStart = dateStr;
              tempCalEnd = null;
            } else if (tempCalStart && !tempCalEnd) {
              if (dateStr < tempCalStart) {
                tempCalEnd = tempCalStart;
                tempCalStart = dateStr;
              } else {
                tempCalEnd = dateStr;
              }
            }
            renderDualCalendar();
          });

          container.appendChild(dayEl);
        }
      }

      function updateCalendarDisplay() {
        if (!calendarRangeDisplay) return;
        if (tempCalStart && tempCalEnd) {
          calendarRangeDisplay.textContent = tempCalStart + ' s/d ' + tempCalEnd;
        } else if (tempCalStart) {
          calendarRangeDisplay.textContent = 'Mulai: ' + tempCalStart;
        } else {
          calendarRangeDisplay.textContent = 'Semua Tanggal';
        }
      }

      if (btnPrevMonth) {
        btnPrevMonth.addEventListener('click', function (e) {
          e.stopPropagation();
          calViewMonth--;
          if (calViewMonth < 0) { calViewMonth = 11; calViewYear--; }
          renderDualCalendar();
        });
      }

      if (btnNextMonth) {
        btnNextMonth.addEventListener('click', function (e) {
          e.stopPropagation();
          calViewMonth++;
          if (calViewMonth > 11) { calViewMonth = 0; calViewYear++; }
          renderDualCalendar();
        });
      }

      if (btnCalendar) {
        btnCalendar.addEventListener('click', function (e) {
          e.stopPropagation();
          calendarDropdown.classList.toggle('is-active');
          if (filterDropdown) filterDropdown.classList.remove('is-active');
          if (calendarDropdown.classList.contains('is-active')) {
            renderDualCalendar();
          }
        });
      }

      // Presets
      document.querySelectorAll('.calendar-preset-btn').forEach(btn => {
        btn.addEventListener('click', function (e) {
          e.stopPropagation();
          const preset = this.getAttribute('data-preset');
          const now = new Date(2026, 8, 15);
          const curY = now.getFullYear();
          const curM = String(now.getMonth() + 1).padStart(2, '0');
          const curD = String(now.getDate()).padStart(2, '0');

          if (preset === 'today') {
            tempCalStart = curY + '-' + curM + '-' + curD;
            tempCalEnd = tempCalStart;
          } else if (preset === 'this-month') {
            const lastD = new Date(curY, now.getMonth() + 1, 0).getDate();
            tempCalStart = curY + '-' + curM + '-01';
            tempCalEnd = curY + '-' + curM + '-' + String(lastD).padStart(2, '0');
          } else if (preset === 'last-month') {
            const prevMonthDate = new Date(curY, now.getMonth() - 1, 1);
            const pY = prevMonthDate.getFullYear();
            const pM = String(prevMonthDate.getMonth() + 1).padStart(2, '0');
            const pLastD = new Date(pY, prevMonthDate.getMonth() + 1, 0).getDate();
            tempCalStart = pY + '-' + pM + '-01';
            tempCalEnd = pY + '-' + pM + '-' + String(pLastD).padStart(2, '0');
          } else if (preset === 'this-year') {
            tempCalStart = curY + '-01-01';
            tempCalEnd = curY + '-12-31';
          } else if (preset === 'reset') {
            tempCalStart = null;
            tempCalEnd = null;
          }
          renderDualCalendar();
        });
      });

      if (btnCancelCalendar) {
        btnCancelCalendar.addEventListener('click', function (e) {
          e.stopPropagation();
          calendarDropdown.classList.remove('is-active');
        });
      }

      if (btnApplyCalendar) {
        btnApplyCalendar.addEventListener('click', function (e) {
          e.stopPropagation();
          filterState.startDate = tempCalStart;
          filterState.endDate = tempCalEnd;
          calendarDropdown.classList.remove('is-active');
          renderTable();
        });
      }

      /* ===== EXPORT EXCEL (OFFICIAL SPREADSHEET ENGINE) ===== */
      async function exportBudgetVsActualExcel() {
        const rows = getFilteredData();
        if (!rows || rows.length === 0) {
          if (typeof Swal !== 'undefined') {
            Swal.fire({ icon: 'warning', title: 'Data Kosong', text: 'Tidak ada data Budget vs Actual untuk diekspor.' });
          }
          return;
        }

        const filename = 'Laporan_Budget_vs_Actual_' + new Date().toISOString().slice(0, 10) + '.xlsx';
        const headers = [
          'No',
          'Periode',
          'Kode COA',
          'Nama Akun COA',
          'Divisi',
          'Budget',
          'Actual Beban',
          'Sisa Budget',
          '% Terpakai',
          'Status',
          'Divisi Pengecualian',
          'Kelompok COA',
          'Status COA'
        ];

        const exportData = rows.map(function (item, idx) {
          const sisa = Number(item.budget || 0) - Number(item.actualBeban || 0);
          return [
            idx + 1,
            item.periode || '-',
            item.kodeCOA || '-',
            item.namaAkunCOA || '-',
            item.divisi || '-',
            item.budget || 0,
            item.actualBeban || 0,
            sisa,
            (item.persenTerpakai || 0) + '%',
            item.status || 'Under Budget',
            item.divisiPengecualian || '-',
            item.kelompokCOA || '-',
            item.statusCOA || 'Aktif'
          ];
        });

        if (typeof window.exportBisaExcel === 'function') {
          await window.exportBisaExcel({
            title: 'LAPORAN BUDGET VS ACTUAL PERUSAHAAN',
            filename: filename,
            sheetName: 'Budget vs Actual',
            headers: headers,
            rows: exportData
          });
        } else if (typeof window.exportTableToExcel === 'function') {
          await window.exportTableToExcel('budgetTable', filename, 'LAPORAN BUDGET VS ACTUAL');
        } else {
          let csv = headers.join(',') + '\n';
          exportData.forEach(function (r) {
            csv += r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(',') + '\n';
          });
          const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.setAttribute('href', url);
          link.setAttribute('download', filename.replace('.xlsx', '.csv'));
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        }
      }
      window.exportBudgetVsActualExcel = exportBudgetVsActualExcel;

      if (btnExportExcel) {
        btnExportExcel.addEventListener('click', exportBudgetVsActualExcel);
      }

      /* ===== GLOBAL CLICK LISTENER (TUTUP POPUP & MENU) ===== */
      document.addEventListener('click', function (e) {
        if (!e.target.closest('#budgetActionMenu') && !e.target.closest('[data-action-toggle]')) {
          closeActionMenus();
        }
        if (!e.target.closest('#filterDropdown') && !e.target.closest('#btnFilter')) {
          if (filterDropdown) filterDropdown.classList.remove('is-active');
          [boxFilterDivisi, boxFilterStatus, boxFilterKelompok].forEach(b => b && b.classList.remove('is-open'));
        }
        if (!e.target.closest('#calendarDropdown') && !e.target.closest('#btnCalendar')) {
          if (calendarDropdown) calendarDropdown.classList.remove('is-active');
        }
      });

      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') {
          closeActionMenus();
          if (filterDropdown) filterDropdown.classList.remove('is-active');
          if (calendarDropdown) calendarDropdown.classList.remove('is-active');
        }
      });

      window.addEventListener('scroll', closeActionMenus, true);

      // Initial Render
      renderTable();
    });
  </script>
</body>

</html>
