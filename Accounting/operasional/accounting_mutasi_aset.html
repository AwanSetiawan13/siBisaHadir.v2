<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mutasi Aset | Bisa Media</title>
  <link rel="stylesheet" href="../../assets/css/style.css?v=20261031" />
  <link rel="icon" type="image/png" href="../../media/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    /* ==========================================================================
       GLOBAL TYPOGRAPHY & RESET
       ========================================================================== */
    * {
      box-sizing: border-box;
    }

    body,
    input,
    button,
    table,
    select,
    textarea {
      font-family: 'Outfit', sans-serif !important;
    }

    /* ===== MAIN PANEL & TABLE ===== */
    .mutasi-panel {
      position: relative;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      box-shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.05);
      padding: 20px !important;
      margin-bottom: 24px;
      overflow: visible !important;
      min-height: 440px;
      box-sizing: border-box;
    }

    .mutasi-panel-accent {
      height: 3.5px;
      background: #0076C5;
      width: 100% !important;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
      margin: 0 0 16px 0 !important;
    }

    /* ===== TOOLBAR (Kiri: Filter, Kalender, Excel, Search | Kanan: + Tambah) ===== */
    .mutasi-toolbar {
      padding: 0 0 14px 0 !important;
      margin: 0 0 14px 0 !important;
      background: transparent !important;
      border-bottom: 1px dashed #cbd5e1 !important;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      position: relative;
      z-index: 50;
    }

    .toolbar-left-group {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
      flex-wrap: wrap;
    }

    /* Toolbar Icon Buttons */
    .btn-toolbar-icon {
      width: 34px;
      height: 34px;
      padding: 0;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      color: #3b82f6;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      transition: all 0.15s ease;
      position: relative;
    }

    .btn-toolbar-icon:hover {
      border-color: #0284c7;
      color: #0284c7;
      background: #f0f9ff;
    }

    .btn-toolbar-icon svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    /* Excel Icon Konsisten Resmi Hijau */
    .btn-toolbar-icon.btn-excel {
      color: #107c41;
      border-color: #86efac;
      background: #ffffff;
    }

    .btn-toolbar-icon.btn-excel:hover {
      background: #f0fdf4;
      border-color: #4ade80;
    }

    .btn-toolbar-icon.btn-excel:hover svg rect {
      fill: #0b5e31 !important;
    }

    .btn-toolbar-icon.has-filter {
      background: #e0f2fe;
      border-color: #0284c7;
      color: #0284c7;
    }

    /* Search Pill Box */
    .mutasi-search-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
    }

    .mutasi-search-icon {
      position: absolute;
      left: 12px;
      width: 15px;
      height: 15px;
      stroke: #94a3b8;
      stroke-width: 2.2;
      fill: none;
      pointer-events: none;
    }

    .mutasi-search-input {
      width: 200px;
      height: 36px;
      border: 1.5px solid #cbd5e1;
      border-radius: 20px;
      padding: 0 14px 0 34px;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      color: #1e293b;
      background: #ffffff;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, width 0.2s ease;
      box-sizing: border-box;
    }

    .mutasi-search-input:focus {
      border-color: #28a5de;
      box-shadow: 0 0 0 3px rgba(40, 165, 222, 0.15);
      width: 240px;
    }

    .mutasi-search-input::placeholder {
      color: #94a3b8;
      font-style: italic;
    }

    /* Tombol + Tambah (100% PERSIS KONSISTEN DAFTAR ASET & PENGELUARAN) */
    .btn-tambah-mutasi {
      height: 36px;
      padding: 0 18px;
      border: none;
      border-radius: 6px;
      background: #28a5de;
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 2px 4px rgba(40, 165, 222, 0.25);
      transition: background 0.15s ease, transform 0.1s ease;
      white-space: nowrap;
    }

    .btn-tambah-mutasi:hover {
      background: #0284c7;
      transform: translateY(-1px);
    }

    .btn-tambah-mutasi:active {
      transform: scale(0.98);
    }

    /* ===== FILTER POPOVER ===== */
    .mutasi-filter-popover {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 290px;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 14px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.12), 0 8px 10px -6px rgba(0, 0, 0, 0.08);
      padding: 16px 18px;
      z-index: 150;
      box-sizing: border-box;
      display: none;
    }

    .mutasi-filter-popover.is-active {
      display: block;
    }

    .mutasi-filter-group {
      margin-bottom: 14px;
    }

    .mutasi-filter-label {
      display: block;
      font-size: 14.5px;
      font-weight: 500;
      color: #1e293b;
      margin-bottom: 6px;
    }

    .mutasi-filter-box {
      position: relative;
    }

    .mutasi-filter-input-wrap {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .mutasi-filter-input {
      width: 100%;
      height: 38px;
      padding: 0 32px 0 12px;
      border: 1.5px solid #28a5de;
      border-radius: 8px;
      font-family: 'Outfit', sans-serif;
      font-size: 13.5px;
      color: #334155;
      background: #ffffff;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.15s, border-radius 0.15s;
    }

    .mutasi-filter-box.is-open .mutasi-filter-input {
      border-color: #0076C5;
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
    }

    .mutasi-filter-arrow {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #94a3b8;
      pointer-events: none;
      transition: transform 0.2s ease, color 0.2s ease;
    }

    .mutasi-filter-arrow svg {
      width: 14px;
      height: 14px;
      stroke: currentColor;
      stroke-width: 2.2;
    }

    .mutasi-filter-box.is-open .mutasi-filter-arrow {
      transform: translateY(-50%) rotate(180deg);
      color: #0076C5;
    }

    .mutasi-filter-dropdown-list {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #ffffff;
      border: 1.5px solid #0076C5;
      border-top: none;
      border-radius: 0 0 8px 8px;
      padding: 6px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
      z-index: 160;
      box-sizing: border-box;
      max-height: 160px;
      overflow-y: auto;
      display: none;
    }

    .mutasi-filter-box.is-open .mutasi-filter-dropdown-list {
      display: block;
    }

    .mutasi-filter-item {
      padding: 7px 4px;
      font-size: 13px;
      color: #64748b;
      cursor: pointer;
      border-radius: 4px;
      transition: all 0.12s ease;
    }

    .mutasi-filter-item:hover {
      background: #f1f5f9;
      color: #0284c7;
    }

    .mutasi-filter-item.is-selected {
      color: #0284c7;
      font-weight: 600;
    }

    .mutasi-filter-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-top: 18px;
      padding-top: 6px;
    }

    .btn-filter-riset {
      flex: 1;
      padding: 8px 14px;
      background: #f1f5f9;
      border: 1.5px solid #cbd5e1;
      border-radius: 8px;
      color: #1e293b;
      font-size: 13.5px;
      font-weight: 700;
      font-style: italic;
      cursor: pointer;
      text-align: center;
      transition: all 0.15s ease;
    }

    .btn-filter-riset:hover {
      background: #e2e8f0;
    }

    .btn-filter-terapkan {
      flex: 1;
      padding: 8px 14px;
      background: #28a5de;
      border: none;
      border-radius: 8px;
      color: #ffffff;
      font-size: 13.5px;
      font-weight: 700;
      font-style: italic;
      cursor: pointer;
      text-align: center;
      box-shadow: 0 2px 4px rgba(40, 165, 222, 0.25);
      transition: all 0.15s ease;
    }

    .btn-filter-terapkan:hover {
      background: #0284c7;
    }

    /* ===== DUAL MONTH CALENDAR POPOVER ===== */
    .mutasi-calendar-popover {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 580px;
      background: #ffffff;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.12);
      padding: 16px 18px;
      z-index: 200;
      box-sizing: border-box;
      display: none;
    }

    .mutasi-calendar-popover.is-active {
      display: block;
    }

    .calendar-popover-body {
      display: flex;
      gap: 16px;
    }

    .calendar-presets-col {
      width: 130px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-right: 1px solid #e2e8f0;
      padding-right: 14px;
    }

    .calendar-preset-btn {
      padding: 8px 10px;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      background: #f8fafc;
      color: #334155;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      text-align: left;
      transition: all 0.12s ease;
    }

    .calendar-preset-btn:hover {
      background: #e0f2fe;
      border-color: #28a5de;
      color: #0284c7;
    }

    .calendar-months-col {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .month-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
      color: #1e293b;
    }

    .month-nav-btn {
      width: 24px;
      height: 24px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      background: #ffffff;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: #475569;
    }

    .month-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 2px;
      text-align: center;
    }

    .month-day-name {
      font-size: 11px;
      font-weight: 600;
      color: #94a3b8;
      padding: 4px 0;
    }

    .month-day {
      font-size: 12px;
      padding: 6px 0;
      border-radius: 4px;
      cursor: pointer;
      color: #334155;
      user-select: none;
    }

    .month-day:hover {
      background: #f1f5f9;
    }

    .month-day.is-selected {
      background: #0284c7 !important;
      color: #ffffff !important;
      font-weight: 600;
    }

    .month-day.in-range {
      background: #e0f2fe;
      color: #0284c7;
    }

    .calendar-popover-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px solid #e2e8f0;
      margin-top: 14px;
      padding-top: 12px;
    }

    .calendar-range-text {
      font-size: 12.5px;
      color: #475569;
      font-style: italic;
    }

    .calendar-footer-actions {
      display: flex;
      gap: 8px;
    }

    .btn-cal-cancel {
      padding: 6px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      background: #ffffff;
      color: #475569;
      font-size: 12.5px;
      cursor: pointer;
    }

    .btn-cal-apply {
      padding: 6px 16px;
      border: none;
      border-radius: 6px;
      background: #28a5de;
      color: #ffffff;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
    }

    /* ===== TABLE & STICKY COLUMN ===== */
    .mutasi-table-wrap {
      width: 100%;
      overflow-x: auto;
      min-height: 380px;
    }

    .mutasi-table {
      width: 100%;
      border-collapse: separate !important; border-spacing: 0 !important;
      font-size: 13px;
      white-space: nowrap;
    }

    .mutasi-table thead th {
      padding: 12px 14px;
      font-weight: 600;
      color: #0f172a !important;
      background: #f4f4f5 !important;
      border-bottom: 1px solid #e4e4e7 !important;
      text-align: left;
      white-space: nowrap;
      text-transform: none;
      font-size: 13.5px;
    }

    .mutasi-table tbody td {
      padding: 12px 14px;
      vertical-align: middle;
      border-bottom: 1px solid #f1f5f9;
      color: #334155;
    }

    .mutasi-table tbody tr:hover td {
      background-color: #f8fafc !important;
    }

    .mutasi-cell-italic {
      font-style: italic;
      color: #334155;
    }

    /* Fixed / Sticky Action Column di Sebelah Kanan */
    .mutasi-table th.col-sticky-action,
    .mutasi-table td.col-sticky-action {
      position: sticky !important;
      right: 0 !important;
      z-index: 10;
      background-color: #ffffff !important;
      border-left: 1px solid #e2e8f0 !important;
      box-shadow: -4px 0 8px -2px rgba(0, 0, 0, 0.05);
      text-align: center !important;
    }

    .mutasi-table th.col-sticky-action {
      position: sticky !important;
      right: 0 !important;
      z-index: 11;
      background-color: #f4f4f5 !important;
      border-left: 1px solid #e2e8f0 !important;
      box-shadow: -4px 0 8px -2px rgba(0, 0, 0, 0.05);
      text-align: center !important;
    }

    .mutasi-table tr:hover td.col-sticky-action {
      position: sticky !important;
      right: 0 !important;
      z-index: 10;
      background-color: #ffffff !important;
      border-left: 1px solid #e2e8f0 !important;
      box-shadow: -4px 0 8px -2px rgba(0, 0, 0, 0.05);
      text-align: center !important;
    }

    /* Action Trigger Button (3 Titik Vertikal Tegak) */
    .mutasi-action-btn {
      width: 32px;
      height: 32px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #0f172a;
      background: transparent;
      cursor: pointer;
      transition: background 0.15s ease;
    }

    .mutasi-action-btn:hover {
      background: #f1f5f9;
      color: #0284c7;
    }

    .mutasi-action-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Floating Action Menu (Konsisten dengan Kas & Bank, Pengeluaran & Pajak) */
    .mutasi-action-menu {
      display: none;
      position: fixed;
      z-index: 2147483000;
      min-width: 145px;
      padding: 6px;
      border: 1px solid rgba(0, 0, 0, .08);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 4px 20px rgba(0, 0, 0, .14);
    }

    .mutasi-action-menu.is-open {
      display: block;
    }

    .mutasi-action-menu button {
      width: 100%;
      min-height: 38px;
      padding: 7px 12px;
      border: 0;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #334155;
      background: transparent;
      font-weight: 500;
      text-align: left;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.12s ease;
    }

    .mutasi-action-menu button:hover {
      color: #0f172a;
      background: #f1f5f9;
    }

    .mutasi-action-icon {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: #0076C5;
      color: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .mutasi-action-icon svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .mutasi-action-menu button.is-danger {
      color: #dc2626;
    }

    .mutasi-action-menu button.is-danger:hover {
      background: #fef2f2;
    }

    .mutasi-action-menu .mutasi-action-icon.is-danger {
      background: #e02424;
    }

    /* Badges */
    .badge-mutasi {
      display: inline-block;
      font-size: 11.5px;
      font-weight: 600;
      padding: 3px 10px;
      border-radius: 12px;
      text-align: center;
    }

    .badge-pindah {
      background: #e0f2fe;
      color: #0284c7;
    }

    .badge-pinjam {
      background: #fef3c7;
      color: #b45309;
    }

    .badge-servis {
      background: #fee2e2;
      color: #dc2626;
    }

    .badge-kembali {
      background: #dcfce7;
      color: #15803d;
    }

    .badge-beli {
      background: #dcfce7;
      color: #15803d;
    }

    .badge-jual {
      background: #f3e8ff;
      color: #7e22ce;
    }

    .badge-hapus {
      background: #f1f5f9;
      color: #475569;
    }

    .badge-kondisi-baik {
      color: #15803d;
      font-weight: 600;
    }

    .badge-kondisi-rusak {
      color: #dc2626;
      font-weight: 600;
    }

    /* Button Lihat Bukti di Tabel */
    .btn-table-bukti {
      padding: 4px 10px;
      font-size: 11px;
      font-family: 'Outfit', sans-serif;
      font-weight: 500;
      border-radius: 6px;
      border: 1px solid rgba(2, 132, 199, 0.4);
      color: #0284c7;
      background: rgba(2, 132, 199, 0.05);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-table-bukti:hover {
      background: #e0f2fe;
      border-color: #0284c7;
    }

    /* ==========================================================================
       MODALS (CRUD & VIEW) - PERSIS SCREENSHOT 1, 2 & 3
       ========================================================================== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(3px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      padding: 24px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      overflow-y: auto;
    }

    .modal-overlay.is-active,
    .modal-overlay.is-open {
      display: flex !important;
      opacity: 1 !important;
      pointer-events: auto !important;
      visibility: visible !important;
    }

    .mutasi-modal-box {
      background: #ffffff;
      border-radius: 14px;
      width: 100%;
      max-width: 820px;
      margin: auto;
      overflow: visible !important;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      position: relative;
      border: 1px solid #e2e8f0;
      box-sizing: border-box;
      animation: modalFadeIn 0.2s ease-out;
    }

    @keyframes modalFadeIn {
      from {
        opacity: 0;
        transform: scale(0.97) translateY(8px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .modal-accent-line {
      height: 3.5px;
      background: #0076C5;
      width: 100%;
      border-radius: 14px 14px 0 0;
    }

    .modal-inner-padding {
      padding: 22px 28px 26px;
    }

    .modal-header-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .modal-title-text {
      font-size: 18px;
      font-weight: 600;
      color: #1e293b;
      margin: 0;
    }

    .modal-title-text em {
      font-style: italic;
      font-weight: 700;
    }

    .btn-modal-close-x {
      width: 22px;
      height: 22px;
      border: 1px solid #71717a;
      border-radius: 4px;
      background: transparent;
      color: #1e293b;
      font-size: 13px;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      transition: all 0.15s ease;
    }

    .btn-modal-close-x:hover {
      background: #f1f5f9;
      border-color: #0f172a;
    }

    .modal-divider-dashed {
      border-bottom: 1px dashed #cbd5e1;
      margin-bottom: 20px;
    }

    /* 9 Fields Grid: 3 Rows x 3 Columns */
    .mutasi-form-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px 18px;
    }

    .modal-field {
      display: flex;
      flex-direction: column;
      position: relative;
    }

<body class="dashboard-body">

  <!-- ===== MODAL PREVIEW BUKTI / FOTO ===== -->
  <div id="buktiPreviewModal" class="modal-overlay">
    <div class="bukti-modal-content">
      <h3 style="margin-top: 0; font-size: 16px; font-weight: 600; color: #1e293b; margin-bottom: 12px;">Foto / Bukti Mutasi Aset</h3>
      <img id="previewBuktiImg" src="" alt="Bukti Foto Mutasi" />

        <button type="button" id="btnCloseBuktiPreview" class="btn-modal-outline" style="min-width: 100px;">Tutup</button>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
  <script src="../../assets/js/excel_engine.js"></script>
  <script src="../../assets/js/layout.js?v=20261111_hd_v2"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      'use strict';

      /* ===== DATA MODEL & STORAGE ===== */
      const STORAGE_KEY = 'accounting_mutasi_aset_data';
      const DAFTAR_ASET_KEYS = ['bisa_accounting_daftar_aset_data_v4', 'accounting_daftar_aset_data'];

      function getDaftarAsetList() {
        for (let i = 0; i < DAFTAR_ASET_KEYS.length; i++) {
          try {
            const raw = localStorage.getItem(DAFTAR_ASET_KEYS[i]);
            if (raw === null || raw === undefined) continue;
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) return parsed;
          } catch (e) {
            console.warn('[Mutasi Aset] Gagal membaca Daftar Aset:', e);
          }
        }
        return null;
      }

      // Default Asset references fallback jika Daftar Aset belum ada
      const defaultAssetReferences = [
        { kode: 'AST-001', nama: 'Dispenser Mini Miyako' },
        { kode: 'AST-002', nama: 'Sony Alpha A7 IV + Lens 24-70mm' },
        { kode: 'AST-003', nama: 'MacBook Pro M3 Max 36GB' },
        { kode: 'AST-004', nama: 'Meja Meeting Kayu Jati Custom 3M' },
        { kode: 'AST-005', nama: 'AC Daikin Inverter 2 PK Multi-S' }
      ];

      function isDefaultMockItem(item) {
        if (!item || !item.id) return false;
        const mockIds = ['MUT-001', 'MUT-002', 'MUT-003', 'MUT-004', 'MUT-005'];
        return mockIds.indexOf(item.id) !== -1 &&
          (item.keterangan === 'Relokasi sementara acara workshop' ||
           item.keterangan === 'Pembuatan video campaign brand' ||
           item.keterangan === 'Alokasi laptop editing performa tinggi' ||
           item.keterangan === 'Cuci AC dan ganti kapasitor berkala' ||
           item.keterangan === 'Penataan ulang layout rapat besar');
      }

      function loadData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const hasCleaned = localStorage.getItem('accounting_mutasi_aset_clean_v1');
          if (raw !== null && raw !== undefined) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) {
              if (!hasCleaned) {
                // Pembersihan data dummy bawaan hanya dilakukan 1x di awal
                const cleaned = parsed.filter(function (x) { return !isDefaultMockItem(x); });
                localStorage.setItem('accounting_mutasi_aset_clean_v1', 'true');
                saveData(cleaned);
                return cleaned;
              }
              return parsed;
            }
          } else {
            localStorage.setItem('accounting_mutasi_aset_clean_v1', 'true');
            saveData([]);
            return [];
          }
        } catch (e) {
          console.error('Gagal memuat data mutasi:', e);
        }
        return [];
      }

      function saveData(data) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data || []));
          return true;
        } catch (e) {
          console.error('Gagal menyimpan data mutasi ke localStorage:', e);
          // Jika kuota localStorage terlampaui (misal file foto terlalu besar), fallback simpan tanpa foto besar
          if (e && (e.name === 'QuotaExceededError' || e.code === 22)) {
            try {
              const fallbackData = (data || []).map(function (item) {
                if (item.buktiFoto && item.buktiFoto.length > 50000) {
                  return Object.assign({}, item, { buktiFoto: '' });
                }
                return item;
              });
              localStorage.setItem(STORAGE_KEY, JSON.stringify(fallbackData));
              return true;
            } catch (e2) {
              console.error('Fallback penyimpanan juga gagal:', e2);
            }
          }
          return false;
        }
      }

      let mutasiData = loadData();

      // State Filters
      let filterState = {
        search: '',
        aktivitas: '',
        kondisi: '',
        startDate: '',
        endDate: ''
      };

      /* ===== DOM ELEMENTS ===== */
      const tableBody = document.getElementById('mutasiTableBody');
      const searchInput = document.getElementById('mutasiSearch');
      const btnExportExcel = document.getElementById('btnExportExcel');
      const btnTambahMutasi = document.getElementById('btnTambahMutasi');

      // Action Menu
      const actionMenu = document.getElementById('mutasiActionMenu');
      let currentActionId = null;

      // Filter Funnel Popover Elements
      const btnFilter = document.getElementById('btnFilter');
      const filterDropdown = document.getElementById('filterDropdown');
      const filterAktivitas = document.getElementById('filterAktivitas');
      const boxFilterAktivitas = document.getElementById('boxFilterAktivitas');
      const listFilterAktivitas = document.getElementById('listFilterAktivitas');
      const filterKondisi = document.getElementById('filterKondisi');
      const boxFilterKondisi = document.getElementById('boxFilterKondisi');
      const listFilterKondisi = document.getElementById('listFilterKondisi');
      const btnResetFilter = document.getElementById('btnResetFilter');
      const btnApplyFilter = document.getElementById('btnApplyFilter');

      // Calendar Filter Elements
      const btnCalendar = document.getElementById('btnCalendar');
      const calendarDropdown = document.getElementById('calendarDropdown');
      const labelMonth1 = document.getElementById('labelMonth1');
      const labelMonth2 = document.getElementById('labelMonth2');
      const gridMonth1 = document.getElementById('gridMonth1');
      const gridMonth2 = document.getElementById('gridMonth2');
      const btnPrevMonth = document.getElementById('btnPrevMonth');
      const btnNextMonth = document.getElementById('btnNextMonth');
      const calendarRangeDisplay = document.getElementById('calendarRangeDisplay');
      const btnCancelCalendar = document.getElementById('btnCancelCalendar');
      const btnApplyCalendar = document.getElementById('btnApplyCalendar');

      // CRUD Modal Elements
      const crudModal = document.getElementById('mutasiCrudModal');
      const crudForm = document.getElementById('mutasiForm');
      const crudModalTitle = document.getElementById('crudModalTitle');
      const btnCloseCrudX = document.getElementById('btnCloseCrudX');

      const crudId = document.getElementById('crudId');
      const crudTanggal = document.getElementById('crudTanggal');
      const crudKodeAset = document.getElementById('crudKodeAset');
      const wrapKodeAset = document.getElementById('wrapKodeAset');
      const menuKodeAset = document.getElementById('menuKodeAset');
      const crudNamaAset = document.getElementById('crudNamaAset');
      const crudAktivitas = document.getElementById('crudAktivitas');
      const wrapAktivitas = document.getElementById('wrapAktivitas');
      const menuAktivitas = document.getElementById('menuAktivitas');
      const crudDari = document.getElementById('crudDari');
      const crudKe = document.getElementById('crudKe');
      const crudKondisi = document.getElementById('crudKondisi');
      const crudKeterangan = document.getElementById('crudKeterangan');
      const crudBuktiFoto = document.getElementById('crudBuktiFoto');
      const btnTriggerFile = document.getElementById('btnTriggerFile');
      const fileNameDisplay = document.getElementById('fileNameDisplay');
      const btnPreviewBuktiForm = document.getElementById('btnPreviewBuktiForm');

      let currentUploadedFotoDataUrl = '';
      let currentItemFotoUrl = '';

      // Detail Modal Elements
      const detailModal = document.getElementById('mutasiDetailModal');
      const btnCloseDetailX = document.getElementById('btnCloseDetailX');
      const btnKeluarDetail = document.getElementById('btnKeluarDetail');
      const btnLihatFoto = document.getElementById('btnLihatFoto');

      const detailTanggal = document.getElementById('detailTanggal');
      const detailKodeAset = document.getElementById('detailKodeAset');
      const detailNamaAset = document.getElementById('detailNamaAset');
      const detailAktivitas = document.getElementById('detailAktivitas');
      const detailDari = document.getElementById('detailDari');
      const detailKe = document.getElementById('detailKe');
      const detailKondisi = document.getElementById('detailKondisi');
      const detailKeterangan = document.getElementById('detailKeterangan');

      // Preview Modal Elements
      const buktiPreviewModal = document.getElementById('buktiPreviewModal');
      const previewBuktiImg = document.getElementById('previewBuktiImg');
      const btnCloseBuktiPreview = document.getElementById('btnCloseBuktiPreview');

      /* ===== FORMATTING UTILITIES ===== */
      function escapeHtml(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function formatTanggalDisplay(isoStr) {
        if (!isoStr) return '-';
        const parts = isoStr.split('-');
        if (parts.length !== 3) return isoStr;
        const y = parts[0];
        const mIdx = parseInt(parts[1], 10) - 1;
        const d = parts[2].padStart(2, '0');
        const months = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
        return d + ' ' + (months[mIdx] || parts[1]) + ' ' + y;
      }

      function getAktivitasBadge(aktivitas) {
        const akt = (aktivitas || '').toLowerCase();
        if (akt.includes('beli') || akt.includes('pembelian')) return 'badge-beli';
        if (akt.includes('jual') || akt.includes('dijual')) return 'badge-jual';
        if (akt.includes('hapus') || akt.includes('dihapus')) return 'badge-hapus';
        if (akt.includes('pindah')) return 'badge-pindah';
        if (akt.includes('pinjam')) return 'badge-pinjam';
        if (akt.includes('servis') || akt.includes('service') || akt.includes('rusak')) return 'badge-servis';
        if (akt.includes('kembali')) return 'badge-kembali';
        return 'badge-pindah';
      }

      /* ===== KODE ASET DROPDOWN POPULATOR (SESUAI GAMBAR 2) ===== */
      function getAssetReferences() {
        const asetList = getDaftarAsetList();
        if (asetList !== null) {
          const list = [];
          const seen = new Set();
          asetList.forEach(function (ast) {
            if (!ast) return;
            const kode = String(ast.kodeAset || '').trim();
            const nama = String(ast.namaAset || '').trim();
            if (kode && !seen.has(kode)) {
              seen.add(kode);
              list.push({
                kode: kode,
                nama: nama || kode,
                lokasi: ast.lokasi || ''
              });
            }
          });
          return list;
        }
        return defaultAssetReferences.slice();
      }

      function findAssetByKode(kode) {
        if (!kode) return null;
        const normalized = String(kode).trim().toLowerCase();
        const assets = getAssetReferences();
        return assets.find(function (x) {
          return String(x.kode || '').trim().toLowerCase() === normalized;
        }) || null;
      }

      function renderKodeAsetDropdown(filterText) {
        if (!menuKodeAset) return;
        menuKodeAset.innerHTML = '';
        const assets = getAssetReferences();
        const q = String(filterText !== undefined ? filterText : (crudKodeAset ? crudKodeAset.value : '')).trim().toLowerCase();

        const filtered = q
          ? assets.filter(function (ast) {
              return String(ast.kode).toLowerCase().includes(q) || String(ast.nama).toLowerCase().includes(q);
            })
          : assets;

        if (filtered.length === 0) {
          const emptyItem = document.createElement('div');
          emptyItem.className = 'modal-opt-item';
          emptyItem.style.color = '#94a3b8';
          emptyItem.style.fontStyle = 'italic';
          emptyItem.style.cursor = 'default';
          emptyItem.textContent = assets.length === 0 ? 'Daftar Aset kosong' : 'Tidak ada aset yang cocok';
          menuKodeAset.appendChild(emptyItem);
          return;
        }

        filtered.forEach(function (ast) {
          const item = document.createElement('div');
          item.className = 'modal-opt-item';
          if (crudKodeAset && crudKodeAset.value.trim() === ast.kode) {
            item.classList.add('is-selected');
          }
          item.textContent = ast.kode + ' | ' + ast.nama;
          item.addEventListener('click', function (e) {
            e.stopPropagation();
            crudKodeAset.value = ast.kode;
            crudNamaAset.value = ast.nama;
            wrapKodeAset.classList.remove('is-open');
          });
          menuKodeAset.appendChild(item);
        });
      }

      renderKodeAsetDropdown('');

      if (crudKodeAset) {
        crudKodeAset.addEventListener('input', function () {
          const val = this.value.trim();
          const match = findAssetByKode(val);
          if (match) {
            crudNamaAset.value = match.nama;
          } else {
            crudNamaAset.value = '';
          }
          if (wrapKodeAset) wrapKodeAset.classList.add('is-open');
          renderKodeAsetDropdown(this.value);
        });

        crudKodeAset.addEventListener('focus', function () {
          if (wrapAktivitas) wrapAktivitas.classList.remove('is-open');
          if (wrapKodeAset) wrapKodeAset.classList.add('is-open');
          renderKodeAsetDropdown(this.value);
        });

        crudKodeAset.addEventListener('click', function (e) {
          e.stopPropagation();
          if (wrapAktivitas) wrapAktivitas.classList.remove('is-open');
          if (wrapKodeAset) wrapKodeAset.classList.add('is-open');
          renderKodeAsetDropdown(this.value);
        });
      }

      if (wrapKodeAset) {
        wrapKodeAset.addEventListener('click', function (e) {
          if (!e.target.closest('.modal-opt-item') && !e.target.closest('#crudKodeAset')) {
            e.stopPropagation();
            if (wrapAktivitas) wrapAktivitas.classList.remove('is-open');
            wrapKodeAset.classList.toggle('is-open');
            if (wrapKodeAset.classList.contains('is-open')) {
              renderKodeAsetDropdown(crudKodeAset ? crudKodeAset.value : '');
            }
          }
        });
      }

      /* Listener perubahan Daftar Aset untuk auto-refresh dropdown & auto-fill */
      function refreshAssetReferences() {
        renderKodeAsetDropdown(crudKodeAset ? crudKodeAset.value : '');
        if (crudKodeAset && crudKodeAset.value) {
          const match = findAssetByKode(crudKodeAset.value);
          if (match) crudNamaAset.value = match.nama;
        }
      }

      window.addEventListener('storage', function (e) {
        if (e.key === STORAGE_KEY) {
          mutasiData = loadData();
          renderTable();
        }
        if (!e.key || DAFTAR_ASET_KEYS.indexOf(e.key) !== -1) {
          refreshAssetReferences();
        }
      });
      window.addEventListener('focus', function () {
        refreshAssetReferences();
      });
      window.addEventListener('pageshow', function () {
        mutasiData = loadData();
        renderTable();
        refreshAssetReferences();
      });
      window.addEventListener('accounting-daftar-aset-updated', refreshAssetReferences);
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) refreshAssetReferences();
      });

      /* ===== AKTIVITAS DROPDOWN POPULATOR (CRUD MODAL) ===== */
      const CRUD_AKTIVITAS_OPTIONS = [
        'Pembelian',
        'Pindah PIC',
        'Pindah Lokasi',
        'Service',
        'Dijual',
        'Dihapus'
      ];

      function renderAktivitasDropdown() {
        if (!menuAktivitas) return;
        menuAktivitas.innerHTML = '';
        CRUD_AKTIVITAS_OPTIONS.forEach(function (opt) {
          const item = document.createElement('div');
          item.className = 'modal-opt-item';
          if (crudAktivitas && crudAktivitas.value.trim().toLowerCase() === opt.toLowerCase()) {
            item.classList.add('is-selected');
          }
          item.textContent = opt;
          item.addEventListener('click', function (e) {
            e.stopPropagation();
            if (crudAktivitas) crudAktivitas.value = opt;
            if (wrapAktivitas) wrapAktivitas.classList.remove('is-open');
          });
          menuAktivitas.appendChild(item);
        });
      }

      renderAktivitasDropdown();

      if (wrapAktivitas) {
        wrapAktivitas.addEventListener('click', function (e) {
          if (!e.target.closest('.modal-opt-item')) {
            e.stopPropagation();
            if (wrapKodeAset) wrapKodeAset.classList.remove('is-open');
            wrapAktivitas.classList.toggle('is-open');
            if (wrapAktivitas.classList.contains('is-open')) {
              renderAktivitasDropdown();
            }
          }
        });
      }

      /* ===== FILE UPLOAD & EYE ICON TOGGLE ===== */
      if (btnTriggerFile && crudBuktiFoto) {
        btnTriggerFile.addEventListener('click', function (e) {
          e.preventDefault();
          crudBuktiFoto.click();
        });

        crudBuktiFoto.addEventListener('change', function () {
          if (this.files && this.files[0]) {
            const file = this.files[0];
            fileNameDisplay.textContent = file.name;
            const reader = new FileReader();
            reader.onload = function (e) {
              const result = e.target.result;
              if (file.type && file.type.startsWith('image/')) {
                const img = new Image();
                img.onload = function () {
                  const maxDim = 800;
                  let w = img.width;
                  let h = img.height;
                  if (w > maxDim || h > maxDim) {
                    if (w > h) {
                      h = Math.round((h * maxDim) / w);
                      w = maxDim;
                    } else {
                      w = Math.round((w * maxDim) / h);
                      h = maxDim;
                    }
                  }
                  const canvas = document.createElement('canvas');
                  canvas.width = w;
                  canvas.height = h;
                  const ctx = canvas.getContext('2d');
                  ctx.drawImage(img, 0, 0, w, h);
                  currentUploadedFotoDataUrl = canvas.toDataURL('image/jpeg', 0.7);
                };
                img.src = result;
              } else {
                currentUploadedFotoDataUrl = result;
              }
            };
            reader.readAsDataURL(file);
            if (btnPreviewBuktiForm) btnPreviewBuktiForm.style.display = 'inline-flex';
          } else {
            if (!currentUploadedFotoDataUrl) {
              fileNameDisplay.textContent = 'Belum ada file';
              if (btnPreviewBuktiForm) btnPreviewBuktiForm.style.display = 'none';
            }
          }
        });
      }

      if (btnPreviewBuktiForm) {
        btnPreviewBuktiForm.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          const src = currentUploadedFotoDataUrl || currentItemFotoUrl || '../../media/sample_struk.jpg';
          previewBuktiImg.src = src;
          buktiPreviewModal.classList.add('is-open');
          buktiPreviewModal.classList.add('is-active');
          buktiPreviewModal.style.display = 'flex';
          buktiPreviewModal.style.opacity = '1';
          buktiPreviewModal.style.pointerEvents = 'auto';
        });
      }

      /* ===== FILTERING LOGIC ===== */
      function getFilteredData() {
        return mutasiData.filter(function (item) {
          if (filterState.search) {
            const q = filterState.search.toLowerCase();
            const matchKode = (item.kodeAset || '').toLowerCase().includes(q);
            const matchNama = (item.namaAset || '').toLowerCase().includes(q);
            const matchDari = (item.dari || '').toLowerCase().includes(q);
            const matchKe = (item.ke || '').toLowerCase().includes(q);
            const matchKet = (item.keterangan || '').toLowerCase().includes(q);
            if (!matchKode && !matchNama && !matchDari && !matchKe && !matchKet) return false;
          }

          if (filterState.aktivitas && filterState.aktivitas !== 'Semua Aktivitas') {
            if ((item.aktivitas || '').trim() !== filterState.aktivitas) return false;
          }

          if (filterState.kondisi && filterState.kondisi !== 'Semua Kondisi') {
            if ((item.kondisi || '').trim() !== filterState.kondisi) return false;
          }

          if (filterState.startDate) {
            if (!item.tanggal || item.tanggal < filterState.startDate) return false;
          }
          if (filterState.endDate) {
            if (!item.tanggal || item.tanggal > filterState.endDate) return false;
          }

          return true;
        });
      }

      /* ===== RENDER TABLE ===== */
      function renderTable() {
        const filtered = getFilteredData();
        tableBody.innerHTML = '';

        if (filtered.length === 0) {
          const emptyMsg = mutasiData.length === 0
            ? 'Belum ada data mutasi aset. Klik "+ Tambah" untuk menambahkan.'
            : 'Tidak ada data mutasi aset yang sesuai';
          const emptyRow = document.createElement('tr');
          emptyRow.innerHTML = '<td colspan="11" style="text-align: center; padding: 48px 16px; color: #94a3b8; font-style: italic;">' +
            emptyMsg +
            '</td>';
          tableBody.appendChild(emptyRow);
          return;
        }

        filtered.forEach(function (item, idx) {
          const tr = document.createElement('tr');
          const badgeAktivitasCls = getAktivitasBadge(item.aktivitas);
          const isRusak = (item.kondisi || '').toLowerCase().includes('rusak');
          const kondisiCls = isRusak ? 'badge-kondisi-rusak' : 'badge-kondisi-baik';

          let buktiBtn = '<span style="color: #94a3b8; font-size: 12px; font-style: italic;">-</span>';
          if (item.buktiFoto) {
            buktiBtn = '<button type="button" class="btn-table-bukti" data-preview-img="' + escapeHtml(item.buktiFoto) + '" title="Lihat Foto Bukti">Lihat Foto</button>';
          }

          tr.innerHTML = [
            '<td style="text-align: center; color: #64748b; font-size: 13px;">' + (idx + 1) + '</td>',
            '<td class="mutasi-cell-italic">' + escapeHtml(formatTanggalDisplay(item.tanggal)) + '</td>',
            '<td class="mutasi-cell-italic" style="font-weight: 500;">' + escapeHtml(item.kodeAset) + '</td>',
            '<td style="font-weight: 500; color: #0f172a;">' + escapeHtml(item.namaAset) + '</td>',
            '<td><span class="badge-mutasi ' + badgeAktivitasCls + '">' + escapeHtml(item.aktivitas) + '</span></td>',
            '<td class="mutasi-cell-italic">' + escapeHtml(item.dari || '-') + '</td>',
            '<td class="mutasi-cell-italic">' + escapeHtml(item.ke || '-') + '</td>',
            '<td class="' + kondisiCls + '">' + escapeHtml(item.kondisi || 'Baik') + '</td>',
            '<td class="mutasi-cell-italic" style="max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">' + escapeHtml(item.keterangan || '-') + '</td>',
            '<td style="text-align: center;">' + buktiBtn + '</td>',
            '<td class="col-sticky-action" style="text-align: center;">' +
              '<button type="button" class="mutasi-action-btn" data-action-toggle="' + escapeHtml(item.id) + '" aria-label="Menu Aksi" title="Opsi">' +
                '<svg viewBox="0 0 24 24" aria-hidden="true" style="width: 18px; height: 18px; fill: currentColor;">' +
                  '<circle cx="12" cy="5" r="2"></circle>' +
                  '<circle cx="12" cy="12" r="2"></circle>' +
                  '<circle cx="12" cy="19" r="2"></circle>' +
                '</svg>' +
              '</button>' +
            '</td>'
          ].join('');

          tableBody.appendChild(tr);
        });
      }

      /* ===== FLOATING ACTION MENU LOGIC ===== */
      function closeActionMenus() {
        if (actionMenu) {
          actionMenu.classList.remove('is-open');
        }
        currentActionId = null;
      }

      function openActionMenu(button) {
        if (!actionMenu || !button) return;
        const id = button.getAttribute('data-action-toggle');

        if (actionMenu.classList.contains('is-open') && currentActionId === id) {
          closeActionMenus();
          return;
        }

        currentActionId = id;
        actionMenu.classList.add('is-open');

        const rect = button.getBoundingClientRect();
        const menuWidth = 145;
        const menuHeight = 120;

        let left = rect.left - menuWidth + 24;
        let top = rect.bottom + 6;

        if (left < 10) left = 10;
        if (left + menuWidth > window.innerWidth - 10) {
          left = window.innerWidth - menuWidth - 10;
        }
        if (top + menuHeight > window.innerHeight - 10) {
          top = rect.top - menuHeight - 6;
        }

        actionMenu.style.top = Math.max(10, top) + 'px';
        actionMenu.style.left = Math.max(10, left) + 'px';
      }

      if (tableBody) {
        tableBody.addEventListener('click', function (e) {
          const actionBtn = e.target.closest('[data-action-toggle]');
          if (actionBtn) {
            e.stopPropagation();
            openActionMenu(actionBtn);
            return;
          }

          const previewBtn = e.target.closest('[data-preview-img]');
          if (previewBtn) {
            e.stopPropagation();
            const src = previewBtn.getAttribute('data-preview-img') || '../../media/sample_struk.jpg';
            previewBuktiImg.src = src;
            buktiPreviewModal.classList.add('is-open');
            buktiPreviewModal.classList.add('is-active');
            buktiPreviewModal.style.display = 'flex';
            buktiPreviewModal.style.opacity = '1';
            buktiPreviewModal.style.pointerEvents = 'auto';
          }
        });
      }

      /* ===== MODAL DETAIL ("Lihat Mutasi Aset" - SESUAI GAMBAR 3) ===== */
      function openDetailModal(item) {
        if (!detailModal || !item) return;

        currentItemFotoUrl = item.buktiFoto || '';

        detailTanggal.textContent = formatTanggalDisplay(item.tanggal);
        detailKodeAset.textContent = item.kodeAset || '-';
        detailNamaAset.textContent = item.namaAset || '-';
        detailAktivitas.textContent = item.aktivitas || '-';
        detailDari.textContent = item.dari || '-';
        detailKe.textContent = item.ke || '-';
        detailKondisi.textContent = item.kondisi || '-';
        detailKeterangan.textContent = item.keterangan || '-';

        detailModal.classList.add('is-open');
        detailModal.classList.add('is-active');
        detailModal.style.display = 'flex';
        detailModal.style.opacity = '1';
        detailModal.style.pointerEvents = 'auto';
      }

      function closeDetailModal() {
        if (!detailModal) return;
        detailModal.classList.remove('is-open');
        detailModal.classList.remove('is-active');
        detailModal.style.display = 'none';
        detailModal.style.opacity = '0';
        detailModal.style.pointerEvents = 'none';
      }

      if (btnCloseDetailX) btnCloseDetailX.addEventListener('click', closeDetailModal);
      if (btnKeluarDetail) btnKeluarDetail.addEventListener('click', closeDetailModal);
      if (detailModal) {
        detailModal.addEventListener('click', function (e) {
          if (e.target === detailModal) closeDetailModal();
        });
      }

      if (btnLihatFoto) {
        btnLihatFoto.addEventListener('click', function () {
          const src = currentItemFotoUrl || '../../media/sample_struk.jpg';
          previewBuktiImg.src = src;
          buktiPreviewModal.classList.add('is-open');
          buktiPreviewModal.classList.add('is-active');
          buktiPreviewModal.style.display = 'flex';
          buktiPreviewModal.style.opacity = '1';
          buktiPreviewModal.style.pointerEvents = 'auto';
        });
      }

      /* ===== MODAL CRUD ("Tambah / Edit Mutasi Aset" - SESUAI GAMBAR 1 & 2) ===== */
      function openAddModal() {
        if (!crudModal) return;
        if (wrapKodeAset) wrapKodeAset.classList.remove('is-open');
        if (wrapAktivitas) wrapAktivitas.classList.remove('is-open');
        if (crudForm) crudForm.reset();
        crudId.value = '';
        if (crudKodeAset) crudKodeAset.value = '';
        if (crudNamaAset) crudNamaAset.value = '';
        if (crudAktivitas) crudAktivitas.value = '';
        crudModalTitle.innerHTML = '<em>Tambah</em> Mutasi Aset';
        renderKodeAsetDropdown('');
        renderAktivitasDropdown();

        if (fileNameDisplay) fileNameDisplay.textContent = 'Belum ada file';
        if (btnPreviewBuktiForm) btnPreviewBuktiForm.style.display = 'none';
        currentUploadedFotoDataUrl = '';
        currentItemFotoUrl = '';

        crudModal.classList.add('is-open');
        crudModal.classList.add('is-active');
        crudModal.style.display = 'flex';
        crudModal.style.opacity = '1';
        crudModal.style.pointerEvents = 'auto';
      }
      window.openAddModal = openAddModal;

      function openEditModal(item) {
        if (!crudModal || !item) return;
        if (wrapKodeAset) wrapKodeAset.classList.remove('is-open');
        if (wrapAktivitas) wrapAktivitas.classList.remove('is-open');
        crudForm.reset();
        crudId.value = item.id;
        crudModalTitle.innerHTML = '<em>Edit</em> Mutasi Aset';

        crudTanggal.value = item.tanggal || '';
        crudKodeAset.value = item.kodeAset || '';
        const match = findAssetByKode(item.kodeAset);
        crudNamaAset.value = match ? match.nama : (item.namaAset || '');
        renderKodeAsetDropdown('');

        crudAktivitas.value = item.aktivitas || '';
        renderAktivitasDropdown();

        crudDari.value = item.dari || '';
        crudKe.value = item.ke || '';
        crudKondisi.value = item.kondisi || '';
        crudKeterangan.value = item.keterangan || '';

        currentItemFotoUrl = item.buktiFoto || '';
        currentUploadedFotoDataUrl = item.buktiFoto || '';

        if (item.buktiFoto) {
          fileNameDisplay.textContent = 'Foto mutasi tersimpan';
          btnPreviewBuktiForm.style.display = 'inline-flex';
        } else {
          fileNameDisplay.textContent = 'Belum ada file';
          btnPreviewBuktiForm.style.display = 'none';
        }

        crudModal.classList.add('is-open');
        crudModal.classList.add('is-active');
        crudModal.style.display = 'flex';
        crudModal.style.opacity = '1';
        crudModal.style.pointerEvents = 'auto';
      }

      function closeCrudModal() {
        if (!crudModal) return;
        if (wrapKodeAset) wrapKodeAset.classList.remove('is-open');
        if (wrapAktivitas) wrapAktivitas.classList.remove('is-open');
        crudModal.classList.remove('is-open');
        crudModal.classList.remove('is-active');
        crudModal.style.display = 'none';
        crudModal.style.opacity = '0';
        crudModal.style.pointerEvents = 'none';
      }

      if (btnCloseCrudX) btnCloseCrudX.addEventListener('click', closeCrudModal);
      if (crudModal) {
        crudModal.addEventListener('click', function (e) {
          if (e.target === crudModal) closeCrudModal();
        });
      }

      if (crudForm) {
        crudForm.addEventListener('submit', function (e) {
          e.preventDefault();

          const kodeAsetVal = (crudKodeAset && crudKodeAset.value.trim()) || '';
          if (!kodeAsetVal) {
            if (typeof Swal !== 'undefined') {
              Swal.fire({
                icon: 'warning',
                title: 'Perhatian',
                text: 'Pilih Kode Aset terlebih dahulu!',
                confirmButtonColor: '#0076C5'
              });
            } else {
              alert('Pilih Kode Aset terlebih dahulu!');
            }
            if (crudKodeAset) crudKodeAset.focus();
            return;
          }

          let namaAsetVal = (crudNamaAset && crudNamaAset.value.trim()) || '';
          if (!namaAsetVal) {
            const match = findAssetByKode(kodeAsetVal);
            if (match) {
              namaAsetVal = match.nama;
              if (crudNamaAset) crudNamaAset.value = match.nama;
            }
          }

          const aktivitasVal = (crudAktivitas && crudAktivitas.value.trim()) || '';
          if (!aktivitasVal) {
            if (typeof Swal !== 'undefined') {
              Swal.fire({
                icon: 'warning',
                title: 'Perhatian',
                text: 'Pilih Aktivitas terlebih dahulu!',
                confirmButtonColor: '#0076C5'
              });
            } else {
              alert('Pilih Aktivitas terlebih dahulu!');
            }
            if (wrapAktivitas) wrapAktivitas.click();
            return;
          }

          function generateNextMutasiId() {
            const existingNums = mutasiData.map(function (x) {
              const m = String(x.id || '').match(/MUT-(\d+)/);
              return m ? parseInt(m[1], 10) : 0;
            });
            const maxNum = existingNums.length > 0 ? Math.max.apply(null, existingNums) : 0;
            return 'MUT-' + String(maxNum + 1).padStart(3, '0');
          }

          const editId = crudId.value;
          const newObj = {
            id: editId || generateNextMutasiId(),
            tanggal: crudTanggal.value || new Date().toISOString().slice(0, 10),
            kodeAset: kodeAsetVal,
            namaAset: namaAsetVal,
            aktivitas: aktivitasVal,
            dari: crudDari.value.trim(),
            ke: crudKe.value.trim(),
            kondisi: crudKondisi.value.trim(),
            keterangan: crudKeterangan.value.trim(),
            buktiFoto: currentUploadedFotoDataUrl || currentItemFotoUrl || ''
          };

          if (editId) {
            const idx = mutasiData.findIndex(function (x) { return String(x.id) === String(editId); });
            if (idx !== -1) mutasiData[idx] = newObj;
          } else {
            mutasiData.unshift(newObj);
          }

          saveData(mutasiData);
          closeCrudModal();
          renderTable();

          if (typeof Swal !== 'undefined') {
            Swal.fire({
              icon: 'success',
              title: 'Berhasil!',
              text: editId ? 'Data mutasi aset berhasil diperbarui.' : 'Data mutasi aset baru berhasil disimpan.',
              timer: 1500,
              showConfirmButton: false
            });
          }
        });
      }

      /* Action Menu Item Clicks */
      if (actionMenu) {
        actionMenu.addEventListener('click', function (e) {
          const btn = e.target.closest('[data-action]');
          if (!btn || !currentActionId) return;

          const action = btn.getAttribute('data-action');
          const targetItem = mutasiData.find(function (x) { return String(x.id) === String(currentActionId); });
          closeActionMenus();

          if (!targetItem) return;

          if (action === 'view') {
            openDetailModal(targetItem);
          } else if (action === 'edit') {
            openEditModal(targetItem);
          } else if (action === 'delete') {
            if (typeof Swal !== 'undefined') {
              Swal.fire({
                title: 'Hapus Mutasi Aset?',
                html: 'Yakin ingin menghapus riwayat mutasi aset <b>' + escapeHtml(targetItem.namaAset) + '</b> (' + escapeHtml(targetItem.kodeAset) + ')?',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#dc2626',
                cancelButtonColor: '#64748b',
                confirmButtonText: 'Ya, Hapus',
                cancelButtonText: 'Batal'
              }).then(function (result) {
                if (result.isConfirmed) {
                  mutasiData = mutasiData.filter(function (x) { return String(x.id) !== String(targetItem.id); });
                  saveData(mutasiData);
                  renderTable();
                  Swal.fire({
                    icon: 'success',
                    title: 'Terhapus',
                    text: 'Data mutasi berhasil dihapus.',
                    timer: 1400,
                    showConfirmButton: false
                  });
                }
              });
            }
          }
        });
      }

      // Close modal preview
      if (btnCloseBuktiPreview) {
        btnCloseBuktiPreview.addEventListener('click', function () {
          buktiPreviewModal.classList.remove('is-open');
          buktiPreviewModal.classList.remove('is-active');
          buktiPreviewModal.style.display = 'none';
          buktiPreviewModal.style.opacity = '0';
          buktiPreviewModal.style.pointerEvents = 'none';
        });
      }

      if (buktiPreviewModal) {
        buktiPreviewModal.addEventListener('click', function (e) {
          if (e.target === buktiPreviewModal) {
            btnCloseBuktiPreview.click();
          }
        });
      }

      /* ===== DROPDOWN FILTER POPOVER (AKTIVITAS & KONDISI) ===== */
      const aktivitasOptions = ['Semua Aktivitas', 'Pembelian', 'Pindah PIC', 'Pindah Lokasi', 'Service', 'Dijual', 'Dihapus'];
      const kondisiOptions = ['Semua Kondisi', 'Baik', 'Normal', 'Rusak Ringan', 'Rusak Berat', 'Dalam Perbaikan'];

      function renderFilterList(listEl, inputEl, boxEl, opts) {
        if (!listEl) return;
        listEl.innerHTML = '';
        opts.forEach(function (opt) {
          const item = document.createElement('div');
          item.className = 'mutasi-filter-item';
          if (inputEl.value === opt || (!inputEl.value && opt.startsWith('Semua'))) {
            item.classList.add('is-selected');
          }
          item.textContent = opt;
          item.addEventListener('click', function (e) {
            e.stopPropagation();
            inputEl.value = opt;
            boxEl.classList.remove('is-open');
          });
          listEl.appendChild(item);
        });
      }

      function setupDropdownToggle(boxEl, listEl, inputEl, opts) {
        if (!boxEl || !inputEl) return;
        inputEl.addEventListener('click', function (e) {
          e.stopPropagation();
          const isOpen = boxEl.classList.contains('is-open');
          closeAllFilterBoxes();
          if (!isOpen) {
            boxEl.classList.add('is-open');
            renderFilterList(listEl, inputEl, boxEl, opts);
          }
        });
      }

      function closeAllFilterBoxes() {
        if (boxFilterAktivitas) boxFilterAktivitas.classList.remove('is-open');
        if (boxFilterKondisi) boxFilterKondisi.classList.remove('is-open');
      }

      setupDropdownToggle(boxFilterAktivitas, listFilterAktivitas, filterAktivitas, aktivitasOptions);
      setupDropdownToggle(boxFilterKondisi, listFilterKondisi, filterKondisi, kondisiOptions);

      if (btnFilter && filterDropdown) {
        btnFilter.addEventListener('click', function (e) {
          e.stopPropagation();
          filterDropdown.classList.toggle('is-active');
          if (filterDropdown.classList.contains('is-active')) {
            if (calendarDropdown) calendarDropdown.classList.remove('is-active');
            closeAllFilterBoxes();
          }
        });
      }

      if (btnResetFilter) {
        btnResetFilter.addEventListener('click', function () {
          filterAktivitas.value = '';
          filterKondisi.value = '';
          filterState.aktivitas = '';
          filterState.kondisi = '';
          if (filterDropdown) filterDropdown.classList.remove('is-active');
          btnFilter.classList.remove('has-filter');
          renderTable();
        });
      }

      if (btnApplyFilter) {
        btnApplyFilter.addEventListener('click', function () {
          filterState.aktivitas = filterAktivitas.value.trim();
          filterState.kondisi = filterKondisi.value.trim();
          if (filterDropdown) filterDropdown.classList.remove('is-active');

          if (filterState.aktivitas || filterState.kondisi) {
            btnFilter.classList.add('has-filter');
          } else {
            btnFilter.classList.remove('has-filter');
          }

          renderTable();
        });
      }

      /* ===== DUAL MONTH CALENDAR LOGIC ===== */
      let calViewYear = 2026;
      let calViewMonth = 5; // Juni (0-indexed)
      let tempCalStart = null;
      let tempCalEnd = null;

      function renderDualCalendar() {
        if (!labelMonth1 || !labelMonth2 || !gridMonth1 || !gridMonth2) return;

        const monthNames = [
          'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni',
          'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'
        ];

        labelMonth1.textContent = monthNames[calViewMonth] + ' ' + calViewYear;
        renderMonthDays(calViewYear, calViewMonth, 'gridMonth1');

        let m2Year = calViewYear;
        let m2Month = calViewMonth + 1;
        if (m2Month > 11) {
          m2Month = 0;
          m2Year += 1;
        }
        labelMonth2.textContent = monthNames[m2Month] + ' ' + m2Year;
        renderMonthDays(m2Year, m2Month, 'gridMonth2');

        updateRangeDisplay();
      }

      function renderMonthDays(year, month, containerId) {
        const grid = document.getElementById(containerId);
        if (!grid) return;
        grid.innerHTML = '';

        const days = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
        days.forEach(function (d) {
          const col = document.createElement('div');
          col.className = 'month-day-name';
          col.textContent = d;
          grid.appendChild(col);
        });

        const firstDay = new Date(year, month, 1).getDay();
        const totalDays = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDay; i++) {
          const empty = document.createElement('div');
          grid.appendChild(empty);
        }

        for (let d = 1; d <= totalDays; d++) {
          const dayEl = document.createElement('div');
          dayEl.className = 'month-day';
          dayEl.textContent = d;

          const dateStr = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(d).padStart(2, '0');

          if (tempCalStart && dateStr === tempCalStart) {
            dayEl.classList.add('is-selected');
          }
          if (tempCalEnd && dateStr === tempCalEnd) {
            dayEl.classList.add('is-selected');
          }
          if (tempCalStart && tempCalEnd && dateStr > tempCalStart && dateStr < tempCalEnd) {
            dayEl.classList.add('in-range');
          }

          dayEl.addEventListener('click', function () {
            handleDateClick(dateStr);
          });

          grid.appendChild(dayEl);
        }
      }

      function handleDateClick(dateStr) {
        if (!tempCalStart || (tempCalStart && tempCalEnd)) {
          tempCalStart = dateStr;
          tempCalEnd = null;
        } else if (tempCalStart && !tempCalEnd) {
          if (dateStr < tempCalStart) {
            tempCalEnd = tempCalStart;
            tempCalStart = dateStr;
          } else {
            tempCalEnd = dateStr;
          }
        }
        renderDualCalendar();
      }

      function updateRangeDisplay() {
        if (!calendarRangeDisplay) return;
        if (tempCalStart && tempCalEnd) {
          calendarRangeDisplay.textContent = formatTanggalDisplay(tempCalStart) + ' - ' + formatTanggalDisplay(tempCalEnd);
        } else if (tempCalStart) {
          calendarRangeDisplay.textContent = formatTanggalDisplay(tempCalStart) + ' - ...';
        } else {
          calendarRangeDisplay.textContent = 'Semua Tanggal';
        }
      }

      if (btnPrevMonth) {
        btnPrevMonth.addEventListener('click', function () {
          calViewMonth--;
          if (calViewMonth < 0) {
            calViewMonth = 11;
            calViewYear--;
          }
          renderDualCalendar();
        });
      }

      if (btnNextMonth) {
        btnNextMonth.addEventListener('click', function () {
          calViewMonth++;
          if (calViewMonth > 11) {
            calViewMonth = 0;
            calViewYear++;
          }
          renderDualCalendar();
        });
      }

      if (btnCalendar && calendarDropdown) {
        btnCalendar.addEventListener('click', function (e) {
          e.stopPropagation();
          calendarDropdown.classList.toggle('is-active');
          if (calendarDropdown.classList.contains('is-active')) {
            if (filterDropdown) filterDropdown.classList.remove('is-active');
            tempCalStart = filterState.startDate || null;
            tempCalEnd = filterState.endDate || null;
            renderDualCalendar();
          }
        });
      }

      if (btnCancelCalendar && calendarDropdown) {
        btnCancelCalendar.addEventListener('click', function () {
          calendarDropdown.classList.remove('is-active');
        });
      }

      if (btnApplyCalendar && calendarDropdown) {
        btnApplyCalendar.addEventListener('click', function () {
          filterState.startDate = tempCalStart || '';
          filterState.endDate = tempCalEnd || '';
          calendarDropdown.classList.remove('is-active');

          if (filterState.startDate || filterState.endDate) {
            btnCalendar.classList.add('has-filter');
          } else {
            btnCalendar.classList.remove('has-filter');
          }

          renderTable();
        });
      }

      // Presets
      document.querySelectorAll('.calendar-preset-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          const preset = this.getAttribute('data-preset');
          const now = new Date();
          const curY = now.getFullYear();
          const curM = String(now.getMonth() + 1).padStart(2, '0');
          const curD = String(now.getDate()).padStart(2, '0');

          if (preset === 'today') {
            tempCalStart = curY + '-' + curM + '-' + curD;
            tempCalEnd = tempCalStart;
          } else if (preset === 'this-month') {
            tempCalStart = curY + '-' + curM + '-01';
            const lastD = new Date(curY, now.getMonth() + 1, 0).getDate();
            tempCalEnd = curY + '-' + curM + '-' + String(lastD).padStart(2, '0');
          } else if (preset === 'last-month') {
            const prevMonthDate = new Date(curY, now.getMonth() - 1, 1);
            const pY = prevMonthDate.getFullYear();
            const pM = String(prevMonthDate.getMonth() + 1).padStart(2, '0');
            const pLastD = new Date(pY, prevMonthDate.getMonth() + 1, 0).getDate();
            tempCalStart = pY + '-' + pM + '-01';
            tempCalEnd = pY + '-' + pM + '-' + String(pLastD).padStart(2, '0');
          } else if (preset === 'this-year') {
            tempCalStart = curY + '-01-01';
            tempCalEnd = curY + '-12-31';
          } else if (preset === 'reset') {
            tempCalStart = null;
            tempCalEnd = null;
          }

          renderDualCalendar();
        });
      });

      /* ===== SEARCH REAL-TIME ===== */
      if (searchInput) {
        searchInput.addEventListener('input', function () {
          filterState.search = this.value.trim();
          renderTable();
        });
      }

      /* ===== EXPORT EXCEL DENGAN EXCEL ENGINE ===== */
      async function exportMutasiExcel() {
        const rows = getFilteredData();
        if (rows.length === 0) {
          if (typeof Swal !== 'undefined') {
            Swal.fire({
              icon: 'warning',
              title: 'Data Kosong',
              text: 'Tidak ada data mutasi aset untuk diexport.',
              confirmButtonColor: '#0076C5'
            });
          } else {
            alert('Tidak ada data mutasi aset untuk diexport.');
          }
          return;
        }

        const filename = 'Laporan_Mutasi_Aset_' + new Date().toISOString().slice(0, 10) + '.xlsx';

        const headers = [
          'No',
          'Tanggal',
          'Kode Aset',
          'Nama Aset',
          'Aktivitas',
          'Dari',
          'Ke',
          'Kondisi',
          'Keterangan'
        ];

        const exportData = rows.map(function (item, idx) {
          return [
            idx + 1,
            formatTanggalDisplay(item.tanggal),
            item.kodeAset || '-',
            item.namaAset || '-',
            item.aktivitas || '-',
            item.dari || '-',
            item.ke || '-',
            item.kondisi || '-',
            item.keterangan || '-'
          ];
        });

        if (typeof window.exportBisaExcel === 'function') {
          await window.exportBisaExcel({
            title: 'LAPORAN MUTASI ASET PERUSAHAAN',
            filename: filename,
            sheetName: 'Mutasi Aset',
            headers: headers,
            rows: exportData
          });
        } else if (typeof window.exportTableToExcel === 'function') {
          await window.exportTableToExcel('mutasiTable', filename, 'LAPORAN MUTASI ASET');
        } else {
          let csv = headers.join(',') + '\n';
          exportData.forEach(function (r) {
            csv += r.map(function (c) { return '"' + String(c).replace(/"/g, '""') + '"'; }).join(',') + '\n';
          });
          const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.setAttribute('href', url);
          link.setAttribute('download', filename.replace('.xlsx', '.csv'));
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        }
      }
      window.exportMutasiExcel = exportMutasiExcel;

      if (btnExportExcel) {
        btnExportExcel.addEventListener('click', exportMutasiExcel);
      }

      /* ===== GLOBAL CLICK LISTENER (TUTUP POPUP & MENU) ===== */
      document.addEventListener('click', function (e) {
        if (!e.target.closest('#mutasiActionMenu') && !e.target.closest('[data-action-toggle]')) {
          closeActionMenus();
        }
        if (!e.target.closest('#filterDropdown') && !e.target.closest('#btnFilter')) {
          if (filterDropdown) filterDropdown.classList.remove('is-active');
          closeAllFilterBoxes();
        }
        if (!e.target.closest('#calendarDropdown') && !e.target.closest('#btnCalendar')) {
          if (calendarDropdown) calendarDropdown.classList.remove('is-active');
        }
        if (!e.target.closest('#wrapKodeAset')) {
          if (wrapKodeAset) wrapKodeAset.classList.remove('is-open');
        }
        if (!e.target.closest('#wrapAktivitas')) {
          if (wrapAktivitas) wrapAktivitas.classList.remove('is-open');
        }
      });

      window.addEventListener('scroll', closeActionMenus, true);

      // Initial Render
      renderTable();
    });
  </script>
</body>

</html>
