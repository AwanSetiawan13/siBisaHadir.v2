<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bank Lama | Bisa Media</title>
  <link rel="stylesheet" href="../../assets/css/style.css?v=20261031" />
  <link rel="icon" type="image/png" href="../../media/logo.png" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    #bankTable {
      width: 100%;
      min-width: 800px;
      border-collapse: collapse;
    }

    #bankTable th,
    #bankTable td {
      vertical-align: middle;
      padding: 14px 16px;
    }

    #bankTable th:nth-child(1),
    #bankTable td:nth-child(1) {
      width: 50px;
      text-align: center;
    }

    #bankTable th:nth-child(2),
    #bankTable td:nth-child(2) {
      min-width: 180px;
    }

    #bankTable th:nth-child(3),
    #bankTable td:nth-child(3) {
      min-width: 200px;
    }

    #bankTable th:nth-child(4),
    #bankTable td:nth-child(4) {
      min-width: 240px;
    }

    #bankTable th:nth-child(5),
    #bankTable td:nth-child(5) {
      width: 80px;
      text-align: center;
    }

    #bankTable thead th {
      background: #f4f4f5;
      color: #0f172a;
      font-family: 'Outfit', sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      text-transform: none;
      letter-spacing: 0;
      border-bottom: 1px solid #e4e4e7;
    }

    #bankTable tbody tr {
      border-bottom: 1px solid #f1f5f9;
      transition: background 0.15s ease;
    }

    #bankTable tbody tr:hover {
      background: #f8fafc;
    }

    .bank-panel-line {
      display: block;
      height: 4px;
      margin: -20px -20px 16px;
      border-radius: 16px 16px 0 0;
      background: var(--blue-800, #1e5a96);
    }

    /* ===== Toolbar Bank Lama (Sesuai Referensi Gambar) ===== */
    .bank-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 14px;
    }

    .bank-toolbar__left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .bank-search-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      width: 180px;
    }

    .bank-search-wrap svg {
      position: absolute;
      left: 10px;
      width: 15px;
      height: 15px;
      color: #64748b;
      pointer-events: none;
    }

    .bank-search-wrap input {
      width: 100%;
      height: 34px;
      padding: 0 12px 0 32px;
      border: 1px solid #71717a;
      border-radius: 8px;
      background: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      color: #1e293b;
      outline: none;
      box-sizing: border-box;
      transition: all 0.15s ease;
    }

    .bank-search-wrap input:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
    }

    .bank-search-wrap input::placeholder {
      color: #94a3b8;
      font-size: 13px;
    }

    .btn-tambah-bank {
      height: 36px;
      padding: 0 18px;
      border: none;
      border-radius: 6px;
      background: #28a5de;
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 2px 4px rgba(40, 165, 222, 0.25);
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .btn-tambah-bank:hover {
      background: #0284c7;
    }

    .btn-tambah-bank:active {
      transform: scale(0.98);
    }

    .bank-dashed-divider {
      border: none;
      border-top: 1px dashed #d4d4d8;
      margin: 0 0 16px 0;
    }

    /* Action button in table */
    .bank-action-btn {
      width: 32px;
      height: 32px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #0f172a;
      background: transparent;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .bank-action-btn:hover {
      background: #f1f5f9;
    }

    .bank-action-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Floating Action Menu (Fixed di luar tabel) */
    .bank-action-menu {
      display: none;
      position: fixed;
      z-index: 2147483000;
      min-width: 145px;
      padding: 6px;
      border: 1px solid rgba(0, 0, 0, .08);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 4px 20px rgba(0, 0, 0, .14);
    }

    .bank-action-menu.is-open {
      display: block;
    }

    .bank-action-menu button {
      width: 100%;
      min-height: 38px;
      padding: 7px 12px;
      border: 0;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #334155;
      background: transparent;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 500;
      text-align: left;
      white-space: nowrap;
      cursor: pointer;
    }

    .bank-action-menu button:hover {
      color: #0f172a;
      background: #f1f5f9;
    }

    .bank-action-icon {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 26px;
      color: #fff;
      background: #0076C5;
    }

    .bank-action-icon svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .bank-action-menu button.is-danger {
      color: #dc2626;
    }

    .bank-action-menu button.is-danger:hover {
      background: #fef2f2;
    }

    .bank-action-menu .bank-action-icon.is-danger {
      background: #e02424;
    }

    .bank-empty-cell {
      padding: 40px 24px !important;
      color: #94a3b8 !important;
      text-align: center !important;
      font-style: italic;
    }

    /* ===== MODAL KHUSUS BANK LAMA (Sesuai Referensi Gambar) ===== */
    .bank-modal-box {
      position: relative;
      width: 680px;
      max-width: 95%;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      padding: 26px 32px 24px;
      box-sizing: border-box;
    }

    .bank-modal-accent-line {
      position: absolute;
      top: 14px;
      left: 24px;
      right: 24px;
      height: 3px;
      background: #2563eb;
      border-radius: 2px;
    }

    .bank-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      margin-bottom: 12px;
    }

    .bank-modal-title {
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 500;
      color: #475569;
      margin: 0;
    }

    .bank-modal-title em,
    .bank-modal-title strong {
      font-style: italic;
      font-weight: 700;
      color: #0f172a;
      margin-right: 3px;
    }

    .bank-modal-close-btn {
      width: 22px;
      height: 22px;
      border: 1px solid #71717a;
      border-radius: 4px;
      background: transparent;
      color: #1e293b;
      font-size: 13px;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      transition: all 0.15s ease;
    }

    .bank-modal-close-btn:hover {
      background: #f1f5f9;
      border-color: #0f172a;
    }

    .bank-modal-dashed-divider {
      border: none;
      border-top: 1px dashed #cbd5e1;
      margin: 0 0 22px 0;
    }

    /* 2-Column Form Grid */
    .bank-form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 22px;
      row-gap: 18px;
    }

    .bank-form-field {
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .bank-form-field.bank-field-full {
      grid-column: 1 / -1;
    }

    .bank-form-label {
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
      text-align: center;
      margin-bottom: 6px;
      line-height: 1.2;
    }

    .bank-form-label.label-left {
      text-align: left;
      padding-left: 18px;
    }

    .bank-form-input {
      width: 100%;
      height: 42px;
      padding: 0 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      font-family: 'Outfit', sans-serif;
      font-size: 13.5px;
      color: #1e293b;
      text-align: center;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .bank-form-input:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
    }

    .bank-form-input::placeholder {
      font-style: italic;
      font-weight: 400;
      color: #94a3b8;
      text-align: center;
    }

    .bank-form-input:read-only {
      background: #f8fafc;
      color: #334155;
      cursor: default;
    }

    .bank-modal-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 24px;
    }

    .bank-btn-simpan {
      height: 38px;
      padding: 0 34px;
      border: 1.5px solid #38bdf8;
      border-radius: 6px;
      background: #ffffff;
      color: #0f172a;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .bank-btn-simpan:hover {
      background: #f0f9ff;
      border-color: #0284c7;
      color: #0284c7;
    }

    .bank-btn-tutup {
      height: 38px;
      padding: 0 24px;
      border: 1.5px solid #94a3b8;
      border-radius: 6px;
      background: #ffffff;
      color: #475569;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .bank-btn-tutup:hover {
      background: #f1f5f9;
      color: #0f172a;
    }

    /* ===== SweetAlert2 Custom Styling for Bisa Media ===== */
    .swal2-bisa-popup {
      font-family: 'Outfit', sans-serif !important;
      border-radius: 14px !important;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.16) !important;
      padding: 24px 20px !important;
    }

    .swal2-bisa-popup .swal2-title {
      font-family: 'Outfit', sans-serif !important;
      font-size: 18px !important;
      font-weight: 700 !important;
      color: #1e293b !important;
      margin-top: 10px !important;
    }

    .swal2-bisa-popup .swal2-html-container {
      font-family: 'Outfit', sans-serif !important;
      font-size: 13.5px !important;
      color: #64748b !important;
      line-height: 1.55 !important;
      margin-top: 8px !important;
    }

    .swal2-bisa-popup .swal2-confirm,
    .swal2-bisa-popup .swal2-cancel {
      font-family: 'Outfit', sans-serif !important;
      font-size: 13px !important;
      font-weight: 600 !important;
      border-radius: 8px !important;
      padding: 9px 22px !important;
      box-shadow: none !important;
      transition: all 0.15s ease !important;
    }

    .swal2-container {
      z-index: 9999999 !important;
    }

    @media (max-width: 640px) {
      .bank-form-grid {
        grid-template-columns: 1fr;
      }
      .bank-form-label.label-left {
        padding-left: 0;
      }
    }
  </style>
</head>

<body class="dashboard-body">
  <aside id="app-sidebar"></aside>

  <div class="dashboard-shell">
    <header class="topbar"></header>

    <main class="dashboard-content">
      <div class="dashboard-heading">
        <h1>Bank Lama</h1>
      </div>

      <section class="panel campaign-panel">
        <div class="campaign-panel__line bank-panel-line"></div>

        <div class="bank-toolbar">
          <div class="bank-toolbar__left">
            <div class="bank-search-wrap">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input id="bankSearch" type="search" placeholder="Cari...." autocomplete="off" />
            </div>
          </div>

          <div class="bank-toolbar__right">
            <button id="btnTambahBank" class="btn-tambah-bank" type="button">+ Tambah</button>
          </div>
        </div>

        <div class="bank-dashed-divider"></div>

        <div class="table-wrap campaign-table" id="bankTableWrap">
          <table id="bankTable">
            <thead>
              <tr>
                <th>#</th>
                <th>Nama Bank</th>
                <th>Nomor Rekening</th>
                <th>Atas Nama</th>
                <th style="width: 70px; text-align: center;">Aksi</th>
              </tr>
            </thead>
            <tbody id="bankTableBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- ===== MODAL TAMBAH / EDIT BANK LAMA ===== -->
  <div id="bankFormModal" class="modal-overlay">
    <div class="bank-modal-box">
      <div class="bank-modal-accent-line"></div>

      <div class="bank-modal-header">
        <h2 class="bank-modal-title">
          <em><span id="bankFormActionText">Tambah</span></em> Bank Lama
        </h2>
        <button class="bank-modal-close-btn" type="button" data-close-modal="bankFormModal" aria-label="Tutup">x</button>
      </div>
      <div class="bank-modal-dashed-divider"></div>

      <form id="bankForm" autocomplete="off">
        <input type="hidden" id="bankEditId" />

        <div class="bank-form-grid">
          <div class="bank-form-field">
            <label class="bank-form-label" for="bankNama">Nama Bank</label>
            <input type="text" id="bankNama" class="bank-form-input" placeholder="Tambah Nama Bank" required />
          </div>

          <div class="bank-form-field">
            <label class="bank-form-label" for="bankNomorRekening">Nomor Rekening</label>
            <input type="text" id="bankNomorRekening" class="bank-form-input" placeholder="Tambah Nomor Rekening" required />
          </div>

          <div class="bank-form-field bank-field-full">
            <label class="bank-form-label label-left" for="bankAtasNama">Atas Nama</label>
            <input type="text" id="bankAtasNama" class="bank-form-input" placeholder="Tambah Nama Akun" required />
          </div>
        </div>

        <div class="bank-modal-footer">
          <button type="submit" class="bank-btn-simpan">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== MODAL LIHAT BANK LAMA ===== -->
  <div id="bankViewModal" class="modal-overlay">
    <div class="bank-modal-box">
      <div class="bank-modal-accent-line"></div>

      <div class="bank-modal-header">
        <h2 class="bank-modal-title">
          <em>Lihat</em> Bank Lama
        </h2>
        <button class="bank-modal-close-btn" type="button" data-close-modal="bankViewModal" aria-label="Tutup">x</button>
      </div>
      <div class="bank-modal-dashed-divider"></div>

      <div class="bank-form-grid" id="bankViewGrid">
        <div class="bank-form-field">
          <label class="bank-form-label">Nama Bank</label>
          <input type="text" id="viewBankNama" class="bank-form-input" readonly />
        </div>

        <div class="bank-form-field">
          <label class="bank-form-label">Nomor Rekening</label>
          <input type="text" id="viewBankNomorRekening" class="bank-form-input" readonly />
        </div>

        <div class="bank-form-field bank-field-full">
          <label class="bank-form-label label-left">Atas Nama</label>
          <input type="text" id="viewBankAtasNama" class="bank-form-input" readonly />
        </div>
      </div>

      <div class="bank-modal-footer">
        <button type="button" class="bank-btn-tutup" data-close-modal="bankViewModal">Tutup</button>
      </div>
    </div>
  </div>

  <!-- Global Action Menu (Fixed di luar tabel agar tidak tertutup) -->
  <div id="bankActionMenu" class="bank-action-menu" role="menu">
    <button type="button" data-action="view">
      <span class="bank-action-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </span>
      <span>Lihat</span>
    </button>
    <button type="button" data-action="edit">
      <span class="bank-action-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>
      </span>
      <span>Edit</span>
    </button>
    <button type="button" class="is-danger" data-action="delete">
      <span class="bank-action-icon is-danger">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14H6L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg>
      </span>
      <span>Hapus</span>
    </button>
  </div>

  <script src="../../assets/js/layout.js?v=1008"></script>
  <script>
    (function () {
      'use strict';

      const STORAGE_KEY = 'accounting_bank_lama_v1';

      const tableBody = document.getElementById('bankTableBody');
      const searchInput = document.getElementById('bankSearch');
      const formModal = document.getElementById('bankFormModal');
      const viewModal = document.getElementById('bankViewModal');
      const form = document.getElementById('bankForm');
      const actionMenu = document.getElementById('bankActionMenu');

      let bankData = loadData();
      let currentActionId = null;

      function loadData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const parsed = raw ? JSON.parse(raw) : [];
          if (Array.isArray(parsed) && parsed.length > 0) {
            return parsed.filter(Boolean);
          }
          // Default initial seed data for Bank Lama
          const seedData = [
            {
              id: 'bank-1',
              namaBank: 'BCA (Bank Central Asia)',
              nomorRekening: '8830592811',
              atasNama: 'PT Bisa Media Nusantara'
            },
            {
              id: 'bank-2',
              namaBank: 'Bank Mandiri',
              nomorRekening: '1370019283741',
              atasNama: 'PT Bisa Media Nusantara'
            },
            {
              id: 'bank-3',
              namaBank: 'BNI (Bank Negara Indonesia)',
              nomorRekening: '0981726354',
              atasNama: 'Bisa Media Group'
            },
            {
              id: 'bank-4',
              namaBank: 'BRI (Bank Rakyat Indonesia)',
              nomorRekening: '034101000982301',
              atasNama: 'PT Bisa Media Nusantara'
            }
          ];
          localStorage.setItem(STORAGE_KEY, JSON.stringify(seedData));
          return seedData;
        } catch (error) {
          return [];
        }
      }

      function saveData() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(bankData));
        } catch (error) {
          showToast('Gagal menyimpan data Bank', 'error');
        }
      }

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function showToast(message, type) {
        const iconType = type || 'success';
        if (typeof Swal !== 'undefined') {
          Swal.fire({
            toast: true,
            position: 'top-end',
            icon: iconType,
            title: message,
            showConfirmButton: false,
            timer: 2600,
            timerProgressBar: true,
            customClass: {
              popup: 'swal2-bisa-popup'
            }
          });
        }
      }

      function openModal(modal) {
        if (modal) modal.classList.add('is-active');
      }

      function closeModal(modal) {
        if (modal) modal.classList.remove('is-active');
      }

      function getFilteredData() {
        const query = (searchInput && searchInput.value ? searchInput.value : '').trim().toLowerCase();
        if (!query) return bankData;

        return bankData.filter(function (item) {
          return [
            item.namaBank,
            item.nomorRekening,
            item.atasNama
          ].some(function (value) {
            return String(value || '').toLowerCase().includes(query);
          });
        });
      }

      function renderTable() {
        if (!tableBody) return;
        tableBody.innerHTML = '';

        const filtered = getFilteredData();
        if (filtered.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="5" class="bank-empty-cell">Tidak ada data Bank Lama yang sesuai.</td></tr>';
          return;
        }

        filtered.forEach(function (item, index) {
          const row = document.createElement('tr');
          row.innerHTML = [
            '<td style="text-align: center; color: #64748b;">' + (index + 1) + '</td>',
            '<td style="font-weight: 600; color: #1e293b; white-space: nowrap;">' + escapeHtml(item.namaBank || '-') + '</td>',
            '<td style="color: #1e293b; font-family: monospace; font-size: 15.5px; font-weight: 600; letter-spacing: 0.3px;">' + escapeHtml(item.nomorRekening || '-') + '</td>',
            '<td style="color: #334155;">' + escapeHtml(item.atasNama || '-') + '</td>',
            '<td style="text-align: center;">' +
              '<button type="button" class="bank-action-btn" data-action-toggle="' + escapeHtml(item.id) + '" aria-label="Menu Aksi" title="Opsi">' +
                '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="12" cy="19" r="2"></circle></svg>' +
              '</button>' +
            '</td>'
          ].join('');
          tableBody.appendChild(row);
        });
      }

      function closeActionMenus() {
        if (actionMenu) {
          actionMenu.classList.remove('is-open');
        }
        currentActionId = null;
      }

      function openActionMenu(button) {
        if (!actionMenu || !button) return;
        const id = button.getAttribute('data-action-toggle');

        if (actionMenu.classList.contains('is-open') && currentActionId === id) {
          closeActionMenus();
          return;
        }

        currentActionId = id;
        actionMenu.classList.add('is-open');

        const rect = button.getBoundingClientRect();
        const menuWidth = actionMenu.offsetWidth || 145;
        const menuHeight = actionMenu.offsetHeight || 130;

        let left = rect.left - menuWidth + 24;
        let top = rect.bottom + 6;

        if (left < 10) left = 10;
        if (left + menuWidth > window.innerWidth - 10) {
          left = window.innerWidth - menuWidth - 10;
        }
        if (top + menuHeight > window.innerHeight - 10) {
          top = rect.top - menuHeight - 6;
        }

        actionMenu.style.top = Math.max(10, top) + 'px';
        actionMenu.style.left = Math.max(10, left) + 'px';
      }

      function openForm(item) {
        if (!form) return;
        form.reset();

        document.getElementById('bankEditId').value = item ? item.id : '';
        const actionText = document.getElementById('bankFormActionText');

        if (item) {
          if (actionText) actionText.textContent = 'Edit';
          document.getElementById('bankNama').value = item.namaBank || '';
          document.getElementById('bankNomorRekening').value = item.nomorRekening || '';
          document.getElementById('bankAtasNama').value = item.atasNama || '';
        } else {
          if (actionText) actionText.textContent = 'Tambah';
          document.getElementById('bankNama').value = '';
          document.getElementById('bankNomorRekening').value = '';
          document.getElementById('bankAtasNama').value = '';
        }

        openModal(formModal);
        window.setTimeout(function () {
          const input = document.getElementById('bankNama');
          if (input) input.focus();
        }, 60);
      }

      function openView(item) {
        if (!item) return;
        document.getElementById('viewBankNama').value = item.namaBank || '-';
        document.getElementById('viewBankNomorRekening').value = item.nomorRekening || '-';
        document.getElementById('viewBankAtasNama').value = item.atasNama || '-';
        openModal(viewModal);
      }

      function askDelete(item) {
        if (!item) return;
        if (typeof Swal !== 'undefined') {
          Swal.fire({
            title: 'Hapus Bank Lama?',
            html: 'Apakah Anda yakin ingin menghapus bank <strong>"' + escapeHtml(item.namaBank) + '"</strong> dengan nomor rekening <strong>' + escapeHtml(item.nomorRekening) + '</strong>?',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#e02424',
            cancelButtonColor: '#94a3b8',
            confirmButtonText: 'Ya, Hapus',
            cancelButtonText: 'Batal',
            reverseButtons: true,
            focusCancel: true,
            customClass: {
              popup: 'swal2-bisa-popup'
            }
          }).then(function (result) {
            if (result.isConfirmed) {
              bankData = bankData.filter(function (d) {
                return String(d.id) !== String(item.id);
              });
              saveData();
              renderTable();
              showToast('Data Bank berhasil dihapus', 'success');
            }
          });
        }
      }

      function findItem(id) {
        return bankData.find(function (item) {
          return String(item.id) === String(id);
        });
      }

      if (tableBody) {
        tableBody.addEventListener('click', function (event) {
          const toggle = event.target.closest('[data-action-toggle]');
          if (toggle) {
            event.preventDefault();
            event.stopPropagation();
            openActionMenu(toggle);
            return;
          }
        });
      }

      if (actionMenu) {
        actionMenu.addEventListener('click', function (event) {
          const actionButton = event.target.closest('[data-action]');
          if (!actionButton) return;

          event.preventDefault();
          event.stopPropagation();

          const item = findItem(currentActionId);
          const action = actionButton.getAttribute('data-action');
          closeActionMenus();

          if (!item) return;

          if (action === 'view') openView(item);
          if (action === 'edit') openForm(item);
          if (action === 'delete') askDelete(item);
        });
      }

      const btnTambah = document.getElementById('btnTambahBank');
      if (btnTambah) {
        btnTambah.addEventListener('click', function () {
          openForm(null);
        });
      }

      if (searchInput) {
        searchInput.addEventListener('input', function () {
          renderTable();
        });
      }

      if (form) {
        form.addEventListener('submit', function (event) {
          event.preventDefault();

          const editId = document.getElementById('bankEditId').value;
          const payload = {
            namaBank: document.getElementById('bankNama').value.trim(),
            nomorRekening: document.getElementById('bankNomorRekening').value.trim(),
            atasNama: document.getElementById('bankAtasNama').value.trim()
          };

          if (!payload.namaBank || !payload.nomorRekening || !payload.atasNama) {
            if (typeof Swal !== 'undefined') {
              Swal.fire({
                icon: 'warning',
                title: 'Lengkapi Field Wajib',
                text: 'Nama Bank, Nomor Rekening, dan Atas Nama harus diisi.',
                confirmButtonColor: '#0076C5',
                customClass: { popup: 'swal2-bisa-popup' }
              });
            }
            return;
          }

          if (editId) {
            const index = bankData.findIndex(function (item) {
              return String(item.id) === String(editId);
            });
            if (index !== -1) {
              bankData[index] = Object.assign({}, bankData[index], payload);
              showToast('Data Bank berhasil diperbarui', 'success');
            }
          } else {
            bankData.push(Object.assign({
              id: 'bank-' + Date.now()
            }, payload));
            showToast('Data Bank berhasil ditambahkan', 'success');
          }

          saveData();
          renderTable();
          closeModal(formModal);
        });
      }

      document.querySelectorAll('[data-close-modal]').forEach(function (button) {
        button.addEventListener('click', function () {
          closeModal(document.getElementById(button.getAttribute('data-close-modal')));
        });
      });

      document.querySelectorAll('.modal-overlay').forEach(function (overlay) {
        overlay.addEventListener('click', function (event) {
          if (event.target === overlay) overlay.classList.remove('is-active');
        });
      });

      document.addEventListener('click', function (event) {
        if (!event.target.closest('#bankActionMenu') && !event.target.closest('[data-action-toggle]')) {
          closeActionMenus();
        }
      });

      window.addEventListener('scroll', closeActionMenus, true);
      window.addEventListener('resize', closeActionMenus);

      document.addEventListener('keydown', function (event) {
        if (event.key !== 'Escape') return;
        closeActionMenus();
        document.querySelectorAll('.modal-overlay.is-active').forEach(function (overlay) {
          overlay.classList.remove('is-active');
        });
      });

      renderTable();
    })();
  </script>
</body>

</html>
