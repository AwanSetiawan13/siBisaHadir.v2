<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Master COA | Bisa Media</title>
  <link rel="stylesheet" href="../../assets/css/style.css?v=20261031" />
  <link rel="icon" type="image/png" href="../../media/logo.png" />
  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    #coaTable {
      min-width: 1650px;
    }

    #coaTable th,
    #coaTable td {
      vertical-align: middle;
    }

    #coaTable th:nth-child(1),
    #coaTable td:nth-child(1) {
      width: 48px;
      min-width: 48px;
      max-width: 48px;
      text-align: center;
      box-sizing: border-box;
    }

    #coaTable th:nth-child(2),
    #coaTable td:nth-child(2) {
      width: 135px;
      min-width: 135px;
      max-width: 135px;
      white-space: nowrap;
      box-sizing: border-box;
    }

    #coaTable th:nth-child(3),
    #coaTable td:nth-child(3) {
      width: 250px;
      min-width: 250px;
      white-space: nowrap;
      box-sizing: border-box;
    }

    /* ===== STYLING CEKLIS FIXED / PIN KOLOM (PERSIS SEPERTI MODUL KOL) ===== */
    .th-pin-wrapper {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    .pin-check-btn {
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      margin: 0;
      padding: 0;
      position: relative;
    }

    .pin-check-btn input[type="checkbox"] {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
      pointer-events: none;
    }

    .pin-check-indicator {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      border: 1.5px solid #cbd5e1;
      background: #ffffff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .pin-check-indicator svg {
      width: 11px;
      height: 11px;
      stroke: #ffffff;
      opacity: 0;
      transform: scale(0.6);
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .pin-check-btn:hover .pin-check-indicator {
      border-color: #1e5a96;
      background: #eff6ff;
    }

    .pin-check-btn input[type="checkbox"]:checked + .pin-check-indicator {
      background: #1e5a96;
      border-color: #1e5a96;
      box-shadow: 0 1px 4px rgba(30, 90, 150, 0.35);
    }

    .pin-check-btn input[type="checkbox"]:checked + .pin-check-indicator svg {
      opacity: 1;
      transform: scale(1);
    }

    /* Fixed/Pinned Left Columns (Persis Seperti Modul KOL) */
    #coaTable th:first-child,
    #coaTable td:first-child {
      position: sticky;
      left: 0;
      z-index: 11;
      background: #f8fafc;
      text-align: center;
      min-width: 44px;
      max-width: 48px;
    }

    #coaTable td:first-child {
      background: #ffffff;
    }

    #coaTable tr:hover td:first-child {
      background: #f8fafc;
    }

    #coaTable th.col-pinned-sticky {
      position: sticky;
      z-index: 10;
      background: #f8fafc !important;
    }

    #coaTable td.col-pinned-sticky {
      position: sticky;
      z-index: 9;
      background: #ffffff !important;
    }

    #coaTable tr:hover td.col-pinned-sticky {
      background: #f8fafc !important;
    }

    #coaTable th.col-pinned-last,
    #coaTable td.col-pinned-last {
      box-shadow: 5px 0 12px rgba(0, 0, 0, 0.06) !important;
      border-right: 1.5px solid #cbd5e1 !important;
    }

    #coaTable th:nth-child(4),
    #coaTable td:nth-child(4) {
      min-width: 130px;
    }

    #coaTable th:nth-child(5),
    #coaTable td:nth-child(5) {
      min-width: 150px;
    }

    #coaTable th:nth-child(6),
    #coaTable td:nth-child(6),
    #coaTable th:nth-child(7),
    #coaTable td:nth-child(7) {
      min-width: 110px;
      text-align: center;
    }

    #coaTable th:nth-child(8),
    #coaTable td:nth-child(8) {
      min-width: 140px;
    }

    #coaTable th:nth-child(9),
    #coaTable td:nth-child(9) {
      min-width: 140px;
    }

    #coaTable th:nth-child(10),
    #coaTable td:nth-child(10) {
      min-width: 150px;
    }

    #coaTable th:nth-child(11),
    #coaTable td:nth-child(11) {
      min-width: 180px;
    }

    #coaTableWrap {
      min-height: 200px;
    }

    #coaTable thead th {
      text-transform: none;
      letter-spacing: 0;
      font-size: 12px;
      font-weight: 600;
    }

    #coaTable .app-empty-table-row {
      display: none !important;
    }

    .coa-panel-line {
      display: block;
      height: 4px;
      margin: -20px -20px 16px;
      border-radius: 16px 16px 0 0;
      background: var(--blue-800, #1e5a96);
    }

    .coa-action-wrap {
      position: relative;
      display: inline-flex;
    }

    .coa-action-btn {
      width: 32px;
      height: 32px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      background: transparent;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .coa-action-btn:hover,
    .coa-action-btn[aria-expanded="true"] {
      color: #0f172a;
      background: #f1f5f9;
    }

    .coa-action-btn svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .coa-action-menu {
      display: none;
      position: fixed;
      z-index: 2147483000;
      min-width: 150px;
      padding: 6px;
      border: 1px solid rgba(0, 0, 0, .08);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 4px 20px rgba(0, 0, 0, .14);
    }

    .coa-action-menu.is-open {
      display: block;
    }

    .coa-action-menu button {
      width: 100%;
      min-height: 38px;
      padding: 7px 12px;
      border: 0;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #334155;
      background: transparent;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 500;
      text-align: left;
      white-space: nowrap;
      cursor: pointer;
    }

    .coa-action-menu button:hover {
      color: #0f172a;
      background: #f1f5f9;
    }

    .coa-action-icon {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 26px;
      color: #fff;
      background: #0076C5;
    }

    .coa-action-icon svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .coa-action-menu button.is-danger {
      color: #dc2626;
    }

    .coa-action-menu button.is-danger:hover {
      background: #fef2f2;
    }

    .coa-action-menu .coa-action-icon.is-danger {
      background: #e02424;
    }

    .coa-empty-cell {
      padding: 40px 24px !important;
      color: #94a3b8 !important;
      text-align: center !important;
      font-style: italic;
    }

    .coa-btn-secondary {
      height: 40px;
      padding: 0 24px;
      border: 1.5px solid #64748b;
      border-radius: 6px;
      color: #64748b;
      background: #fff;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
    }

    .coa-btn-secondary:hover {
      background: #f8fafc;
    }

    .coa-delete-icon svg {
      width: 28px;
      height: 28px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* ===== DESAIN MODAL KHUSUS MASTER COA (Sesuai Referensi Gambar) ===== */
    .coa-modal-box {
      position: relative;
      width: 820px;
      max-width: 95%;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      padding: 26px 32px 24px;
      box-sizing: border-box;
    }

    .coa-modal-accent-line {
      position: absolute;
      top: 14px;
      left: 24px;
      right: 24px;
      height: 3px;
      background: #2563eb;
      border-radius: 2px;
    }

    .coa-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      margin-bottom: 12px;
    }

    .coa-modal-title {
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 500;
      color: #475569;
      margin: 0;
    }

    .coa-modal-title em,
    .coa-modal-title strong {
      font-style: italic;
      font-weight: 700;
      color: #0f172a;
      margin-right: 3px;
    }

    .coa-modal-close-btn {
      width: 22px;
      height: 22px;
      border: 1px solid #71717a;
      border-radius: 4px;
      background: transparent;
      color: #1e293b;
      font-size: 13px;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      transition: all 0.15s ease;
    }

    .coa-modal-close-btn:hover {
      background: #f1f5f9;
      border-color: #0f172a;
    }

    .coa-modal-dashed-divider {
      border: none;
      border-top: 1px dashed #cbd5e1;
      margin: 0 0 22px 0;
    }

    /* 3-Column Form Grid */
    .coa-form-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      column-gap: 20px;
      row-gap: 16px;
    }

    .coa-form-field {
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .coa-form-label {
      font-family: 'Outfit', sans-serif;
      font-size: 12.5px;
      font-weight: 700;
      color: #0f172a;
      text-align: center;
      margin-bottom: 6px;
      line-height: 1.2;
    }

    .coa-form-label.label-left {
      text-align: left;
    }

    .coa-form-input {
      width: 100%;
      height: 42px;
      padding: 0 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      color: #1e293b;
      text-align: center;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .coa-form-input.input-left {
      text-align: left;
    }

    .coa-form-input:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
    }

    .coa-form-input::placeholder {
      font-style: italic;
      font-weight: 400;
      color: #94a3b8;
      text-align: center;
    }

    .coa-form-input.input-left::placeholder {
      text-align: left;
    }

    .coa-form-input:read-only,
    .coa-form-input:disabled {
      background: #f8fafc;
      color: #334155;
      cursor: default;
    }

    /* Custom Dropdown Trigger & Popover */
    .coa-custom-select-wrap {
      position: relative;
      width: 100%;
    }

    .coa-select-trigger {
      width: 100%;
      height: 42px;
      padding: 0 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      color: #1e293b;
      text-align: center;
      box-sizing: border-box;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      user-select: none;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .coa-select-trigger:focus,
    .coa-select-trigger.is-active {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
      border-bottom-left-radius: 0;
      border-bottom-right-radius: 0;
    }

    .coa-select-trigger .is-placeholder {
      font-style: italic;
      color: #94a3b8;
    }

    .coa-select-popover {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      margin-top: -1px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-top: none;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.08);
      padding: 8px 16px 12px 16px;
      z-index: 100;
      flex-direction: column;
      gap: 8px;
      box-sizing: border-box;
    }

    .coa-select-popover.is-open {
      display: flex;
    }

    .coa-select-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      color: #475569;
      user-select: none;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .coa-select-option:hover {
      color: #0f172a;
      background: #f8fafc;
    }

    .coa-select-option input[type="radio"] {
      appearance: none;
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border: 1.5px solid #94a3b8;
      border-radius: 3px;
      outline: none;
      cursor: pointer;
      display: inline-grid;
      place-content: center;
      margin: 0;
      background: #ffffff;
      transition: all 0.15s ease;
    }

    .coa-select-option input[type="radio"]:checked {
      border-color: #0284c7;
      background-color: #0284c7;
    }

    .coa-select-option input[type="radio"]:checked::before {
      content: "";
      width: 6px;
      height: 6px;
      background: #ffffff;
      border-radius: 1px;
    }

    /* Span 3 Columns for Row 4 (Atas Nama) */
    .coa-field-span-3 {
      grid-column: 1 / -1;
    }

    /* Footer Button Simpan */
    .coa-modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 24px;
    }

    .coa-btn-simpan {
      min-width: 125px;
      height: 40px;
      padding: 0 32px;
      background: #ffffff;
      border: 1.5px solid #38bdf8;
      border-radius: 6px;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 500;
      color: #0f172a;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .coa-btn-simpan:hover {
      background: #f0f9ff;
      border-color: #0284c7;
    }

    .coa-btn-simpan:active {
      transform: scale(0.98);
    }

    /* ===== DESAIN FILTER COA SESUAI REFERENSI GAMBAR ===== */
    .coa-filter-popover {
      position: absolute;
      top: calc(100% + 8px);
      left: 0;
      width: 290px;
      background: #ffffff;
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.12);
      padding: 22px 20px 18px 20px;
      z-index: 120;
      display: none;
      opacity: 0;
      transform: translateY(-6px);
      transition: opacity 0.15s ease, transform 0.15s ease;
      box-sizing: border-box;
    }

    .coa-filter-popover.is-active {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    .coa-filter-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .coa-filter-label {
      display: block;
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: #1e293b;
      margin-bottom: 0;
    }

    .coa-filter-close-btn {
      width: 20px;
      height: 20px;
      padding: 0;
      border: none;
      background: transparent;
      color: #64748b;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
      transition: color 0.15s ease;
    }

    .coa-filter-close-btn:hover {
      background: transparent;
      color: #0f172a;
    }

    .coa-filter-box {
      width: 100%;
      position: relative;
    }

    .coa-filter-input-wrap {
      position: relative;
      width: 100%;
    }

    .coa-filter-input {
      width: 100%;
      height: 40px;
      padding: 0 34px 0 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-size: 13.5px;
      color: #1e293b;
      outline: none;
      box-sizing: border-box;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .coa-filter-input-arrow {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      pointer-events: auto;
      cursor: pointer;
      color: #94a3b8;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease, color 0.15s ease;
    }

    .coa-filter-box.arrow-up .coa-filter-input-arrow,
    .coa-filter-box.is-open .coa-filter-input-arrow {
      transform: translateY(-50%) rotate(180deg);
      color: #28a5de;
    }

    .coa-filter-box.arrow-up .coa-filter-input {
      border: 1.5px solid #28a5de;
      border-radius: 8px;
    }

    .coa-filter-box.is-open .coa-filter-input,
    .coa-filter-input:focus {
      border: 1.5px solid #28a5de;
      border-radius: 8px 8px 0 0;
    }

    .coa-filter-input::placeholder {
      color: #94a3b8;
      font-size: 13px;
      font-weight: 400;
    }

    .coa-filter-list {
      display: none;
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      width: 100%;
      border: 1.5px solid #94a3b8;
      border-top: none;
      border-radius: 0 0 8px 8px;
      background: #ffffff;
      padding: 10px 14px;
      flex-direction: column;
      gap: 7px;
      max-height: 140px;
      overflow-y: auto;
      box-sizing: border-box;
      z-index: 50;
      box-shadow: 0 6px 14px rgba(0, 0, 0, 0.08);
    }

    .coa-filter-box.is-open .coa-filter-list {
      display: flex;
    }

    .coa-filter-item {
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      color: #94a3b8;
      cursor: pointer;
      padding: 3px 0;
      user-select: none;
      transition: color 0.15s ease;
    }

    .coa-filter-item:hover,
    .coa-filter-item.is-selected {
      color: #0284c7;
      font-weight: 700;
    }

    .coa-filter-actions {
      display: flex;
      gap: 12px;
      margin-top: 24px;
      width: 100%;
    }

    .coa-filter-btn-reset {
      flex: 1;
      height: 38px;
      border: 1.5px solid #28a5de;
      background: #f1f5f9;
      color: #0f172a;
      border-radius: 8px;
      font-family: 'Outfit', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
    }

    .coa-filter-btn-reset em {
      font-style: italic;
    }

    .coa-filter-btn-reset:hover {
      background: #e2e8f0;
      border-color: #0284c7;
    }

    .coa-filter-btn-apply {
      flex: 1;
      height: 38px;
      border: none;
      background: #28a5de;
      color: #ffffff;
      border-radius: 8px;
      font-family: 'Outfit', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(40, 165, 222, 0.35);
      transition: all 0.15s ease;
    }

    .coa-filter-btn-apply em {
      font-style: italic;
    }

    .coa-filter-btn-apply:hover {
      background: #0284c7;
    }

    /* ===== SweetAlert2 Custom Styling for Bisa Media ===== */
    .swal2-bisa-popup {
      font-family: 'Outfit', sans-serif !important;
      border-radius: 14px !important;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.16) !important;
      padding: 24px 20px !important;
    }

    .swal2-bisa-popup .swal2-title {
      font-family: 'Outfit', sans-serif !important;
      font-size: 18px !important;
      font-weight: 700 !important;
      color: #1e293b !important;
      margin-top: 10px !important;
    }

    .swal2-bisa-popup .swal2-html-container {
      font-family: 'Outfit', sans-serif !important;
      font-size: 13.5px !important;
      color: #64748b !important;
      line-height: 1.55 !important;
      margin-top: 8px !important;
    }

    .swal2-bisa-popup .swal2-confirm,
    .swal2-bisa-popup .swal2-cancel {
      font-family: 'Outfit', sans-serif !important;
      font-size: 13px !important;

      function sortData() {
        coaData.sort(function (a, b) {
          return String(a.kode || '').localeCompare(String(b.kode || ''), 'id', {
            numeric: true,
            sensitivity: 'base'
          });
        });
      }

      function escapeHtml(value) {
        return String(value == null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function showToast(message, type) {
        const iconType = type || 'success';
        if (typeof Swal !== 'undefined') {
          Swal.fire({
            toast: true,
            position: 'top-end',
            icon: iconType,
            title: message,
            showConfirmButton: false,
            timer: 2800,
            timerProgressBar: true,
            customClass: {
              popup: 'swal2-bisa-popup'
            }
          });
          return;
        }
        if (!toast) return;
        toast.textContent = message;
        toast.classList.add('show');
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(function () {
          toast.classList.remove('show');
        }, 2800);
      }

        if (modal) modal.classList.add('is-active');

        if (modal) modal.classList.remove('is-active');

      function getFilteredData() {
        const query = (searchInput && searchInput.value ? searchInput.value : '').trim().toLowerCase();
        const filterKode = (filters.kode || '').trim().toLowerCase();

        return coaData.filter(function (item) {
          const matchesSearch = !query || [
            item.kode,
            item.nama,
            item.kelompok,
            item.subKelompok,
            item.saldoNormal,
            item.aktif,
            item.devisDefault,
            item.namaBank,
            item.nomorRekening,
            item.atasNama
          ].some(function (value) {
            return String(value || '').toLowerCase().includes(query);
          });

          const matchesKode = !filterKode || String(item.kode || '').toLowerCase().includes(filterKode);

          return matchesSearch && matchesKode;
        });
      }

        if (String(value || '') === 'Tidak') {

      }

      const globalActionMenu = document.getElementById('coaActionMenu');
      let currentActionId = null;
      let currentActionButton = null;

      function closeActionMenus() {
        if (globalActionMenu) {
          globalActionMenu.classList.remove('is-open');
        }
        if (currentActionButton) {
          currentActionButton.setAttribute('aria-expanded', 'false');
          const td = currentActionButton.closest('.col-sticky-action, td');
          if (td) td.style.zIndex = '';
        }
        currentActionId = null;
        currentActionButton = null;
      }

      function openActionMenu(button) {
        if (!globalActionMenu) return;

        const id = button.getAttribute('data-id');
        const isAlreadyOpen = globalActionMenu.classList.contains('is-open') && currentActionId === id;

        closeActionMenus();

        if (isAlreadyOpen) return;

        currentActionId = id;
        currentActionButton = button;
        button.setAttribute('aria-expanded', 'true');

        const td = button.closest('.col-sticky-action, td');
        if (td) td.style.zIndex = '9999';

        globalActionMenu.classList.add('is-open');

        const rect = button.getBoundingClientRect();
        const menuWidth = globalActionMenu.offsetWidth || 150;
        const menuHeight = globalActionMenu.offsetHeight || 135;

        let left = rect.right - menuWidth;
        let top = rect.bottom + 4;

        if (left < 10) left = 10;
        if (left + menuWidth > window.innerWidth - 10) left = window.innerWidth - menuWidth - 10;
        if (top + menuHeight > window.innerHeight - 10) top = Math.max(10, rect.top - menuHeight - 4);

        globalActionMenu.style.left = left + 'px';
        globalActionMenu.style.top = top + 'px';
      }

      if (globalActionMenu) {
        globalActionMenu.addEventListener('click', function (event) {
          const actionButton = event.target.closest('[data-action]');
          if (!actionButton || !currentActionId) return;

          event.preventDefault();
          event.stopPropagation();

          const item = findItem(currentActionId);
          const action = actionButton.getAttribute('data-action');
          closeActionMenus();

          if (!item) return;

          if (action === 'view') openView(item);
          if (action === 'edit') openForm(item);
          if (action === 'delete') askDelete(item);
        });
      }

      function closePopovers() {
        if (popoverSaldoNominal) popoverSaldoNominal.classList.remove('is-open');
        if (btnSaldoNominal) btnSaldoNominal.classList.remove('is-active');
        if (popoverAktif) popoverAktif.classList.remove('is-open');
        if (btnAktif) btnAktif.classList.remove('is-active');
      }

      function setSaldoNominal(val) {
        if (inputSaldoNominal) inputSaldoNominal.value = val || '';
        if (textSaldoNominal) {
          if (val) {
            textSaldoNominal.textContent = val;
            textSaldoNominal.classList.remove('is-placeholder');
          } else {
            textSaldoNominal.textContent = 'Pilih Saldo Nominal';
            textSaldoNominal.classList.add('is-placeholder');
          }
        }
        document.querySelectorAll('input[name="optSaldoNominal"]').forEach(function (radio) {
          radio.checked = (radio.value === val);
        });
        if (popoverSaldoNominal) popoverSaldoNominal.classList.remove('is-open');
        if (btnSaldoNominal) btnSaldoNominal.classList.remove('is-active');
      }

      function setAktif(val) {
        if (inputAktif) inputAktif.value = val || '';
        if (textAktif) {
          if (val) {
            textAktif.textContent = val;
            textAktif.classList.remove('is-placeholder');
          } else {
            textAktif.textContent = 'Pilih Aktif';
            textAktif.classList.add('is-placeholder');
          }
        }
        document.querySelectorAll('input[name="optAktif"]').forEach(function (radio) {
          radio.checked = (radio.value === val);
        });
        if (popoverAktif) popoverAktif.classList.remove('is-open');
        if (btnAktif) btnAktif.classList.remove('is-active');
      }

      if (btnSaldoNominal && popoverSaldoNominal) {
        btnSaldoNominal.addEventListener('click', function (e) {
          e.preventDefault();
          e.stopPropagation();
          const isOpen = popoverSaldoNominal.classList.contains('is-open');
          closePopovers();
          if (!isOpen) {
            popoverSaldoNominal.classList.add('is-open');
            btnSaldoNominal.classList.add('is-active');
          }
        });
      }

      document.querySelectorAll('input[name="optSaldoNominal"]').forEach(function (radio) {
        radio.addEventListener('change', function () {
          setSaldoNominal(this.value);
        });
      });

      if (btnAktif && popoverAktif) {
        btnAktif.addEventListener('click', function (e) {

      function askDelete(item) {
        if (typeof Swal !== 'undefined') {
          Swal.fire({
            title: 'Hapus Master COA?',
            html: 'Apakah Anda yakin ingin menghapus <strong>"' + escapeHtml(item.kode || '-') + ' - ' + escapeHtml(item.nama || '-') + '"</strong>?<br><span style="font-size: 12.5px; color: #94a3b8;">Data yang dihapus tidak dapat dikembalikan.</span>',

            confirmButtonColor: '#ef4444',
            cancelButtonColor: '#94a3b8',
            confirmButtonText: 'Ya, Hapus',
            cancelButtonText: 'Batal',
            reverseButtons: true,
            focusCancel: true,
            customClass: {
              popup: 'swal2-bisa-popup'
            }
          }).then(function (result) {
            if (result.isConfirmed) {
              coaData = coaData.filter(function (d) {
                return String(d.id) !== String(item.id);
              });
              saveData();
              renderTable();
              showToast('Data COA berhasil dihapus', 'success');
            }
          });
        } else {
          pendingDeleteId = item.id;
          const name = document.getElementById('coaDeleteName');
          if (name) name.textContent = (item.kode || '-') + ' - ' + (item.nama || '-');
          openModal(deleteModal);

        return coaData.find(function (item) {

        });
      }

      if (tableBody) {
        tableBody.addEventListener('click', function (event) {
          const toggle = event.target.closest('[data-action-toggle]');
          if (toggle) {
            event.preventDefault();
            event.stopPropagation();
            openActionMenu(toggle);
          }
        });
      }

      if (form) {
        form.addEventListener('submit', function (event) {
          event.preventDefault();

          const editId = document.getElementById('coaEditId').value;
          const payload = {
            kode: document.getElementById('coaKode').value.trim(),
            nama: document.getElementById('coaNama').value.trim(),
            kelompok: document.getElementById('coaKelompok').value.trim(),
            subKelompok: document.getElementById('coaSubKelompok').value.trim(),
            saldoNormal: document.getElementById('coaSaldoNormal').value,
            aktif: document.getElementById('coaAktif').value,
            devisDefault: document.getElementById('coaDevisDefault').value.trim(),
            namaBank: document.getElementById('coaNamaBank').value.trim(),
            nomorRekening: document.getElementById('coaNomorRekening').value.trim(),
            atasNama: document.getElementById('coaAtasNama').value.trim()
          };

          if (!payload.kode || !payload.nama || !payload.kelompok || !payload.saldoNormal || !payload.aktif) {
            if (typeof Swal !== 'undefined') {
              Swal.fire({
                icon: 'warning',
                title: 'Lengkapi Field Wajib',
                text: 'Field Kode COA, Master Akun, Kelompok, Saldo Nominal, dan Aktif harus diisi.',
                confirmButtonColor: '#28a5de',
                customClass: { popup: 'swal2-bisa-popup' }
              });
            } else {
              showToast('Lengkapi field wajib terlebih dahulu', 'warning');
            }
            return;
          }

          const duplicateCode = coaData.find(function (item) {
            return String(item.id) !== String(editId) &&
              String(item.kode || '').toLowerCase() === payload.kode.toLowerCase();
          });

          if (duplicateCode) {
            if (typeof Swal !== 'undefined') {
              Swal.fire({
                icon: 'error',
                title: 'Kode COA Duplikat',
                text: 'Kode COA "' + payload.kode + '" sudah digunakan pada akun "' + (duplicateCode.nama || '') + '".',
                confirmButtonColor: '#28a5de',
                customClass: { popup: 'swal2-bisa-popup' }
              });
            } else {
              showToast('Kode COA sudah digunakan', 'error');
            }
            return;
          }

          if (editId) {
            const index = coaData.findIndex(function (item) {
              return String(item.id) === String(editId);
            });

            if (index !== -1) {
              coaData[index] = Object.assign({}, coaData[index], payload);
              showToast('Data COA berhasil diperbarui');
            }
          } else {
            coaData.unshift(Object.assign({
              id: 'coa-' + Date.now()
            }, payload));
            showToast('Data COA berhasil ditambahkan');
          }

          saveData();
          renderTable();
          closeModal(formModal);
        });
      }

      const confirmDelete = document.getElementById('confirmDeleteCoa');
      if (confirmDelete) {
        confirmDelete.addEventListener('click', function () {
          if (!pendingDeleteId) return;

          coaData = coaData.filter(function (item) {
            return String(item.id) !== String(pendingDeleteId);
          });

          pendingDeleteId = null;
          saveData();
          renderTable();
          closeModal(deleteModal);
          showToast('Data COA berhasil dihapus');
        });
      }

      const btnTambah = document.getElementById('btnTambahCoa');
      if (btnTambah) {
        btnTambah.addEventListener('click', function () {
          openForm(null);
        });
      }

      if (searchInput) {
        searchInput.addEventListener('input', function () {
          renderTable();
        });
      }

      const filterBox = document.getElementById('coaFilterBox');

      function getFilterCodes() {
        const list = ['Kode COA 1', 'Kode COA 2', 'Kode COA 3'];
        coaData.forEach(function (item) {
          if (item.kode && !list.includes(String(item.kode).trim())) {
            list.push(String(item.kode).trim());
          }
        });
        return list;
      }

      function updateArrowState() {
        if (!filterBox) return;
        if (filterKodeInput && filterKodeInput.value.trim() !== '') {
          filterBox.classList.add('arrow-up');
        } else {
          filterBox.classList.remove('arrow-up');
        }
      }

      function openFilterDropdownList(isTyping) {
        if (filterBox) {
          filterBox.classList.add('is-open');
          renderFilterList(filterKodeInput ? filterKodeInput.value : '', isTyping);
        }
      }

      function closeFilterDropdownList() {
        if (filterBox) {
          filterBox.classList.remove('is-open');
          updateArrowState();
        }
      }

      function renderFilterList(searchQuery, isTyping) {
        if (!filterKodeList) return;
        const q = (searchQuery || '').toLowerCase().trim();
        const allCodes = getFilterCodes();
        
        let filteredCodes = allCodes;
        if (isTyping && q) {
          filteredCodes = allCodes.filter(function (code) {
            return code.toLowerCase().includes(q);
          });
        }

        filterKodeList.innerHTML = '';
        if (filteredCodes.length === 0) {
          filterKodeList.innerHTML = '<div class="coa-filter-item" style="color: #94a3b8; font-style: italic; cursor: default;">Tidak ditemukan</div>';
          return;
        }

        filteredCodes.forEach(function (code) {
          const itemDiv = document.createElement('div');
          const isSelected = filterKodeInput && filterKodeInput.value.trim().toLowerCase() === code.toLowerCase();
          itemDiv.className = 'coa-filter-item' + (isSelected ? ' is-selected' : '');
          itemDiv.textContent = code;
          itemDiv.setAttribute('data-code', code);
          itemDiv.addEventListener('click', function (e) {
            e.stopPropagation();
            if (filterKodeInput) {
              filterKodeInput.value = code;
            }
            if (filterBox) {
              filterBox.classList.add('arrow-up');
              filterBox.classList.remove('is-open');
            }
          });
          filterKodeList.appendChild(itemDiv);
        });
      }

      if (filterKodeInput) {
        filterKodeInput.addEventListener('click', function (e) {
          e.stopPropagation();
          const isOpen = filterBox && filterBox.classList.contains('is-open');
          if (isOpen) {
            closeFilterDropdownList();
          } else {
            openFilterDropdownList(false);
          }
        });
        filterKodeInput.addEventListener('input', function () {
          openFilterDropdownList(true);
          updateArrowState();
        });
      }

      const filterArrow = document.querySelector('.coa-filter-input-arrow');
      if (filterArrow) {
        filterArrow.addEventListener('click', function (e) {
          e.stopPropagation();
          if (filterBox) {
            const isOpen = filterBox.classList.contains('is-open');
            if (isOpen) {
              closeFilterDropdownList();
            } else {
              openFilterDropdownList(false);
              if (filterKodeInput) filterKodeInput.focus();
            }
          }
        });
      }

      const btnFilter = document.getElementById('btnFilterCoa');
      if (btnFilter && filterDropdown) {
        btnFilter.addEventListener('click', function (event) {
          event.preventDefault();
          event.stopPropagation();
          const willOpen = !filterDropdown.classList.contains('is-active');
          filterDropdown.classList.toggle('is-active');
          if (willOpen) {
            openFilterDropdownList(false);
            if (filterKodeInput && filterKodeInput.value) {
              filterKodeInput.focus();
            }
          }
        });
      }

      const btnCloseFilter = document.getElementById('btnCloseFilterCoa');
      if (btnCloseFilter) {
        btnCloseFilter.addEventListener('click', function (event) {
          event.preventDefault();
          event.stopPropagation();
          closeFilter();
        });
      }

      const applyFilter = document.getElementById('applyFilterCoa');
      if (applyFilter) {
        applyFilter.addEventListener('click', function () {
          filters.kode = filterKodeInput ? filterKodeInput.value.trim() : '';
          renderTable();
          closeFilter();
        });
      }

      const resetFilter = document.getElementById('resetFilterCoa');
      if (resetFilter) {
        resetFilter.addEventListener('click', function () {
          if (filterKodeInput) filterKodeInput.value = '';
          filters.kode = '';
          if (filterBox) {
            filterBox.classList.remove('arrow-up');
            filterBox.classList.remove('is-open');
          }
          renderFilterList('', false);
          renderTable();
          closeFilter();
        });
      }

      document.querySelectorAll('[data-close-modal]').forEach(function (button) {
        button.addEventListener('click', function () {
          closeModal(document.getElementById(button.getAttribute('data-close-modal')));
        });
      });

      document.querySelectorAll('.modal-overlay').forEach(function (overlay) {
        overlay.addEventListener('click', function (event) {
          if (event.target === overlay) overlay.classList.remove('is-active');
        });
      });

      document.addEventListener('click', function (event) {
        if (!event.target.closest('.filter-dropdown-wrapper')) {
          closeFilter();
        }
        if (!event.target.closest('#coaActionMenu') && !event.target.closest('[data-action-toggle]')) {
          closeActionMenus();
        }
        if (!event.target.closest('#wrapSaldoNominal') && !event.target.closest('#wrapAktif')) {
          closePopovers();
        }
      });

      window.addEventListener('scroll', closeActionMenus, true);
      window.addEventListener('resize', closeActionMenus);

      document.addEventListener('keydown', function (event) {
        if (event.key !== 'Escape') return;
        closeActionMenus();
        closeFilter();
        closePopovers();
        document.querySelectorAll('.modal-overlay.is-active').forEach(function (overlay) {
          overlay.classList.remove('is-active');
        });
      });

      /* ===== LOGIKA PIN / FIXED KOLOM (PERSIS SEPERTI MODUL KOL) ===== */
      const PINNED_STORAGE_KEY = 'bisa_master_coa_pinned_cols';

      function getSavedPinnedCols() {
        try {
          return JSON.parse(localStorage.getItem(PINNED_STORAGE_KEY)) || {
            kode_coa: true,
            nama_akun: true
          };
        } catch (e) {
          return { kode_coa: true, nama_akun: true };
        }
      }

      function savePinnedCols(obj) {
        try {
          localStorage.setItem(PINNED_STORAGE_KEY, JSON.stringify(obj));
        } catch (e) {}
      }

      function updatePinnedColumns() {
        const table = document.getElementById('coaTable');
        if (!table) return;

        const firstCol = table.querySelector('th:first-child');
        let currentLeft = firstCol ? firstCol.offsetWidth : 48;

        const pinnableThs = Array.from(table.querySelectorAll('th.th-pinnable'));
        let lastPinnedTh = null;

        pinnableThs.forEach(th => {
          const colName = th.getAttribute('data-col');
          const chk = th.querySelector('.chk-pin-col');
          const isPinned = chk && chk.checked;
          const bodyTds = table.querySelectorAll(`tbody td[data-col="${colName}"]`);

          if (isPinned) {
            th.classList.add('col-pinned-sticky');
            th.classList.remove('col-pinned-last');
            th.style.left = currentLeft + 'px';

            bodyTds.forEach(td => {
              td.classList.add('col-pinned-sticky');
              td.classList.remove('col-pinned-last');
              td.style.left = currentLeft + 'px';
            });

            currentLeft += th.offsetWidth;
            lastPinnedTh = { th, bodyTds };
          } else {
            th.classList.remove('col-pinned-sticky', 'col-pinned-last');
            th.style.left = '';
            bodyTds.forEach(td => {
              td.classList.remove('col-pinned-sticky', 'col-pinned-last');
              td.style.left = '';
            });
          }
        });

        if (lastPinnedTh) {
          lastPinnedTh.th.classList.add('col-pinned-last');
          lastPinnedTh.bodyTds.forEach(td => td.classList.add('col-pinned-last'));
        }
      }

      function initPinnedColumns() {
        const saved = getSavedPinnedCols();
        document.querySelectorAll('.chk-pin-col').forEach(chk => {
          const col = chk.getAttribute('data-col');
          if (saved && saved[col] !== undefined) {
            chk.checked = !!saved[col];
          }
          chk.addEventListener('change', () => {
            const cur = getSavedPinnedCols();
            cur[col] = chk.checked;
            savePinnedCols(cur);
            updatePinnedColumns();
          });
        });

        window.addEventListener('resize', updatePinnedColumns);
      }

      initPinnedColumns();
      sortData();
      renderTable();
    })();
  </script>
</body>

</html>
