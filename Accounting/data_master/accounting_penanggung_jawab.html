<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Penanggung Jawab | Bisa Media</title>
  <link rel="stylesheet" href="../../assets/css/style.css?v=20261031" />
  <link rel="icon" type="image/png" href="../../media/logo.png" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    #pjTable {
      width: 100%;
      min-width: 650px;
      border-collapse: separate;
      border-spacing: 0;
    }

    #pjTable th,
    #pjTable td {
      vertical-align: middle;
      padding: 14px 18px;
    }

    #pjTable th:nth-child(1),
    #pjTable td:nth-child(1) {
      width: 55px;
      text-align: center;
    }

    #pjTable th:nth-child(2),
    #pjTable td:nth-child(2) {
      min-width: 240px;
    }

    #pjTable th:nth-child(3),
    #pjTable td:nth-child(3) {
      min-width: 220px;
    }

    #pjTable th:nth-child(4),
    #pjTable td:nth-child(4) {
      width: 80px;
      text-align: center;
    }

    #pjTable thead th {
      background: #f4f4f5;
      color: #0f172a;
      font-family: 'Outfit', sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      text-transform: none;
      letter-spacing: 0;
      border-top: 1px solid #e4e4e7;
      border-bottom: 1px solid #e4e4e7;
    }

    #pjTable thead th:first-child {
      border-top-left-radius: 8px;
      border-bottom-left-radius: 8px;
      border-left: 1px solid #e4e4e7;
    }

    #pjTable thead th:last-child {
      border-top-right-radius: 8px;
      border-bottom-right-radius: 8px;
      border-right: 1px solid #e4e4e7;
    }

    #pjTable tbody tr {
      border-bottom: 1px solid #f1f5f9;
      transition: background 0.15s ease;
    }

    #pjTable tbody tr:hover {
      background: #f8fafc;
    }

    #pjTable tbody td {
      border-bottom: 1px solid #f1f5f9;
    }

    .pj-panel-line {
      display: block;
      height: 4px;
      margin: -20px -20px 16px;
      border-radius: 16px 16px 0 0;
      background: var(--blue-800, #1e5a96);
    }

    /* ===== Toolbar Penanggung Jawab ===== */
    .pj-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 14px;
      flex-wrap: wrap;
    }

    .pj-toolbar__left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .pj-search-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      width: 240px;
    }

    .pj-search-wrap svg {
      position: absolute;
      left: 10px;
      width: 15px;
      height: 15px;
      color: #64748b;
      pointer-events: none;
    }

    .pj-search-wrap input {
      width: 100%;
      height: 36px;
      padding: 0 12px 0 34px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      color: #1e293b;
      outline: none;
      box-sizing: border-box;
      transition: all 0.15s ease;
    }

    .pj-search-wrap input:focus {
      border-color: #0076C5;
      box-shadow: 0 0 0 3px rgba(0, 118, 197, 0.12);
    }

    .pj-search-wrap input::placeholder {
      color: #94a3b8;
      font-size: 13px;
    }

    .btn-tambah-pj {
      height: 36px;
      padding: 0 18px;
      border: none;
      border-radius: 6px;
      background: #28a5de;
      color: #ffffff;
      font-family: 'Outfit', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 2px 4px rgba(40, 165, 222, 0.25);
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .btn-tambah-pj:hover {
      background: #0284c7;
    }

    .btn-tambah-pj:active {
      transform: scale(0.98);
    }

    .pj-dashed-divider {
      border: none;
      border-top: 1px dashed #d4d4d8;
      margin: 0 0 16px 0;
    }

    /* Badge Divisi */
    .pj-divisi-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      background: #f1f5f9;
      color: #334155;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 500;
      border: 1px solid #e2e8f0;
    }

    .pj-divisi-dot {
      display: none;
    }

    /* Action button in table */
    .pj-action-btn {
      width: 32px;
      height: 32px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #0f172a;
      background: transparent;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .pj-action-btn:hover {
      background: #f1f5f9;
    }

    .pj-action-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* Floating Action Menu */
    .pj-action-menu {
      display: none;
      position: fixed;
      z-index: 2147483000;
      min-width: 145px;
      padding: 6px;
      border: 1px solid rgba(0, 0, 0, .08);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 4px 20px rgba(0, 0, 0, .14);
    }

    .pj-action-menu.is-open {
      display: block;
    }

    .pj-action-menu button {
      width: 100%;
      min-height: 38px;
      padding: 7px 12px;
      border: 0;
      border-radius: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #334155;
      background: transparent;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 500;
      text-align: left;
      white-space: nowrap;
      cursor: pointer;
    }

    .pj-action-menu button:hover {
      color: #0f172a;
      background: #f1f5f9;
    }

    .pj-action-icon {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 26px;
      color: #fff;
      background: #0076C5;
    }

    .pj-action-icon svg {
      width: 15px;
      height: 15px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .pj-action-menu button.is-danger {
      color: #dc2626;
    }

    .pj-action-menu button.is-danger:hover {
      background: #fef2f2;
    }

    .pj-action-menu .pj-action-icon.is-danger {
      background: #e02424;
    }

    .pj-empty-cell {
      padding: 40px 24px !important;
      color: #94a3b8 !important;
      text-align: center !important;
      font-style: italic;
    }

    /* ===== MODAL PENANGGUNG JAWAB ===== */
    .pj-modal-box {
      position: relative;
      width: 580px;
      max-width: 95%;
      background: #ffffff;
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
      padding: 26px 30px 24px;
      box-sizing: border-box;
    }

    .pj-modal-accent-line {
      position: absolute;
      top: 14px;
      left: 24px;
      right: 24px;
      height: 3px;
      background: #2563eb;
      border-radius: 2px;
    }

    .pj-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      margin-bottom: 12px;
    }

    .pj-modal-title {
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      font-weight: 500;
      color: #475569;
      margin: 0;
    }

    .pj-modal-title em,
    .pj-modal-title strong {
      font-style: italic;
      font-weight: 700;
      color: #0f172a;
      margin-right: 3px;
    }

    .pj-modal-close-btn {
      width: 22px;
      height: 22px;
      border: 1px solid #71717a;
      border-radius: 4px;
      background: transparent;
      color: #1e293b;
      font-size: 13px;
      font-family: inherit;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      padding: 0;
      line-height: 1;
      transition: all 0.15s ease;
    }

    .pj-modal-close-btn:hover {
      background: #f1f5f9;
      border-color: #0f172a;
    }

    .pj-modal-dashed-divider {
      border: none;
      border-top: 1px dashed #cbd5e1;
      margin: 0 0 20px 0;
    }

    .pj-form-grid {
      display: grid;
      grid-template-columns: 1fr;
      row-gap: 16px;
    }

    .pj-form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .pj-form-label {
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: #0f172a;
      margin-left: 2px;
    }

    .pj-form-input {
      width: 100%;
      height: 42px;
      padding: 0 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      font-family: 'Outfit', sans-serif;
      font-size: 13.5px;
      color: #1e293b;
      box-sizing: border-box;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .pj-form-input:focus {
      border-color: #0076C5;
      box-shadow: 0 0 0 3px rgba(0, 118, 197, 0.12);
    }

    .pj-form-input::placeholder {
      font-style: italic;
      font-weight: 400;
      color: #94a3b8;
    }

    .pj-form-input:read-only {
      background: #f8fafc;
      color: #334155;
      cursor: default;
    }

    .pj-modal-footer {
      display: flex;
      justify-content: flex-end;
      margin-top: 22px;
      gap: 10px;
    }

    .pj-btn-simpan {
      height: 38px;
      padding: 0 34px;
      border: 1.5px solid #38bdf8;
      border-radius: 6px;
      background: #ffffff;
      color: #0f172a;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .pj-btn-simpan:hover {
      background: #f0f9ff;
      border-color: #0284c7;
      color: #0284c7;
    }

    .pj-btn-simpan:active {
      transform: scale(0.98);
    }

    .pj-btn-tutup {
      height: 38px;
      padding: 0 24px;
      border: 1.5px solid #94a3b8;
      border-radius: 6px;
      background: #ffffff;
      color: #475569;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .pj-btn-tutup:hover {
      background: #f1f5f9;
      color: #0f172a;
    }

    .pj-btn-tutup:active {
      transform: scale(0.98);
    }

    /* ===== SweetAlert2 Custom Styling for Bisa Media ===== */
    .swal2-bisa-popup {
      font-family: 'Outfit', sans-serif !important;
      border-radius: 14px !important;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.16) !important;
      padding: 24px 20px !important;
    }

    .swal2-bisa-popup .swal2-title {
      font-family: 'Outfit', sans-serif !important;
      font-size: 18px !important;
      font-weight: 700 !important;
      color: #1e293b !important;
      margin-top: 10px !important;
    }

    .swal2-bisa-popup .swal2-html-container {
      font-family: 'Outfit', sans-serif !important;
      font-size: 13.5px !important;
      color: #64748b !important;
      line-height: 1.55 !important;
      margin-top: 8px !important;
    }

    .swal2-bisa-popup .swal2-confirm,
    .swal2-bisa-popup .swal2-cancel {
      font-family: 'Outfit', sans-serif !important;
      font-size: 13px !important;
      font-weight: 600 !important;
      border-radius: 8px !important;
      padding: 9px 22px !important;
      box-shadow: none !important;
      transition: all 0.15s ease !important;
    }

    .swal2-container {
      z-index: 9999999 !important;
    }
  </style>
</head>

<body class="dashboard-body">
  <aside id="app-sidebar"></aside>

  <div class="dashboard-shell">
    <header class="topbar"></header>

    <main class="dashboard-content">
      <div class="dashboard-heading">
        <h1>Penanggung Jawab</h1>
      </div>

      <section class="panel campaign-panel">
        <div class="campaign-panel__line pj-panel-line"></div>

        <div class="pj-toolbar">
          <div class="pj-toolbar__left">
            <div class="pj-search-wrap">
              <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input id="pjSearch" type="search" placeholder="Cari Nama PIC / Divisi..." autocomplete="off" />

            </thead>

          </table>
        </div>
      </section>
    </main>
  </div>

  <!-- ===== MODAL TAMBAH / EDIT PENANGGUNG JAWAB ===== -->
  <div id="pjFormModal" class="modal-overlay">

      <div class="pj-modal-accent-line"></div>

      <div class="pj-modal-header">

          <em><span id="pjFormActionText">Tambah</span></em> Penanggung Jawab
        </h2>
        <button class="pj-modal-close-btn" type="button" data-close-modal="pjFormModal" aria-label="Tutup">x</button>

              <option value="Marketing & Brand"></option>

          <em>Lihat</em> Penanggung Jawab

  <!-- Global Action Menu (Fixed di luar tabel) -->
  <div id="pjActionMenu" class="pj-action-menu" role="menu">
    <button type="button" data-action="view">
      <span class="pj-action-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>

        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"></path></svg>

      <span class="pj-action-icon is-danger">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14H6L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg>
      </span>
      <span>Hapus</span>
    </button>
  </div>

  <script src="../../assets/js/layout.js?v=20261106_operasional_id"></script>
  <script>
    (function () {
      'use strict';

      const STORAGE_KEY = 'accounting_master_penanggung_jawab_v1';

      const tableBody = document.getElementById('pjTableBody');
      const searchInput = document.getElementById('pjSearch');
      const formModal = document.getElementById('pjFormModal');
      const viewModal = document.getElementById('pjViewModal');
      const form = document.getElementById('pjForm');
      const actionMenu = document.getElementById('pjActionMenu');
      const btnTambah = document.getElementById('btnTambahPJ');

      let pjData = loadData();
      let currentActionId = null;

      function loadData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          const parsed = raw ? JSON.parse(raw) : [];
          if (Array.isArray(parsed) && parsed.length > 0) {
            return parsed.filter(Boolean);
          }
          // Default initial seed data for Penanggung Jawab
          const seedData = [
            {
              id: 'pj-1',
              nama: 'Ahmad Fauzi',
              divisi: 'MCN'
            },
            {
              id: 'pj-2',
              nama: 'Siti Nurhaliza',
              divisi: 'Finance & Accounting'
            },
            {
              id: 'pj-3',
              nama: 'Budi Santoso',
              divisi: 'Operasional'
            },
            {
              id: 'pj-4',
              nama: 'Rian Pratama',
              divisi: 'Marketing & Brand'
            },
            {
              id: 'pj-5',
              nama: 'Dewi Lestari',
              divisi: 'Creative & Design'
            },
            {
              id: 'pj-6',
              nama: 'Dimas Setiawan',
              divisi: 'General Affair'
            }
          ];
          localStorage.setItem(STORAGE_KEY, JSON.stringify(seedData));
          return seedData;
        } catch (error) {
          return [];
        }
      }

      function saveData() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(pjData));
        } catch (error) {
          showToast('Gagal menyimpan data Penanggung Jawab', 'error');
        }
      }

      function escapeHtml(value) {
        return String(value || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function showToast(message, type) {
        const iconType = type || 'success';
        if (typeof Swal !== 'undefined') {
          Swal.fire({
            toast: true,
            position: 'top-end',
            icon: iconType,
            title: message,
            showConfirmButton: false,
            timer: 2600,
            timerProgressBar: true,
            customClass: {
              popup: 'swal2-bisa-popup'
            }
          });
        }
      }

      function openModal(modal) {
        if (modal) modal.classList.add('is-active');
      }

      function closeModal(modal) {
        if (modal) modal.classList.remove('is-active');
      }

      function getFilteredData() {
        const query = (searchInput && searchInput.value ? searchInput.value : '').trim().toLowerCase();
        if (!query) return pjData;

        return pjData.filter(function (item) {
          return [
            item.nama,
            item.divisi
          ].some(function (value) {
            return String(value || '').toLowerCase().includes(query);
          });
        });
      }

      function renderTable() {
        if (!tableBody) return;
        tableBody.innerHTML = '';

        const filtered = getFilteredData();
        if (filtered.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="4" class="pj-empty-cell">Tidak ada data Penanggung Jawab yang sesuai.</td></tr>';
          return;
        }

        filtered.forEach(function (item, index) {
          const row = document.createElement('tr');
          row.innerHTML = [
            '<td style="text-align: center; color: #64748b; font-weight: 500;">' + (index + 1) + '</td>',
            '<td style="font-weight: 600; color: #0f172a; white-space: nowrap;">' + escapeHtml(item.nama || '-') + '</td>',
            '<td><span class="pj-divisi-badge">' + escapeHtml(item.divisi || '-') + '</span></td>',
            '<td style="text-align: center;">' +
              '<button type="button" class="pj-action-btn" data-action-toggle="' + escapeHtml(item.id) + '" aria-label="Menu Aksi" title="Opsi">' +
                '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="12" cy="19" r="2"></circle></svg>' +
              '</button>' +
            '</td>'
          ].join('');
          tableBody.appendChild(row);
        });
      }

      function closeActionMenus() {
        if (actionMenu) {
          actionMenu.classList.remove('is-open');
        }
        currentActionId = null;
      }

      function openActionMenu(button) {
        if (!actionMenu || !button) return;
        const id = button.getAttribute('data-action-toggle');

        if (actionMenu.classList.contains('is-open') && currentActionId === id) {
          closeActionMenus();
          return;
        }

        currentActionId = id;
        const rect = button.getBoundingClientRect();
        const menuWidth = 150;
        let left = rect.right - menuWidth;
        if (left < 10) left = 10;

        actionMenu.style.top = (rect.bottom + 4) + 'px';
        actionMenu.style.left = left + 'px';
        actionMenu.classList.add('is-open');
      }

      function openCreateModal() {
        form.reset();
        document.getElementById('pjEditId').value = '';
        document.getElementById('pjFormActionText').textContent = 'Tambah';
        openModal(formModal);
        setTimeout(function () {
          const inputNama = document.getElementById('pjNama');
          if (inputNama) inputNama.focus();
        }, 50);
      }

      function openEditModal(item) {
        if (!item) return;
        document.getElementById('pjEditId').value = item.id;
        document.getElementById('pjNama').value = item.nama || '';
        document.getElementById('pjDivisi').value = item.divisi || '';
        document.getElementById('pjFormActionText').textContent = 'Edit';
        openModal(formModal);
        setTimeout(function () {
          const inputNama = document.getElementById('pjNama');
          if (inputNama) inputNama.focus();
        }, 50);
      }

      function openViewModal(item) {
        if (!item) return;
        document.getElementById('viewPjNama').value = item.nama || '-';
        document.getElementById('viewPjDivisi').value = item.divisi || '-';
        openModal(viewModal);
      }

      function handleDelete(item) {
        if (!item) return;
        if (typeof Swal !== 'undefined') {
          Swal.fire({
            title: 'Hapus Penanggung Jawab?',
            text: 'Data "' + item.nama + '" (' + item.divisi + ') akan dihapus secara permanen.',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#dc2626',
            cancelButtonColor: '#64748b',
            confirmButtonText: 'Ya, Hapus!',
            cancelButtonText: 'Batal',
            customClass: {
              popup: 'swal2-bisa-popup'
            }
          }).then(function (result) {
            if (result.isConfirmed) {
              pjData = pjData.filter(function (x) { return x.id !== item.id; });
              saveData();
              renderTable();
              showToast('Data Penanggung Jawab berhasil dihapus');
            }
          });
        } else if (confirm('Apakah Anda yakin ingin menghapus data "' + item.nama + '"?')) {
          pjData = pjData.filter(function (x) { return x.id !== item.id; });
          saveData();
          renderTable();
          showToast('Data Penanggung Jawab berhasil dihapus');
        }
      }

      // Event Listeners
      if (btnTambah) {
        btnTambah.addEventListener('click', openCreateModal);
      }

      if (searchInput) {
        searchInput.addEventListener('input', renderTable);
      }

      if (form) {
        form.addEventListener('submit', function (event) {
          event.preventDefault();

          const editId = document.getElementById('pjEditId').value.trim();
          const nama = document.getElementById('pjNama').value.trim();
          const divisi = document.getElementById('pjDivisi').value.trim();

          if (!nama || !divisi) {
            showToast('Mohon lengkapi Nama dan Divisi', 'warning');
            return;
          }

          if (editId) {
            const index = pjData.findIndex(function (x) { return x.id === editId; });
            if (index !== -1) {
              pjData[index] = {
                id: editId,
                nama: nama,
                divisi: divisi
              };
              saveData();
              renderTable();
              closeModal(formModal);
              showToast('Data Penanggung Jawab berhasil diperbarui');
            }
          } else {
            const newItem = {
              id: 'pj-' + Date.now(),
              nama: nama,
              divisi: divisi
            };
            pjData.unshift(newItem);
            saveData();
            renderTable();
            closeModal(formModal);
            showToast('Penanggung Jawab baru berhasil ditambahkan');
          }
        });
      }

      // Action menu click delegation
      if (actionMenu) {
        actionMenu.addEventListener('click', function (event) {
          const btn = event.target.closest('button[data-action]');
          if (!btn) return;

          const action = btn.getAttribute('data-action');
          const target = pjData.find(function (x) { return x.id === currentActionId; });

          closeActionMenus();
          if (!target) return;

          if (action === 'view') {
            openViewModal(target);
          } else if (action === 'edit') {
            openEditModal(target);
          } else if (action === 'delete') {
            handleDelete(target);
          }
        });
      }

      // Table toggle delegation
      if (tableBody) {
        tableBody.addEventListener('click', function (event) {
          const toggle = event.target.closest('[data-action-toggle]');
          if (toggle) {
            event.preventDefault();
            event.stopPropagation();
            openActionMenu(toggle);
          }
        });
      }

      // Close modals by close button
      document.querySelectorAll('[data-close-modal]').forEach(function (button) {
        button.addEventListener('click', function () {
          const modalId = button.getAttribute('data-close-modal');
          const modal = document.getElementById(modalId);
          closeModal(modal);
        });
      });

      // Close modal by clicking overlay
      document.querySelectorAll('.modal-overlay').forEach(function (overlay) {
        overlay.addEventListener('click', function (event) {
          if (event.target === overlay) {
            closeModal(overlay);
          }
        });
      });

      // Window click to close action menu
      window.addEventListener('click', function (event) {
        if (!event.target.closest('#pjActionMenu') && !event.target.closest('[data-action-toggle]')) {
          closeActionMenus();
        }
      });

      // Window scroll/resize to close action menu
      window.addEventListener('scroll', closeActionMenus, true);
      window.addEventListener('resize', closeActionMenus);

      // Escape key
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
          closeActionMenus();
          document.querySelectorAll('.modal-overlay.is-active').forEach(closeModal);
        }
      });

      // Initial render
      renderTable();
    })();
  </script>
</body>

</html>
