<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customer | Project | Bisa Media</title>
  <link rel="stylesheet" href="../../assets/css/style.css?v=20261110_cp_v1" />
  <link rel="icon" type="image/png" href="../../media/logo.png" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    #customerProjectTable {
      width: 100%;
      min-width: 650px;
      border-collapse: separate;
      border-spacing: 0;
    }

    #customerProjectTable th,
    #customerProjectTable td {
      vertical-align: middle;
      padding: 14px 18px;
    }

    #customerProjectTable th:nth-child(1),
    #customerProjectTable td:nth-child(1) {
      width: 55px;
      text-align: center;
    }

    #customerProjectTable th:nth-child(2),
    #customerProjectTable td:nth-child(2) {
      min-width: 250px;
    }

    #customerProjectTable th:nth-child(3),
    #customerProjectTable td:nth-child(3) {
      min-width: 250px;
    }

    #customerProjectTable th:nth-child(4),
    #customerProjectTable td:nth-child(4) {
      width: 70px;
      text-align: center;
    }

    #customerProjectTable thead th {
      background: #f4f4f5;
      color: #0f172a;
      font-family: 'Outfit', sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      text-transform: none;
      letter-spacing: 0;
      border-top: 1px solid #e4e4e7;
      border-bottom: 1px solid #e4e4e7;
    }

    #customerProjectTable thead th:first-child {
      border-top-left-radius: 8px;
      border-bottom-left-radius: 8px;
      border-left: 1px solid #e4e4e7;
    }

    #customerProjectTable thead th:last-child {
      border-top-right-radius: 8px;
      border-bottom-right-radius: 8px;
      border-right: 1px solid #e4e4e7;
    }

    #customerProjectTable tbody tr {
      border-bottom: 1px solid #f1f5f9;
      transition: background 0.15s ease;
    }

    #customerProjectTable tbody tr:hover {
      background: #f8fafc;
    }

    #customerProjectTable tbody td {
      border-bottom: 1px solid #f1f5f9;
    }

    .cp-panel-line {
      display: block;
      height: 4px;
      margin: -20px -20px 16px;
      border-radius: 16px 16px 0 0;
      background: var(--blue-800, #1e5a96);
    }

    /* ===== Toolbar ===== */
    .cp-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 14px;
      flex-wrap: wrap;
    }

    .cp-toolbar__left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1;
      min-width: 260px;
      max-width: 440px;
    }

    .cp-toolbar__right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cp-search-wrap {
      position: relative;
      width: 100%;
    }

    .cp-search-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 17px;
      height: 17px;
      color: #94a3b8;
      pointer-events: none;
    }

    .cp-search-wrap input {
      width: 100%;
      height: 38px;
      padding: 0 14px 0 40px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-family: 'Outfit', sans-serif;
      font-size: 13.5px;
      color: #1e293b;
      outline: none;
      transition: all 0.2s ease;
    }

    .cp-search-wrap input:focus {
      background: #ffffff;
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
    }

    .btn-tambah-cp {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 38px;
      padding: 0 18px;
      background: var(--blue-800, #1e5a96);
      color: #ffffff;
      border: none;
      border-radius: 8px;
      font-family: 'Outfit', sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 2px 4px rgba(30, 90, 150, 0.2);
      transition: all 0.18s ease;
      white-space: nowrap;
    }

    .btn-tambah-cp:hover {
      background: #164677;
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(30, 90, 150, 0.25);
    }

    .btn-tambah-cp:active {
      transform: translateY(0);
    }

    .cp-dashed-divider {
      height: 1px;
      background-image: linear-gradient(to right, #cbd5e1 45%, rgba(255, 255, 255, 0) 0%);
      background-position: top;
      background-size: 8px 1px;
      background-repeat: repeat-x;
      margin: 0 -20px 16px;
    }

    /* Badges & Elements */
    .cp-pill {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      background: #f1f5f9;
      color: #1e293b;
      border: 1px solid #e2e8f0;
      border-radius: 6px;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.1px;
    }

    .customer-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: 6px;
      font-family: 'Outfit', sans-serif;
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.2px;
      background: #eff6ff;
      color: #1d4ed8;
      border: 1px solid #bfdbfe;
    }

    .customer-badge svg {
      width: 14px;
      height: 14px;
      margin-right: 6px;
      stroke-width: 2;
    }

    .cp-action-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 32px;
      height: 32px;
      background: transparent;
      border: none;
      border-radius: 6px;
      color: #64748b;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .cp-action-btn:hover {
      background: #f1f5f9;
      color: #0f172a;
    }

    .cp-action-btn svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .cp-empty-cell {
      text-align: center;
      padding: 36px 16px !important;
      color: #94a3b8;
      font-family: 'Outfit', sans-serif;
      font-size: 14px;
      font-style: italic;
    }

    /* Floating Action Menu */
    .cp-action-menu {
      position: fixed;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.12), 0 8px 10px -6px rgba(15, 23, 42, 0.08);
      padding: 5px;
      min-width: 140px;
      z-index: 99999;
      display: none;
      flex-direction: column;
      gap: 2px;
    }

    .cp-action-menu.is-open {
      display: flex;
    }

    .cp-action-menu button {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      padding: 8px 12px;
      background: transparent;
      border: none;
      border-radius: 6px;
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 500;
      color: #334155;
      cursor: pointer;
      text-align: left;
      transition: background 0.12s ease, color 0.12s ease;
    }

    .cp-action-menu button:hover {
      background: #f1f5f9;
      color: #0f172a;
    }

    .cp-action-menu button.is-danger {
      color: #dc2626;
    }

    .cp-action-menu button.is-danger:hover {
      background: #fef2f2;
      color: #b91c1c;
    }

    .cp-action-icon {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 16px;
      height: 16px;
      color: #64748b;
    }

    .cp-action-icon.is-danger {
      color: #dc2626;
    }

    .cp-action-icon svg {
      width: 15px;
      height: 15px;
      stroke: currentColor;
      fill: none;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin="round";
    }

    /* Modal Styling */
    .cp-modal-box {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.16);
      width: 100%;
      max-width: 500px;
      margin: 16px;
      position: relative;
      overflow: hidden;
      animation: cpModalFadeIn 0.2s ease-out;
    }

    @keyframes cpModalFadeIn {
      from {
        opacity: 0;
        transform: translateY(-8px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .cp-modal-accent-line {
      height: 4px;
      background: var(--blue-800, #1e5a96);
      width: 100%;
    }

    .cp-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 22px 14px;
    }

    .cp-modal-title {
      margin: 0;
      font-family: 'Outfit', sans-serif;
      font-size: 17px;
      font-weight: 700;
      color: #0f172a;
    }

    .cp-modal-title em {
      font-style: italic;
      color: var(--blue-800, #1e5a96);
    }

    .cp-modal-close-btn {
      background: transparent;
      border: none;
      color: #64748b;
      font-size: 20px;
      line-height: 1;
      cursor: pointer;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 6px;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .cp-modal-close-btn:hover {
      background: #f1f5f9;
      color: #0f172a;
    }

    .cp-modal-dashed-divider {
      height: 1px;
      background-image: linear-gradient(to right, #e2e8f0 45%, rgba(255, 255, 255, 0) 0%);
      background-position: top;
      background-size: 8px 1px;
      background-repeat: repeat-x;
      margin: 0 0 16px;
    }

    .cp-form-grid {
      padding: 0 22px 18px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    .cp-form-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .cp-form-label {
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
    }

    .cp-form-input {
      width: 100%;
      height: 38px;
      padding: 0 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-family: 'Outfit', sans-serif;
      font-size: 13.5px;
      color: #1e293b;
      outline: none;
      background: #ffffff;
      transition: all 0.15s ease;
    }

    .cp-form-input:focus {
      border-color: #0284c7;
      box-shadow: 0 0 0 3px rgba(2, 132, 199, 0.12);
    }

    .cp-form-input-readonly {
      background: #f8fafc;
      color: #475569;
      border-color: #e2e8f0;
      cursor: default;
    }

    .cp-modal-footer {
      padding: 12px 22px 18px;
      display: flex;
      justify-content: flex-end;
    }

    .cp-btn-simpan {
      height: 38px;
      padding: 0 24px;
      background: var(--blue-800, #1e5a96);
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-family: 'Outfit', sans-serif;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .cp-btn-simpan:hover {
      background: #164677;
      transform: translateY(-1px);
    }

    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.45);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.2s ease, visibility 0.2s ease;
    }

    .modal-overlay.is-active {
      opacity: 1;
      visibility: visible;
    }

    .cp-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0f172a;
      color: #ffffff;
      padding: 12px 20px;
      border-radius: 8px;
      font-family: 'Outfit', sans-serif;
      font-size: 13.5px;
      font-weight: 500;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      z-index: 99999;
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .cp-toast.is-show {
      opacity: 1;
      transform: translateY(0);
    }

    .swal2-container {
      z-index: 9999999 !important;
    }
  </style>
</head>

<body class="dashboard-body">
  <aside id="app-sidebar"></aside>

  <div class="dashboard-shell">
    <header class="topbar"></header>

    <main class="dashboard-content">
      <div class="dashboard-heading">
        <h1>Customer | Project</h1>
      </div>

      <section class="panel campaign-panel">
        <div class="campaign-panel__line cp-panel-line"></div>

        <div class="cp-toolbar">
          <div class="cp-toolbar__left">

                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
              <input id="cpSearch" type="search" placeholder="Cari Project / Brand atau Customer..." autocomplete="off" />
            </div>
          </div>

          <div class="cp-toolbar__right">
            <button id="btnTambahCp" class="btn-tambah-cp" type="button">+ Tambah</button>
          </div>
        </div>

        <div class="cp-dashed-divider"></div>

        <div class="table-wrap campaign-table" id="cpTableWrap">
          <table id="customerProjectTable">

              <tr>
                <th>#</th>
                <th>Project / Brand</th>
                <th>Customer</th>
                <th style="width: 70px; text-align: center;">Aksi</th>
              </tr>
            </thead>
            <tbody id="cpTableBody"></tbody>
          </table>

  <!-- ===== MODAL TAMBAH / EDIT CUSTOMER | PROJECT ===== -->
  <div id="cpFormModal" class="modal-overlay">

      <div class="cp-modal-header">

          <em><span id="cpFormActionText">Tambah</span></em> Customer | Project

  <!-- ===== MODAL LIHAT CUSTOMER | PROJECT ===== -->
  <div id="cpViewModal" class="modal-overlay">
    <div class="cp-modal-box">
      <div class="cp-modal-accent-line"></div>

      <div class="cp-modal-header">
        <h2 class="cp-modal-title">
          <em>Lihat</em> Customer | Project
        </h2>
        <button class="cp-modal-close-btn" type="button" data-close-modal="cpViewModal" aria-label="Tutup">x</button>

      <div class="cp-modal-dashed-divider"></div>

      <div class="cp-form-grid">

  <!-- ===== FLOATING ACTION MENU ===== -->
  <div id="cpActionMenu" class="cp-action-menu">
    <button type="button" data-action="view">
      <span class="cp-action-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </span>
      <span>Lihat</span>
    </button>
    <button type="button" data-action="edit">
      <span class="cp-action-icon">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
      </span>

      <span class="cp-action-icon is-danger">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"></path><path d="M8 6V4h8v2"></path><path d="M19 6l-1 14H6L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path></svg>
      </span>
      <span>Hapus</span>
    </button>
  </div>

  <script src="../../assets/js/layout.js?v=20261110_cp_v1"></script>
  <script>
    (function () {
      'use strict';

      const STORAGE_KEY = 'accounting_master_customer_project_v1';

      const DEFAULT_CUSTOMER_PROJECT_DATA = [
        { id: 'cp-1', projectBrand: 'Seluruh Kreator MCN', customer: 'TikTok' },
        { id: 'cp-2', projectBrand: 'Campaign Brand A', customer: 'Campaign Brand A' },
        { id: 'cp-3', projectBrand: 'Shopee Affiliate Mall', customer: 'Shopee Live Media' },
        { id: 'cp-4', projectBrand: 'Cosmo Endorse', customer: 'Brand Cosmo Style' },
        { id: 'cp-5', projectBrand: 'Shopee Mega Sale', customer: 'PT Mega Retail' },
        { id: 'cp-6', projectBrand: 'Product Launching Serum Glow', customer: 'PT Global Niaga' }
      ];

      let customerProjectData = loadData();
      let currentActionId = null;

      // DOM Elements
      const tableBody = document.getElementById('cpTableBody');
      const searchInput = document.getElementById('cpSearch');
      const btnTambah = document.getElementById('btnTambahCp');
      const formModal = document.getElementById('cpFormModal');
      const viewModal = document.getElementById('cpViewModal');
      const form = document.getElementById('cpForm');
      const actionMenu = document.getElementById('cpActionMenu');

      function loadData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_CUSTOMER_PROJECT_DATA));
            return DEFAULT_CUSTOMER_PROJECT_DATA.slice();
          }
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length > 0) {
            return parsed.map(function (item, idx) {
              return {
                id: item.id || ('cp-' + (idx + 1)),
                projectBrand: (item.projectBrand || item.brand || item.project || '').trim(),
                customer: (item.customer || item.klien || item.client || '').trim()
              };
            }).filter(function (item) { return item.projectBrand !== '' || item.customer !== ''; });
          }
          localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_CUSTOMER_PROJECT_DATA));
          return DEFAULT_CUSTOMER_PROJECT_DATA.slice();
        } catch (e) {
          console.error('Error loading customer project data:', e);
          return DEFAULT_CUSTOMER_PROJECT_DATA.slice();
        }
      }

      function saveData() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(customerProjectData));
          window.dispatchEvent(new Event('storage'));
          window.dispatchEvent(new CustomEvent('accounting_customer_project_changed', { detail: customerProjectData }));
        } catch (e) {
          console.error('Error saving customer project data:', e);
        }
      }

      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function showToast(message, type) {
        const existing = document.querySelector('.cp-toast');
        if (existing) existing.remove();

        const toast = document.createElement('div');
        toast.className = 'cp-toast';
        if (type === 'warning') toast.style.background = '#eab308';
        if (type === 'error') toast.style.background = '#ef4444';

        toast.textContent = message;
        document.body.appendChild(toast);

        requestAnimationFrame(function () {
          toast.classList.add('is-show');
        });

        setTimeout(function () {
          toast.classList.remove('is-show');
          setTimeout(function () { toast.remove(); }, 250);
        }, 2500);
      }

      function openModal(modal) {
        if (!modal) return;
        closeActionMenus();
        modal.classList.add('is-active');
      }

      function closeModal(modal) {
        if (!modal) return;
        modal.classList.remove('is-active');
      }

      function getFilteredData() {
        const query = (searchInput ? searchInput.value : '').toLowerCase().trim();
        if (!query) return customerProjectData;

        return customerProjectData.filter(function (item) {
          const pb = (item.projectBrand || '').toLowerCase();
          const cust = (item.customer || '').toLowerCase();
          return pb.includes(query) || cust.includes(query);
        });
      }

      function renderTable() {
        if (!tableBody) return;
        tableBody.innerHTML = '';

        const filtered = getFilteredData();
        if (filtered.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="4" class="cp-empty-cell">Tidak ada data Customer | Project yang sesuai.</td></tr>';
          return;
        }

        filtered.forEach(function (item, index) {
          const row = document.createElement('tr');
          row.innerHTML = [
            '<td style="text-align: center; color: #64748b; font-weight: 500;">' + (index + 1) + '</td>',
            '<td><span class="cp-pill" style="font-weight: 600; color: #0284c7;">' + escapeHtml(item.projectBrand || '-') + '</span></td>',
            '<td><span class="customer-badge">' +
              '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>' +
              escapeHtml(item.customer || '-') +
            '</span></td>',
            '<td style="text-align: center;">' +
              '<button type="button" class="cp-action-btn" data-action-toggle="' + escapeHtml(item.id) + '" aria-label="Menu Aksi" title="Opsi">' +
                '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="12" cy="19" r="2"></circle></svg>' +
              '</button>' +
            '</td>'
          ].join('');
          tableBody.appendChild(row);
        });
      }

      function closeActionMenus() {
        if (actionMenu) {
          actionMenu.classList.remove('is-open');
        }
        currentActionId = null;
      }

      function openActionMenu(button) {
        if (!actionMenu || !button) return;
        const id = button.getAttribute('data-action-toggle');

        if (actionMenu.classList.contains('is-open') && currentActionId === id) {
          closeActionMenus();
          return;
        }

        currentActionId = id;
        const rect = button.getBoundingClientRect();
        const menuWidth = 150;
        let left = rect.right - menuWidth;
        if (left < 10) left = 10;

        actionMenu.style.top = (rect.bottom + 4) + 'px';
        actionMenu.style.left = left + 'px';
        actionMenu.classList.add('is-open');
      }

      function openCreateModal() {
        form.reset();
        document.getElementById('cpEditId').value = '';
        document.getElementById('cpFormActionText').textContent = 'Tambah';
        openModal(formModal);
        setTimeout(function () {
          const inputPb = document.getElementById('cpProjectBrand');
          if (inputPb) inputPb.focus();
        }, 50);
      }

      function openEditModal(item) {
        if (!item) return;
        document.getElementById('cpEditId').value = item.id;
        document.getElementById('cpProjectBrand').value = item.projectBrand || '';
        document.getElementById('cpCustomer').value = item.customer || '';
        document.getElementById('cpFormActionText').textContent = 'Edit';
        openModal(formModal);
        setTimeout(function () {
          const inputPb = document.getElementById('cpProjectBrand');
          if (inputPb) inputPb.focus();
        }, 50);
      }

      function openViewModal(item) {
        if (!item) return;
        document.getElementById('viewCpProjectBrand').value = item.projectBrand || '-';
        document.getElementById('viewCpCustomer').value = item.customer || '-';
        openModal(viewModal);
      }

      function handleDelete(item) {
        if (!item) return;
        if (typeof Swal !== 'undefined') {
          Swal.fire({
            title: 'Hapus Customer | Project?',
            text: 'Relasi Project "' + item.projectBrand + '" dengan Customer "' + item.customer + '" akan dihapus secara permanen.',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#dc2626',
            cancelButtonColor: '#64748b',
            confirmButtonText: 'Ya, Hapus!',
            cancelButtonText: 'Batal'
          }).then(function (result) {
            if (result.isConfirmed) {
              customerProjectData = customerProjectData.filter(function (x) { return x.id !== item.id; });
              saveData();
              renderTable();
              showToast('Customer | Project berhasil dihapus');
            }
          });
        } else if (confirm('Apakah Anda yakin ingin menghapus Project "' + item.projectBrand + '"?')) {
          customerProjectData = customerProjectData.filter(function (x) { return x.id !== item.id; });
          saveData();
          renderTable();
          showToast('Customer | Project berhasil dihapus');
        }
      }

      // Event Listeners
      if (btnTambah) {
        btnTambah.addEventListener('click', openCreateModal);
      }

      if (searchInput) {
        searchInput.addEventListener('input', renderTable);
      }

      if (form) {
        form.addEventListener('submit', function (event) {
          event.preventDefault();

          const editId = document.getElementById('cpEditId').value.trim();
          const projectBrand = document.getElementById('cpProjectBrand').value.trim();
          const customer = document.getElementById('cpCustomer').value.trim();

          if (!projectBrand) {
            showToast('Mohon masukkan Project / Brand', 'warning');
            return;
          }
          if (!customer) {
            showToast('Mohon masukkan Customer', 'warning');
            return;
          }

          // Cek duplikasi Project / Brand dan Customer
          const duplicate = customerProjectData.some(function (x) {
            return x.id !== editId &&
              x.projectBrand.toLowerCase() === projectBrand.toLowerCase() &&
              x.customer.toLowerCase() === customer.toLowerCase();
          });
          if (duplicate) {
            showToast('Relasi Project & Customer ini sudah ada!', 'warning');
            return;
          }

          if (editId) {
            const index = customerProjectData.findIndex(function (x) { return x.id === editId; });
            if (index !== -1) {
              customerProjectData[index] = {
                id: editId,
                projectBrand: projectBrand,
                customer: customer
              };
              saveData();
              renderTable();
              closeModal(formModal);
              showToast('Customer | Project berhasil diperbarui');
            }
          } else {
            const newItem = {
              id: 'cp-' + Date.now(),
              projectBrand: projectBrand,
              customer: customer
            };
            customerProjectData.unshift(newItem);
            saveData();
            renderTable();
            closeModal(formModal);
            showToast('Customer | Project berhasil ditambahkan');
          }
        });
      }

      // Action menu click delegation
      if (actionMenu) {
        actionMenu.addEventListener('click', function (event) {
          const btn = event.target.closest('button[data-action]');
          if (!btn) return;

          const action = btn.getAttribute('data-action');
          const target = customerProjectData.find(function (x) { return x.id === currentActionId; });

          closeActionMenus();
          if (!target) return;

          if (action === 'view') {
            openViewModal(target);
          } else if (action === 'edit') {
            openEditModal(target);
          } else if (action === 'delete') {
            handleDelete(target);
          }
        });
      }

      // Table toggle delegation
      if (tableBody) {
        tableBody.addEventListener('click', function (event) {
          const toggle = event.target.closest('[data-action-toggle]');
          if (toggle) {
            event.preventDefault();
            event.stopPropagation();
            openActionMenu(toggle);
          }
        });
      }

      // Close modals by close button
      document.querySelectorAll('[data-close-modal]').forEach(function (button) {
        button.addEventListener('click', function () {
          const modalId = button.getAttribute('data-close-modal');
          const modal = document.getElementById(modalId);
          closeModal(modal);
        });
      });

      // Close modal by clicking overlay
      document.querySelectorAll('.modal-overlay').forEach(function (overlay) {
        overlay.addEventListener('click', function (event) {
          if (event.target === overlay) {
            closeModal(overlay);
          }
        });
      });

      // Window click to close action menu
      window.addEventListener('click', function (event) {
        if (!event.target.closest('#cpActionMenu') && !event.target.closest('[data-action-toggle]')) {
          closeActionMenus();
        }
      });

      // Window scroll/resize to close action menu
      window.addEventListener('scroll', closeActionMenus, true);
      window.addEventListener('resize', closeActionMenus);

      // Escape key
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
          closeActionMenus();
          document.querySelectorAll('.modal-overlay.is-active').forEach(closeModal);
        }
      });

      // Sync realtime jika storage diubah dari tab/window lain
      window.addEventListener('storage', function (e) {
        if (e.key === STORAGE_KEY) {
          customerProjectData = loadData();
          renderTable();
        }
      });

      // Global accessor helper
      window.getAccountingCustomerProjectList = function () {
        return loadData();
      };

      // Initial render
      renderTable();
    })();
  </script>
</body>

</html>
