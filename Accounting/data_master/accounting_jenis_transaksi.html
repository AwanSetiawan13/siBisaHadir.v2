  <script src="../../assets/js/layout.js?v=20261110_jenis_transaksi_v1"></script>
  <script>
    (function () {
      'use strict';

      const STORAGE_KEY = 'accounting_master_jenis_transaksi_v1';

      const DEFAULT_JENIS_TRANSAKSI_DATA = [
        { id: 'jt-1', jenis: 'Saldo awal', arusKas: 'Saldo Awal' },
        { id: 'jt-2', jenis: 'Pendapatan', arusKas: 'Operasional' },
        { id: 'jt-3', jenis: 'Beban', arusKas: 'Operasional' },
        { id: 'jt-4', jenis: 'Pengeluaran Beban', arusKas: 'Operasional' },
        { id: 'jt-5', jenis: 'Payroll', arusKas: 'Operasional' },
        { id: 'jt-6', jenis: 'Pajak', arusKas: 'Operasional' },
        { id: 'jt-7', jenis: 'Pinjaman Karyawan', arusKas: 'Operasional' },
        { id: 'jt-8', jenis: 'Cicilan Karyawan', arusKas: 'Operasional' },
        { id: 'jt-9', jenis: 'Pembelian Aset', arusKas: 'Investasi' },
        { id: 'jt-10', jenis: 'Penjualan Aset', arusKas: 'Investasi' },
        { id: 'jt-11', jenis: 'Modal', arusKas: 'Pendanaan' },
        { id: 'jt-12', jenis: 'Pinjaman', arusKas: 'Pendanaan' },
        { id: 'jt-13', jenis: 'Pelunasan Pinjaman', arusKas: 'Pendanaan' },
        { id: 'jt-14', jenis: 'Transfer Internal', arusKas: 'Transfer Internal' }
      ];

      let jenisTransaksiData = loadData();
      let currentActionId = null;

      // DOM Elements
      const tableBody = document.getElementById('jtTableBody');
      const searchInput = document.getElementById('jtSearch');
      const btnTambah = document.getElementById('btnTambahJt');
      const formModal = document.getElementById('jtFormModal');
      const viewModal = document.getElementById('jtViewModal');
      const form = document.getElementById('jtForm');
      const actionMenu = document.getElementById('jtActionMenu');

      function loadData() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_JENIS_TRANSAKSI_DATA));
            return DEFAULT_JENIS_TRANSAKSI_DATA.slice();
          }
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed) && parsed.length > 0) {
            return parsed.map(function (item, idx) {
              return {
                id: item.id || ('jt-' + (idx + 1)),
                jenis: (item.jenis || item.nama || '').trim(),
                arusKas: (item.arusKas || item.aruskas || 'Operasional').trim()
              };
            }).filter(function (item) { return item.jenis !== ''; });
          }
          localStorage.setItem(STORAGE_KEY, JSON.stringify(DEFAULT_JENIS_TRANSAKSI_DATA));
          return DEFAULT_JENIS_TRANSAKSI_DATA.slice();
        } catch (e) {
          console.error('Error loading jenis transaksi data:', e);
          return DEFAULT_JENIS_TRANSAKSI_DATA.slice();
        }
      }

      function saveData() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(jenisTransaksiData));
          window.dispatchEvent(new Event('storage'));
          window.dispatchEvent(new CustomEvent('accounting_jenis_transaksi_changed', { detail: jenisTransaksiData }));
        } catch (e) {
          console.error('Error saving jenis transaksi data:', e);
        }
      }

      function escapeHtml(str) {
        if (!str) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function getArusKasBadge(arusKas) {
        const val = String(arusKas || '').trim();
        const lower = val.toLowerCase();
        let cls = 'badge-default';

        if (lower.includes('operasional')) cls = 'badge-operasional';
        else if (lower.includes('investasi')) cls = 'badge-investasi';
        else if (lower.includes('pendanaan')) cls = 'badge-pendanaan';
        else if (lower.includes('transfer')) cls = 'badge-transfer';
        else if (lower.includes('saldo awal')) cls = 'badge-saldo-awal';

        return '<span class="arus-kas-badge ' + cls + '">' + escapeHtml(val || '-') + '</span>';
      }

      function showToast(message, type) {
        const existing = document.querySelector('.jt-toast');
        if (existing) existing.remove();

        const toast = document.createElement('div');
        toast.className = 'jt-toast';
        if (type === 'warning') toast.style.background = '#eab308';
        if (type === 'error') toast.style.background = '#ef4444';

        toast.textContent = message;
        document.body.appendChild(toast);

        requestAnimationFrame(function () {
          toast.classList.add('is-show');
        });

        setTimeout(function () {
          toast.classList.remove('is-show');
          setTimeout(function () { toast.remove(); }, 250);
        }, 2500);
      }

      function openModal(modal) {
        if (!modal) return;
        closeActionMenus();
        modal.classList.add('is-active');
      }

      function closeModal(modal) {
        if (!modal) return;
        modal.classList.remove('is-active');
      }

      function getFilteredData() {
        const query = (searchInput ? searchInput.value : '').toLowerCase().trim();
        if (!query) return jenisTransaksiData;

        return jenisTransaksiData.filter(function (item) {
          const jenis = (item.jenis || '').toLowerCase();
          const arusKas = (item.arusKas || '').toLowerCase();
          return jenis.includes(query) || arusKas.includes(query);
        });
      }

      function renderTable() {
        if (!tableBody) return;
        tableBody.innerHTML = '';

        const filtered = getFilteredData();
        if (filtered.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="4" class="jt-empty-cell">Tidak ada data Jenis Transaksi yang sesuai.</td></tr>';
          return;
        }

        filtered.forEach(function (item, index) {
          const row = document.createElement('tr');
          row.innerHTML = [
            '<td style="text-align: center; color: #64748b; font-weight: 500;">' + (index + 1) + '</td>',
            '<td><span class="jt-pill">' + escapeHtml(item.jenis || '-') + '</span></td>',
            '<td>' + getArusKasBadge(item.arusKas) + '</td>',
            '<td style="text-align: center;">' +
              '<button type="button" class="jt-action-btn" data-action-toggle="' + escapeHtml(item.id) + '" aria-label="Menu Aksi" title="Opsi">' +
                '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"></circle><circle cx="12" cy="12" r="2"></circle><circle cx="12" cy="19" r="2"></circle></svg>' +
              '</button>' +
            '</td>'
          ].join('');
          tableBody.appendChild(row);
        });
      }

      function closeActionMenus() {
        if (actionMenu) {
          actionMenu.classList.remove('is-open');
        }
        currentActionId = null;
      }

      function openActionMenu(button) {
        if (!actionMenu || !button) return;
        const id = button.getAttribute('data-action-toggle');

        if (actionMenu.classList.contains('is-open') && currentActionId === id) {
          closeActionMenus();
          return;
        }

        currentActionId = id;
        const rect = button.getBoundingClientRect();
        const menuWidth = 150;
        let left = rect.right - menuWidth;
        if (left < 10) left = 10;

        actionMenu.style.top = (rect.bottom + 4) + 'px';
        actionMenu.style.left = left + 'px';
        actionMenu.classList.add('is-open');
      }

      function openCreateModal() {
        form.reset();
        document.getElementById('jtEditId').value = '';
        document.getElementById('jtArusKas').selectedIndex = 0;
        document.getElementById('jtFormActionText').textContent = 'Tambah';
        openModal(formModal);
        setTimeout(function () {
          const inputJenis = document.getElementById('jtJenis');
          if (inputJenis) inputJenis.focus();
        }, 50);
      }

      function openEditModal(item) {
        if (!item) return;
        document.getElementById('jtEditId').value = item.id;
        document.getElementById('jtJenis').value = item.jenis || '';
        document.getElementById('jtArusKas').value = item.arusKas || 'Operasional';
        document.getElementById('jtFormActionText').textContent = 'Edit';
        openModal(formModal);
        setTimeout(function () {
          const inputJenis = document.getElementById('jtJenis');
          if (inputJenis) inputJenis.focus();
        }, 50);
      }

      function openViewModal(item) {
        if (!item) return;
        document.getElementById('viewJtJenis').value = item.jenis || '-';
        document.getElementById('viewJtArusKas').value = item.arusKas || '-';
        openModal(viewModal);
      }

      function handleDelete(item) {
        if (!item) return;
        if (typeof Swal !== 'undefined') {
          Swal.fire({
            title: 'Hapus Jenis Transaksi?',
            text: 'Jenis Transaksi "' + item.jenis + '" (' + item.arusKas + ') akan dihapus secara permanen.',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#dc2626',
            cancelButtonColor: '#64748b',
            confirmButtonText: 'Ya, Hapus!',
            cancelButtonText: 'Batal'
          }).then(function (result) {
            if (result.isConfirmed) {
              jenisTransaksiData = jenisTransaksiData.filter(function (x) { return x.id !== item.id; });
              saveData();
              renderTable();
              showToast('Jenis Transaksi berhasil dihapus');
            }
          });
        } else if (confirm('Apakah Anda yakin ingin menghapus Jenis Transaksi "' + item.jenis + '"?')) {
          jenisTransaksiData = jenisTransaksiData.filter(function (x) { return x.id !== item.id; });
          saveData();
          renderTable();
          showToast('Jenis Transaksi berhasil dihapus');
        }
      }

      // Event Listeners
      if (btnTambah) {
        btnTambah.addEventListener('click', openCreateModal);
      }

      if (searchInput) {
        searchInput.addEventListener('input', renderTable);
      }

      if (form) {
        form.addEventListener('submit', function (event) {
          event.preventDefault();

          const editId = document.getElementById('jtEditId').value.trim();
          const jenis = document.getElementById('jtJenis').value.trim();
          const arusKas = document.getElementById('jtArusKas').value.trim();

          if (!jenis) {
            showToast('Mohon masukkan Jenis Transaksi', 'warning');
            return;
          }
          if (!arusKas) {
            showToast('Mohon pilih Arus Kas', 'warning');
            return;
          }

          // Cek duplikasi nama Jenis Transaksi
          const duplicate = jenisTransaksiData.some(function (x) {
            return x.id !== editId && x.jenis.toLowerCase() === jenis.toLowerCase();
          });
          if (duplicate) {
            showToast('Jenis Transaksi "' + jenis + '" sudah ada!', 'warning');
            return;
          }

          if (editId) {
            const index = jenisTransaksiData.findIndex(function (x) { return x.id === editId; });
            if (index !== -1) {
              jenisTransaksiData[index] = {
                id: editId,
                jenis: jenis,
                arusKas: arusKas
              };
              saveData();
              renderTable();
              closeModal(formModal);
              showToast('Jenis Transaksi berhasil diperbarui');
            }
          } else {
            const newItem = {
              id: 'jt-' + Date.now(),
              jenis: jenis,
              arusKas: arusKas
            };
            jenisTransaksiData.unshift(newItem);
            saveData();
            renderTable();
            closeModal(formModal);
            showToast('Jenis Transaksi berhasil ditambahkan');
          }
        });
      }

      // Action menu click delegation
      if (actionMenu) {
        actionMenu.addEventListener('click', function (event) {
          const btn = event.target.closest('button[data-action]');
          if (!btn) return;

          const action = btn.getAttribute('data-action');
          const target = jenisTransaksiData.find(function (x) { return x.id === currentActionId; });

          closeActionMenus();
          if (!target) return;

          if (action === 'view') {
            openViewModal(target);
          } else if (action === 'edit') {
            openEditModal(target);
          } else if (action === 'delete') {
            handleDelete(target);
          }
        });
      }

      // Table toggle delegation
      if (tableBody) {
        tableBody.addEventListener('click', function (event) {
          const toggle = event.target.closest('[data-action-toggle]');
          if (toggle) {
            event.preventDefault();
            event.stopPropagation();
            openActionMenu(toggle);
          }
        });
      }

      // Close modals by close button
      document.querySelectorAll('[data-close-modal]').forEach(function (button) {
        button.addEventListener('click', function () {
          const modalId = button.getAttribute('data-close-modal');
          const modal = document.getElementById(modalId);
          closeModal(modal);
        });
      });

      // Close modal by clicking overlay
      document.querySelectorAll('.modal-overlay').forEach(function (overlay) {
        overlay.addEventListener('click', function (event) {
          if (event.target === overlay) {
            closeModal(overlay);
          }
        });
      });

      // Window click to close action menu
      window.addEventListener('click', function (event) {
        if (!event.target.closest('#jtActionMenu') && !event.target.closest('[data-action-toggle]')) {
          closeActionMenus();
        }
      });

      // Window scroll/resize to close action menu
      window.addEventListener('scroll', closeActionMenus, true);
      window.addEventListener('resize', closeActionMenus);

      // Escape key
      document.addEventListener('keydown', function (event) {
        if (event.key === 'Escape') {
          closeActionMenus();
          document.querySelectorAll('.modal-overlay.is-active').forEach(closeModal);
        }
      });

      // Sync realtime jika storage diubah dari tab/window lain
      window.addEventListener('storage', function (e) {
        if (e.key === STORAGE_KEY) {
          jenisTransaksiData = loadData();
          renderTable();
        }
      });

      // Initial render
      renderTable();
    })();
  </script>
</body>

</html>
