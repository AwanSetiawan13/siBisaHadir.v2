<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kreator | Bisa Media</title>
  <link rel="stylesheet" href="../../style.css" />
  <!-- Boxicons for action icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/sneat-bootstrap-html-admin-template-free@1.0.0/assets/vendor/fonts/boxicons.css"
    rel="stylesheet" />
  <link rel="icon" type="image/png" href="../../media/logo.png" />
  <style>
    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      border-radius: 4px;
      text-align: center;
      line-height: 1.2;
    }

    .status-badge--success {
      background-color: rgba(0, 230, 118, 0.1);
      color: #00e676;
      border: 1px solid rgba(0, 230, 118, 0.3);
    }

    .status-badge--warning {
      background-color: rgba(255, 179, 0, 0.1);
      color: #ffb300;
      border: 1px solid rgba(255, 179, 0, 0.3);
    }

    .status-badge--danger {
      background-color: rgba(255, 82, 82, 0.1);
      color: #ff5252;
      border: 1px solid rgba(255, 82, 82, 0.3);
    }
  </style>
</head>

<body class="dashboard-body">
    <aside id="sidebar" class="sidebar kol-sidebar"></aside>

  <div class="dashboard-shell">
        <header class="topbar hirezy-topbar"></header>

    <main class="dashboard-content">
      
      <!-- Metric Summary Cards outside Panel -->
      <div class="milestone-metric-grid-new"
        style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 29px; margin-bottom: 26px;">

        <article class="metric-card">
          <div>
            <span class="metric-label">Aktif</span>
            <strong class="metric-value" id="metricKreatorAktif">0</strong>
          </div>
          <div class="metric-icon-box"
            style="background-color: rgba(76, 175, 80, 0.12); border-radius: 12px; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; align-self: center;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
              stroke-linejoin="round" style="width: 22px; height: 22px; color: #4caf50;">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
          </div>
        </article>

        <article class="metric-card">
          <div>
            <span class="metric-label">Tidak aktif</span>
            <strong class="metric-value" id="metricKreatorTidakAktif">0</strong>
          </div>
          <div class="metric-icon-box"
            style="background-color: rgba(244, 67, 54, 0.12); border-radius: 12px; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; align-self: center;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
              stroke-linejoin="round" style="width: 22px; height: 22px; color: #f44336;">
              <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <line x1="18" y1="8" x2="22" y2="12"></line>
              <line x1="22" y1="8" x2="18" y2="12"></line>
            </svg>
          </div>
        </article>

        <article class="metric-card">
          <div>
            <span class="metric-label">Perlu Perhatian</span>
            <strong class="metric-value" id="metricKreatorPerhatian">0</strong>
          </div>
          <div class="metric-icon-box"
            style="background-color: rgba(255, 179, 0, 0.12); border-radius: 12px; width: 46px; height: 46px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; align-self: center;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"
              stroke-linejoin="round" style="width: 22px; height: 22px; color: #ffb300;">
              <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
              <line x1="12" y1="9" x2="12" y2="13"></line>
              <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
          </div>
        </article>

      </div>

      <section class="panel campaign-panel">
        <div class="campaign-panel__line"></div>



        <div class="campaign-toolbar">
          <div class="campaign-toolbar__left">
            <div class="filter-dropdown-wrapper">
              <button id="btnFilterCampaign" class="small-action-button" type="button" aria-label="Filter">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                  <path d="M4 5h16l-6 7v5l-4 2v-7z"></path>
                </svg>
              </button>

              <!-- Dropdown Content -->
              <div id="filterCampaignDropdown" class="filter-popover">
                <form id="filterCampaignForm" class="filter-popover-form">
                  <div class="form-group">
                    <label class="form-label">Kategori Produk</label>
                    <div class="select-wrapper">
                      <select class="form-select">
                        <option value="" disabled selected hidden>Pilih Kategori</option>
                        <option value="fashion">Fashion</option>
                        <option value="beauty">Beauty & Care</option>
                        <option value="food">Food & Beverage</option>
                      </select>
                    </div>
                  </div>

                  <div class="form-group">
                    <label class="form-label">Status</label>
                    <div class="select-wrapper">
                      <select class="form-select">
                        <option value="" disabled selected hidden>Pilih Status</option>
                        <option value="bind">Bind</option>
                        <option value="tenggang">Tenggang</option>
                        <option value="berhenti">Berhenti</option>
                      </select>
                    </div>
                  </div>

                  <div class="form-group">
                    <label class="form-label">Leads</label>
                    <div class="select-wrapper">
                      <select class="form-select">
                        <option value="" disabled selected hidden>Pilih Leads</option>
                        <option value="member">Member</option>
                        <option value="member_mahasiswa">Member & Mahasiswa</option>
                        <option value="smartc">SmartC</option>
                        <option value="markom">Markom</option>
                        <option value="bootcamp">Bootcamp</option>
                      </select>
                    </div>
                  </div>

                  <div style="display: flex; gap: 8px; margin-top: 12px; justify-content: flex-end;">
                    <button type="reset" class="btn-reset"
                      style="background-color: #f44336; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'Outfit'; flex: 1; height: 38px;">Reset</button>
                    <button type="submit" class="btn-simpan"
                      style="background-color: #2264c6; color: #fff; border: none; padding: 8px 16px; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'Outfit'; flex: 1; height: 38px; margin: 0;">Terapkan</button>
                  </div>
                </form>
              </div>
            </div>

            <label class="campaign-search">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="10" cy="10" r="5"></circle>
                <path d="M14 14l5 5"></path>
              </svg>
              <input type="search" placeholder="Cari...." />
            </label>
          </div>

          <div class="campaign-toolbar__right">
            <button class="btn-tambah" style="margin-right: 6px;" type="button">
              + Tambah
            </button>
          </div>
        </div>

        <div class="table-wrap campaign-table">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>UID</th>
                <th>Username</th>
                <th>Nama Kreator</th>
                <th>Kategori Produk</th>
                <th>Masa Kontrak</th>
                <th>Status</th>
                <th class="text-center" style="text-align: center;">Aksi</th>
              </tr>
            </thead>
            <tbody id="kreatorTableBody"></tbody>
          </table>
        </div>
      </section>

    </main>

    <footer class="dashboard-footer">© 2026 Bisa Media</footer>
  </div>

  <!-- Modal PopUp Tambah Kreator -->
  <div id="kreatorModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h2 class="modal-title" id="kreatorModalTitle">Tambah <span style="font-weight: 700;">Kreator</span></h2>
        <button id="closeKreatorModal" class="modal-close" type="button" aria-label="Tutup popup">&times;</button>
      </div>

      <div class="modal-divider"></div>

      <form id="kreatorForm" class="modal-form-grid modal-form-grid--two">
        <input type="hidden" id="kreatorId" value="" />
        <input type="hidden" id="kreatorFotoData" value="" />
        <!-- Foto Centered -->
        <div class="foto-upload-group span-full" style="text-align: center;">
          <span class="form-label">Foto</span>
          <label for="fotoInput" class="foto-upload-box" id="kreatorFotoUploadBox"
            style="position: relative; overflow: hidden; margin: 0 auto;">
            <span class="btn-choose-file">Choose File</span>
            <input type="file" id="fotoInput" style="display: none;" accept="image/*" />
          </label>
        </div>

        <!-- UID Full Width -->
        <div class="form-group span-full">
          <label class="form-label">UID</label>
          <input type="text" id="kreatorUidInput" class="form-input" placeholder="Tambah UID" required />
        </div>

        <!-- Row 2 -->
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="kreatorUsernameInput" class="form-input" placeholder="Tambah Username" required />
        </div>
        <div class="form-group">
          <label class="form-label">Nama Kreator</label>
          <input type="text" id="kreatorNamaInput" class="form-input" placeholder="Tambah Nama Kreator" required />
        </div>

        <!-- Row 3 -->
        <div class="form-group">
          <label class="form-label">Alamat</label>
          <input type="text" id="kreatorAlamatInput" class="form-input" placeholder="Tambah Alamat" required />
        </div>
        <div class="form-group">
          <label class="form-label">Nomor WA</label>
          <input type="text" id="kreatorWaInput" class="form-input" placeholder="Tambah Nomor WA" required />
        </div>

        <!-- Row 4 -->
        <div class="form-group" style="position: relative;">
          <label class="form-label">Kategori Produk</label>
          <div class="custom-cat-dropdown" id="customCatDropdown">
            <!-- Selected Label display -->
            <div class="custom-cat-selector" id="customCatSelector">
              <span id="selectedCatText" class="custom-cat-placeholder">Tambah Kategori Produk</span>
              <svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"
                style="width: 14px; height: 14px; transition: transform 0.2s;">
                <path d="M7 9l5 5 5-5" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round"></path>
              </svg>
            </div>

            <!-- Category flyout container -->
            <div class="custom-cat-menu-wrap" id="customCatMenuWrap" style="display: none;">
              <!-- Level 1: Root Categories -->
              <div class="custom-cat-panel level-1">
                <div class="cat-item-option" data-cat-id="mom_baby">
                  <input type="checkbox" id="cat_mom_baby" />
                  <label for="cat_mom_baby">Mom & Baby</label>
                </div>
                <div class="cat-item-option" data-cat-id="fashion">
                  <input type="checkbox" id="cat_fashion" />
                  <label for="cat_fashion">Fashion</label>
                </div>
                <div class="cat-item-option" data-cat-id="perangkat_keras">
                  <input type="checkbox" id="cat_perangkat_keras" />
                  <label for="cat_perangkat_keras">Alat Perangkat Keras</label>
                </div>
              </div>

              <!-- Level 2: Sub Kategori 1 (shown when a Root is active) -->
              <div class="custom-cat-flyout level-2" id="flyoutLevel2" style="display: none;">
                <div class="flyout-arrow"></div>
                <div class="flyout-card">
                  <div class="flyout-header">
                    <span>Sub Kategori 1</span>
                    <button class="add-sub-btn" type="button" id="btnAddSub2">+</button>
                  </div>
                  <div class="flyout-search-wrap">
                    <input type="text" class="flyout-search-input" id="searchSub1" placeholder="Cari Sub Kategori..." />
                  </div>
                  <div class="flyout-list" id="sub1ListContainer">
                    <!-- Dynamic Subcategory 1 list populated by JavaScript -->
                  </div>
                </div>
              </div>

              <!-- Level 3: Sub Kategori 2 (shown when + is clicked) -->
              <div class="custom-cat-flyout level-3" id="flyoutLevel3" style="display: none;">
                <div class="flyout-arrow"></div>
                <div class="flyout-card">
                  <div class="flyout-header">
                    <span>Sub Kategori 2</span>
                  </div>
                  <div class="flyout-search-wrap">
                    <input type="text" class="flyout-search-input" id="searchSub2" placeholder="Cari Sub Kategori..." />
                  </div>
                  <div class="flyout-list" id="sub2ListContainer">
                    <!-- Dynamic Subcategory 2 list populated by JavaScript -->
                  </div>
                </div>
              </div>

            </div>
          </div>
          <input type="hidden" name="kategori_produk" id="kategoriProdukVal" value="" />
        </div>
        <div class="form-group">
          <label class="form-label">Kategori Spesifik</label>
          <input type="text" id="kreatorKatSpesifikInput" class="form-input" placeholder="Tambah Kategori Spesifik"
            required />
        </div>

        <!-- Row 5 -->
        <div class="form-group">
          <label class="form-label">Kontrak Awal</label>
          <input type="text" id="kreatorKontrakAwalInput" class="form-input" placeholder="dd/mm/yyyy"
            onfocus="(this.type='date')" onblur="(this.type='text')" required />
        </div>
        <div class="form-group">
          <label class="form-label">Kontrak Akhir</label>
          <input type="text" id="kreatorKontrakAkhirInput" class="form-input" placeholder="dd/mm/yyyy"
            onfocus="(this.type='date')" onblur="(this.type='text')" required />
        </div>

        <!-- Row 6 -->
        <div class="form-group">
          <label class="form-label">Status</label>
          <div class="select-wrapper">
            <select id="kreatorStatusSelect" class="form-select" required>
              <option value="" disabled selected hidden>Pilih Status</option>
              <option value="Bind">Bind</option>
              <option value="Tenggang">Tenggang</option>
              <option value="Berhenti">Berhenti</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Leads Kreator</label>
          <div class="select-wrapper">
            <select id="kreatorLeadsSelect" class="form-select" required>
              <option value="" disabled selected hidden>Tambah Leads Kreator</option>
              <option value="Member">Member</option>
              <option value="Member & Mahasiswa">Member & Mahasiswa</option>
              <option value="SmartC">SmartC</option>
              <option value="Markom">Markom</option>
              <option value="Bootcamp">Bootcamp</option>
            </select>
          </div>
        </div>

        <!-- Row 7 -->
        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="kreatorEmailInput" class="form-input" placeholder="Tambah Email" required />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="password-input-wrapper">
            <input type="password" id="kreatorPassword" class="form-input" placeholder="Tambah Password" required />
            <button type="button" class="password-toggle-btn" id="toggleKreatorPassword"
              aria-label="Tampilkan password">
              <svg class="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path
                  d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24">
                </path>
                <line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>

        <!-- Submit Footer with standard full-width dashed line and blue outline button -->
        <div class="modal-footer span-full"
          style="display: flex; justify-content: flex-end; margin-top: 14px; padding-top: 14px; border-top: 1px dashed #ababaf; width: 100%; grid-column: span 2; box-sizing: border-box;">
          <button id="btnKreatorSubmit" class="btn-save-modal" type="submit"
            style="background: #fff; border: 1.5px solid #29A3D8; color: #29A3D8; border-radius: 6px; padding: 8px 30px; font-size: 13.5px; font-weight: 700; cursor: pointer; transition: all 0.15s ease-in-out; font-family: 'Outfit', sans-serif;"
            onmouseover="this.style.background='#29A3D8';this.style.color='#fff';"
            onmouseout="this.style.background='#fff';this.style.color='#29A3D8';">Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal PopUp Lihat Kreator -->
  <div id="kreatorViewModal" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h2 class="modal-title">Lihat <span style="font-weight: 700;">Kreator</span></h2>
        <button class="modal-close" type="button" aria-label="Tutup popup"
          onclick="document.getElementById('kreatorViewModal').classList.remove('is-active')">&times;</button>
      </div>

      <div class="modal-divider"></div>

      <div class="modal-form-grid modal-form-grid--two">
        <!-- Foto Centered -->
        <div class="foto-upload-group span-full" style="text-align: center;">
          <span class="form-label">Foto</span>
          <div class="foto-upload-box" id="viewKreatorFotoBox"
            style="pointer-events: none; margin: 0 auto; display: flex; align-items: center; justify-content: center; overflow: hidden;">
            <img id="viewKreatorFotoImg" src="../../media/avatar.png"
              style="width: 100%; height: 100%; object-fit: cover; border-radius: 4px;" alt="Foto Kreator" />
          </div>
        </div>

        <!-- UID Full Width -->
        <div class="form-group span-full">
          <label class="form-label">UID</label>
          <input type="text" id="viewKreatorUidInput" class="form-input" readonly
            style="background-color: #f8fafc; cursor: default;" />
        </div>

        <!-- Row 2 -->
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" id="viewKreatorUsernameInput" class="form-input" readonly
            style="background-color: #f8fafc; cursor: default;" />
        </div>
        <div class="form-group">
          <label class="form-label">Nama Kreator</label>
          <input type="text" id="viewKreatorNamaInput" class="form-input" readonly
            style="background-color: #f8fafc; cursor: default;" />
        </div>

        <!-- Row 3 -->
        <div class="form-group">
          <label class="form-label">Alamat</label>
          <input type="text" id="viewKreatorAlamatInput" class="form-input" readonly
            style="background-color: #f8fafc; cursor: default;" />
        </div>
        <div class="form-group">
          <label class="form-label">Nomor WA</label>
          <input type="text" id="viewKreatorWaInput" class="form-input" readonly
            style="background-color: #f8fafc; cursor: default;" />
        </div>

        <!-- Row 4 -->
        <div class="form-group">
          <label class="form-label">Kategori Produk</label>
          <input type="text" id="viewKreatorKategoriInput" class="form-input" readonly
            style="background-color: #f8fafc; cursor: default;" />
        </div>
        <div class="form-group">
          <label class="form-label">Kategori Spesifik</label>
          <input type="text" id="viewKreatorKatSpesifikInput" class="form-input" readonly
            style="background-color: #f8fafc; cursor: default;" />
        </div>

        <!-- Row 5 -->
        <div class="form-group">
          <label class="form-label">Kontrak Awal</label>
          <input type="text" id="viewKreatorKontrakAwalInput" class="form-input" readonly
            style="background-color: #f8fafc; cursor: default;" />
        </div>
        <div class="form-group">
          <label class="form-label">Kontrak Akhir</label>
          <input type="text" id="viewKreatorKontrakAkhirInput" class="form-input" readonly
            style="background-color: #f8fafc; cursor: default;" />
        </div>

        <!-- Row 6 -->
        <div class="form-group">
          <label class="form-label">Status</label>
          <input type="text" id="viewKreatorStatusInput" class="form-input" readonly
            style="background-color: #f8fafc; cursor: default;" />
        </div>
        <div class="form-group">
          <label class="form-label">Leads Kreator</label>
          <input type="text" id="viewKreatorLeadsInput" class="form-input" readonly
            style="background-color: #f8fafc; cursor: default;" />
        </div>

        <!-- Row 7 -->
        <div class="form-group span-full">
          <label class="form-label">Email</label>
          <input type="email" id="viewKreatorEmailInput" class="form-input" readonly
            style="background-color: #f8fafc; cursor: default;" />
        </div>
      </div>

      <!-- Footer -->
      <div class="modal-footer"
        style="display: flex; justify-content: flex-end; margin-top: 14px; padding-top: 14px; border-top: 1px dashed #ababaf; width: 100%;">
        <button type="button" class="btn-cancel-modal"
          onclick="document.getElementById('kreatorViewModal').classList.remove('is-active')"
          style="background: #fff; border: 1.5px solid #29A3D8; color: #29A3D8; border-radius: 6px; padding: 8px 30px; font-size: 13.5px; font-weight: 700; cursor: pointer; transition: all 0.15s ease-in-out; font-family: 'Outfit', sans-serif;"
          onmouseover="this.style.background='#29A3D8';this.style.color='#fff';"
          onmouseout="this.style.background='#fff';this.style.color='#29A3D8';">Tutup</button>
      </div>
    </div>
  </div>

  <!-- Modal PopUp Hapus Kreator -->
  <div id="kreatorDeleteModal" class="modal-overlay">
    <div class="modal-box delete-modal-box">
      <h3 class="delete-modal-title">Hapus</h3>
      <div class="delete-modal-icon-box">
        <i class="bx bx-trash"></i>
      </div>
      <p class="delete-modal-desc">
        Apakah Anda yakin ingin menghapus "<span id="deleteKreatorNamaText">-</span>"?
      </p>
      <div class="delete-modal-actions">
        <button type="button" class="btn-delete-cancel"
          onclick="document.getElementById('kreatorDeleteModal').classList.remove('is-active')">Batal</button>
        <button type="button" class="btn-delete-confirm" id="confirmDeleteKreatorBtn">Hapus</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="../../script.js"></script>
  <script>
    (function () {
      // Complete category hierarchy database
      const categoryData = {
        mom_baby: {
          label: "Mom & Baby",
          subs: {
            pakaian_bayi: {
              label: "Pakaian Bayi",
              subs: ["Jumper Bayi", "Piyama Bayi", "Kaos Kaki Bayi"]
            },
            peralatan_makan: {
              label: "Peralatan Makan",
              subs: ["Botol Susu", "Piring Bayi", "Sendok Bayi"]
            },
            popok_tissue: {

      // - Berhenti: jika sudah melewati tanggal berakhir kontrak (endDate < today)
      // - Tenggang: jika kontrak tinggal sebulan lagi atau kurang (endDate <= 1 bulan ke depan)
      // - Bind: jika kontrak masih aktif lebih dari 1 bulan
      function parseDateString(dateStr) {
        if (!dateStr || typeof dateStr !== "string") return null;
        const s = dateStr.trim();
        // Format YYYY-MM-DD
        if (/^\d{4}-\d{1,2}-\d{1,2}$/.test(s)) {
          const parts = s.split("-").map(Number);
          return new Date(parts[0], parts[1] - 1, parts[2]);
        }
        // Format DD/MM/YYYY atau DD-MM-YYYY
        if (/^\d{1,2}[\/\-]\d{1,2}[\/\-]\d{4}$/.test(s)) {
          const parts = s.split(/[\/\-]/).map(Number);
          return new Date(parts[2], parts[1] - 1, parts[0]);
        }
        const d = new Date(s);
        return isNaN(d.getTime()) ? null : d;
      }

      function getKreatorEndDate(item) {
        if (!item) return null;
        if (item.kontrakAkhir) {
          const d = parseDateString(item.kontrakAkhir);
          if (d) return d;
        }
        if (item.masaKontrak && item.masaKontrak.includes("-")) {
          const parts = item.masaKontrak.split("-");
          if (parts.length >= 2) {
            const endPart = parts[parts.length - 1].trim();
            const d = parseDateString(endPart);
            if (d) return d;
          }
        }
        return null;
      }

      function calculateKreatorStatus(item) {
        const endDate = getKreatorEndDate(item);
        if (!endDate) {
          return item.status || "Bind";
        }

        const today = new Date();
        today.setHours(0, 0, 0, 0);

        const end = new Date(endDate);
        end.setHours(0, 0, 0, 0);

        // 1. Sudah melewati tanggal berakhir kontrak -> Otomatis Berhenti
        if (end < today) {
          return "Berhenti";
        }

        // 2. Kontrak sebulan lagi akan berakhir (<= 1 bulan ke depan) -> Langsung Tenggang
        const oneMonthLater = new Date(today);
        oneMonthLater.setMonth(oneMonthLater.getMonth() + 1);

        if (end <= oneMonthLater) {
          return "Tenggang";
        }

        // 3. Masih aktif lebih dari 1 bulan -> Bind
        return "Bind";
      }

          fBox.innerHTML = `
            <img src="${fotoVal}" style="width:100%;height:100%;object-fit:cover;border-radius:4px;" alt="Foto Kreator"/>
            <span class="btn-choose-file" style="position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.65); color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 11px; white-space: nowrap;">Ganti Foto</span>
            <input type="file" id="fotoInput" style="display: none;" accept="image/*" />
          `;
          if (typeof window.bindKreatorFotoUploadListener === "function") {
            window.bindKreatorFotoUploadListener();
          }
        }

        const modal = document.getElementById("kreatorModal");
        if (modal) modal.classList.add("is-active");
      }
      window.openEditKreator = openEditKreator;

      const kreatorTableBody = document.getElementById("kreatorTableBody");

      function updateKreatorMetrics() {
        const elAktif = document.getElementById("metricKreatorAktif");
        const elTidakAktif = document.getElementById("metricKreatorTidakAktif");
        const elPerhatian = document.getElementById("metricKreatorPerhatian");

        let countAktif = 0;
        let countTidakAktif = 0;
        let countPerhatian = 0;

        kreatorDb.forEach(k => {
          const s = (k.status || "").toLowerCase();
          if (s === "bind" || s === "aktif") {
            countAktif++;
          } else if (s === "berhenti" || s === "tidak aktif") {
            countTidakAktif++;
          } else if (s === "tenggang" || s === "perlu perhatian") {
            countPerhatian++;
          } else {
            countAktif++;
          }
        });

        if (elAktif) elAktif.textContent = countAktif;
        if (elTidakAktif) elTidakAktif.textContent = countTidakAktif;
        if (elPerhatian) elPerhatian.textContent = countPerhatian;
      }

      let currentFilterStatus = "";
      let currentFilterKategori = "";
      let currentFilterLeads = "";

      function renderKreatorTable(query = "") {
        if (!kreatorTableBody) return;
        syncKreatorStatuses();
        kreatorTableBody.innerHTML = "";
        updateKreatorMetrics();

        const q = (query || "").trim().toLowerCase();
        const filtered = kreatorDb.filter(k => {
          if (q) {
            const matchQ = (k.uid && k.uid.toLowerCase().includes(q)) ||
              (k.username && k.username.toLowerCase().includes(q)) ||
              (k.nama && k.nama.toLowerCase().includes(q)) ||
              (k.kategori && k.kategori.toLowerCase().includes(q));
            if (!matchQ) return false;
          }
          if (currentFilterStatus) {
            const st = (k.status || "").toLowerCase();
            if (st !== currentFilterStatus) return false;
          }
          if (currentFilterKategori) {
            const kt = (k.kategori || "").toLowerCase();
            if (!kt.includes(currentFilterKategori)) return false;
          }
          if (currentFilterLeads) {
            const ld = (k.leads || "").toLowerCase();
            if (!ld.includes(currentFilterLeads)) return false;
          }
          return true;
        });

        if (filtered.length === 0) {
          kreatorTableBody.innerHTML = `
            <tr>
              <td colspan="8" style="text-align: center; padding: 24px; color: #a1a1a5;">Tidak ada data kreator</td>
            </tr>
          `;
          return;
        }

        filtered.forEach((item, index) => {
          const row = document.createElement("tr");
          const fotoUrl = (item.foto && item.foto !== "../../media/logo.png") ? item.foto : "../../media/avatar.png";

          let statusClass = "status-badge--success";
          const st = (item.status || "Bind").toLowerCase();
          if (st === "berhenti") {
            statusClass = "status-badge--danger";
          } else if (st === "tenggang") {
            statusClass = "status-badge--warning";
          } else {
            statusClass = "status-badge--success";
          }

          row.innerHTML = `
            <td>${index + 1}</td>
            <td style="font-weight: 600;">${item.uid || "-"}</td>
            <td>
              <div class="kreator-user-cell" style="display: flex; align-items: center; gap: 10px;">
                <img src="${fotoUrl}" 
                     alt="${item.username || 'Foto'}" 
                     class="kreator-table-avatar" 
                     data-photo-preview="1"
                     data-photo-kind="kreator"
                     data-preview-src="${fotoUrl}"
                     data-photo-src="${fotoUrl}"
                     data-photo-title="Lihat Foto Kreator - ${item.username || item.nama || ''}"
                     data-photo-meta="Foto profil ${item.nama || item.username || 'Kreator'}"
                     data-photo-address="${item.alamat || 'Bisa Media MCN, Jl. Cisalak No. 47A, Sukamanah, Kec. Cipedes, Kab. Tasikmalaya, Jawa Barat 46131'}"
                     data-photo-note="${item.kategori ? ('Kategori: ' + item.kategori + (item.kategoriSpesifik ? ' - ' + item.kategoriSpesifik : '')) : '-'}"
                     style="width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid #e2e8f0; flex-shrink: 0; background: #f8fafc; cursor: pointer; transition: transform 0.15s ease-in-out, box-shadow 0.15s ease-in-out;" 
                     onmouseover="this.style.transform='scale(1.1)';this.style.boxShadow='0 2px 8px rgba(0,0,0,0.15)';"
                     onmouseout="this.style.transform='scale(1)';this.style.boxShadow='none';"
                     title="Klik untuk lihat foto"
                     onerror="this.onerror=null; this.src='../../media/avatar.png';" />
                <span class="kreator-table-username" style="font-weight: 500; color: #1e293b;">${item.username || "-"}</span>
              </div>
            </td>
            <td>${item.nama || "-"}</td>
            <td>${item.kategori || "-"}</td>
            <td>${item.masaKontrak || "-"}</td>
            <td><span class="status-badge ${statusClass}">${item.status || "Bind"}</span></td>
            <td class="tdActions text-center">
              <div class="dropdown bm-action-dropdown">
                <button class="btn btn-sm btn-icon btn-text-secondary rounded-pill dropdown-toggle hide-arrow"
                  data-bm-dots="true" type="button" aria-expanded="false" aria-label="Aksi" title="Aksi">
                  <i class="bx bx-dots-vertical-rounded"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end bm-table-action-menu">
                  <li>
                    <button class="dropdown-item btn-act-view" type="button" data-id="${item.id}" title="Lihat">
                      <span class="bm-menu-iconify"><i class="bx bx-show"></i></span>
                      <span>Lihat</span>
                    </button>
                  </li>
                  <li>
                    <button class="dropdown-item btn-act-edit" type="button" data-id="${item.id}" title="Edit">
                      <span class="bm-menu-iconify"><i class="bx bx-edit-alt"></i></span>
                      <span>Edit</span>
                    </button>
                  </li>
                  <li>
                    <button class="dropdown-item text-danger btn-act-delete" type="button" data-id="${item.id}" title="Hapus">
                      <span class="bm-menu-iconify" style="background: #e02424 !important;"><i class="bx bx-trash"></i></span>
                      <span>Hapus</span>
                    </button>
                  </li>
                </ul>
              </div>
            </td>
          `;

          kreatorTableBody.appendChild(row);
        });
      }

      const modalLihatKreator = document.getElementById("kreatorViewModal");
      const modalHapusKreator = document.getElementById("kreatorDeleteModal");
      const btnConfirmDelete = document.getElementById("confirmDeleteKreatorBtn");
      let pendingDeleteKreatorId = null;

      // Event delegation for table action buttons
      if (kreatorTableBody) {
        kreatorTableBody.addEventListener("click", (e) => {
          const avatarBtn = e.target.closest(".kreator-table-avatar");
          if (avatarBtn) {
            e.preventDefault();
            e.stopPropagation();
            const src = avatarBtn.getAttribute("data-photo-src") || avatarBtn.src;
            const title = avatarBtn.getAttribute("data-photo-title") || "Lihat Foto Kreator";
            const meta = avatarBtn.getAttribute("data-photo-meta") || "Preview foto kreator";
            const address = avatarBtn.getAttribute("data-photo-address") || "Bisa Media MCN, Jl. Cisalak No. 47A, Sukamanah, Kec. Cipedes, Kab. Tasikmalaya, Jawa Barat 46131";
            const note = avatarBtn.getAttribute("data-photo-note") || "-";
            if (typeof window.openPhotoModal === "function") {
              window.openPhotoModal(src, title, meta, address, note);
            }
            return;
          }

          const btnView = e.target.closest(".btn-act-view");
          const btnEdit = e.target.closest(".btn-act-edit");
          const btnDel = e.target.closest(".btn-act-delete");

          if (btnView) {
            e.preventDefault();
            e.stopPropagation();
            const id = btnView.getAttribute("data-id");
            const item = kreatorDb.find(k => String(k.id) === String(id));
            if (item) {
              const elFoto = document.getElementById("viewKreatorFotoImg");
              const elUid = document.getElementById("viewKreatorUidInput");
              const elUser = document.getElementById("viewKreatorUsernameInput");
              const elNama = document.getElementById("viewKreatorNamaInput");
              const elAlamat = document.getElementById("viewKreatorAlamatInput");
              const elWa = document.getElementById("viewKreatorWaInput");
              const elKat = document.getElementById("viewKreatorKategoriInput");
              const elKatSpesifik = document.getElementById("viewKreatorKatSpesifikInput");
              const elTglAwal = document.getElementById("viewKreatorKontrakAwalInput");
              const elTglAkhir = document.getElementById("viewKreatorKontrakAkhirInput");
              const elStatus = document.getElementById("viewKreatorStatusInput");
              const elLeads = document.getElementById("viewKreatorLeadsInput");
              const elEmail = document.getElementById("viewKreatorEmailInput");

              if (elFoto) elFoto.src = (item.foto && item.foto !== "../../media/logo.png") ? item.foto : "../../media/avatar.png";
              if (elUid) elUid.value = item.uid || "-";
              if (elUser) elUser.value = item.username || "-";
              if (elNama) elNama.value = item.nama || "-";
              if (elAlamat) elAlamat.value = item.alamat || "-";
              if (elWa) elWa.value = item.nomorWa || "-";
              if (elKat) elKat.value = item.kategori || "-";
              if (elKatSpesifik) elKatSpesifik.value = item.kategoriSpesifik || item.kategori || "-";
              if (elTglAwal) elTglAwal.value = item.kontrakAwal || "-";
              if (elTglAkhir) elTglAkhir.value = item.kontrakAkhir || "-";
              if (elStatus) elStatus.value = item.status || "-";
              if (elLeads) elLeads.value = item.leads || "-";
              if (elEmail) elEmail.value = item.email || "-";

              if (modalLihatKreator) modalLihatKreator.classList.add("is-active");
            }
            return;
          }

          if (btnEdit) {
            e.preventDefault();
            e.stopPropagation();
            const id = btnEdit.getAttribute("data-id");
            const item = kreatorDb.find(k => String(k.id) === String(id));
            if (item) {
              openEditKreator(item);
            }
            return;
          }

          if (btnDel) {
            e.preventDefault();
            e.stopPropagation();
            const id = btnDel.getAttribute("data-id");
            const item = kreatorDb.find(k => String(k.id) === String(id));
            if (item) {
              pendingDeleteKreatorId = item.id;
              const delText = document.getElementById("deleteKreatorNamaText");
              if (delText) delText.textContent = item.nama || item.username || "ini";
              if (modalHapusKreator) modalHapusKreator.classList.add("is-active");
            }
            return;
          }
        });
      }

      if (btnConfirmDelete) {
        btnConfirmDelete.addEventListener("click", () => {
          if (pendingDeleteKreatorId) {
            kreatorDb = kreatorDb.filter(k => String(k.id) !== String(pendingDeleteKreatorId));
            saveKreatorDb();
            renderKreatorTable();
            pendingDeleteKreatorId = null;
            if (modalHapusKreator) modalHapusKreator.classList.remove("is-active");
            if (typeof showToast === "function") {
              showToast("Data kreator berhasil dihapus");
            }
          }
        });
      }

      [modalLihatKreator, modalHapusKreator].forEach(m => {
        if (m) {
          m.addEventListener("click", (e) => {
            if (e.target === m) {
              m.classList.remove("is-active");
            }
          });
        }
      });

      window.renderKreatorTable = renderKreatorTable;

      window.updateKreatorItem = function (id, updatedData) {
        const index = kreatorDb.findIndex(k => String(k.id) === String(id));
        if (index !== -1) {
          kreatorDb[index] = { ...kreatorDb[index], ...updatedData, id: id };
        } else {
          kreatorDb.unshift({ ...updatedData, id: id });
        }
        saveKreatorDb();
        renderKreatorTable();
      };

      window.addKreatorItem = function (item) {
        kreatorDb.unshift(item);
        saveKreatorDb();
        renderKreatorTable();
      };

      const tambahBtn = document.querySelector(".btn-tambah");
      if (tambahBtn) {
        tambahBtn.addEventListener("click", function () {
          resetKreatorForm();
        });
      }

      const searchInput = document.querySelector(".campaign-search input");
      if (searchInput) {
        searchInput.addEventListener("input", (e) => {
          renderKreatorTable(e.target.value);
        });
      }

      // Otomatis sinkronkan status select di modal saat tanggal akhir kontrak diubah
      function autoUpdateStatusSelect() {
        const tglAkhirInp = document.getElementById("kreatorKontrakAkhirInput");
        const statusSelect = document.getElementById("kreatorStatusSelect");
        if (!tglAkhirInp || !statusSelect) return;
        const val = tglAkhirInp.value.trim();
        if (!val) return;

        const computed = calculateKreatorStatus({ kontrakAkhir: val });
        for (let i = 0; i < statusSelect.options.length; i++) {
          if (statusSelect.options[i].text.toLowerCase() === computed.toLowerCase() ||
            statusSelect.options[i].value.toLowerCase() === computed.toLowerCase()) {
            statusSelect.selectedIndex = i;
            break;
          }
        }
      }

      const tglAkhirInp = document.getElementById("kreatorKontrakAkhirInput");
      if (tglAkhirInp) {
        tglAkhirInp.addEventListener("input", autoUpdateStatusSelect);
        tglAkhirInp.addEventListener("change", autoUpdateStatusSelect);
        tglAkhirInp.addEventListener("blur", autoUpdateStatusSelect);
      }

      // Filter Form popover
      const filterPopForm = document.getElementById("filterCampaignForm");
      if (filterPopForm) {
        filterPopForm.addEventListener("submit", function (e) {
          e.preventDefault();
          const selects = filterPopForm.querySelectorAll("select");
          const selKat = selects[0];
          const selStatus = selects[1];
          const selLeads = selects[2];

          currentFilterKategori = (selKat && selKat.value) ? selKat.value.toLowerCase() : "";
          currentFilterStatus = (selStatus && selStatus.value) ? selStatus.value.toLowerCase() : "";
          currentFilterLeads = (selLeads && selLeads.value) ? selLeads.value.toLowerCase() : "";

          renderKreatorTable(searchInput ? searchInput.value : "");
          const popover = document.getElementById("filterCampaignDropdown");
          if (popover) popover.classList.remove("is-active");
          if (typeof showToast === "function") showToast("Filter berhasil diterapkan");
        });

        filterPopForm.addEventListener("reset", function () {
          currentFilterStatus = "";
          currentFilterKategori = "";
          currentFilterLeads = "";
          setTimeout(() => {
            renderKreatorTable(searchInput ? searchInput.value : "");
            const popover = document.getElementById("filterCampaignDropdown");
            if (popover) popover.classList.remove("is-active");
            if (typeof showToast === "function") showToast("Filter berhasil di-reset");
          }, 50);
        });
      }

      renderKreatorTable();
    })();
  </script>
  <script src="../staffkol_layout.js"></script>
</body>

</html>
