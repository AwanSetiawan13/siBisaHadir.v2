<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Pilih Tanggal</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --text: #334155;
      --muted: #94a3b8;
      --line: #e2e8f0;
      --line-dashed: #cbd5e1;
      --hover: #f1f5f9;
      --primary: #2563eb;
      --shadow: 0 4px 20px rgba(0,0,0,0.1);
      --radius: 12px;
      --font: 'Outfit', sans-serif;
    }

    body {
      margin: 0;
      font-family: var(--font);
      color: var(--text);
      background: rgba(0,0,0,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    body[data-embed="1"] {
      background: transparent;
      padding: 0;
    }

    .modal {
      width: 800px;
      background: var(--bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      margin: 20px;
    }

    body[data-embed="1"] .modal {
      width: 100%;
      height: 100vh;
      border-radius: 0;
      margin: 0;
      box-shadow: none;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 24px 16px;
    }

    .modal-title {
      font-size: 18px;
      font-weight: 500;
      color: #1e293b;
      margin: 0;
    }

    .btn-close {
      width: 32px;
      height: 32px;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 18px;
      color: var(--text);
      transition: all 0.2s;
    }
    .btn-close:hover { background: var(--hover); }

    .modal-divider-dashed {
      border-top: 1px dashed var(--line-dashed);
      margin: 0 24px;
    }

    .modal-body {
      display: flex;
      padding: 20px 24px;
      gap: 24px;
    }

    .sidebar {
      width: 160px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .preset-btn {
      width: 100%;
      text-align: left;
      padding: 10px 14px;
      border: none;
      background: #f8fafc;
      border-radius: 6px;
      color: #475569;
      font-size: 13.5px;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      transition: all 0.2s;
    }
    .preset-btn:hover { background: #e2e8f0; }
    .preset-btn.active {
      background: #e0f2fe;
      color: #0284c7;
    }

    .calendar-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      border-left: 1px solid var(--line);
      padding-left: 24px;
    }

    .cal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      font-weight: 700;
      font-size: 15px;
    }
    
    .cal-header-part {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .nav-btn {
      background: none;
      border: none;
      font-size: 18px;
      color: #64748b;
      cursor: pointer;
      padding: 0;
      font-family: monospace;
    }
    .nav-btn:hover { color: #0f172a; }

    .calendars-wrapper {
      display: flex;
      gap: 24px;
    }
    .cal { flex: 1; }

    .dow, .grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      gap: 4px;
    }

    .dow div {
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      margin-bottom: 12px;
    }

    .day {
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13.5px;
      cursor: pointer;
      color: #334155;
      border-radius: 50%;
      user-select: none;
    }
    .day:hover { background: var(--hover); }
    .day.muted { color: #cbd5e1; cursor: default; }
    .day.muted:hover { background: transparent; }
    
    .day.in-range { background: #e0f2fe; border-radius: 0; }
    .day.start { background: var(--primary); color: #fff; border-radius: 50% 0 0 50%; }
    .day.end { background: var(--primary); color: #fff; border-radius: 0 50% 50% 0; }
    .day.single-active { background: var(--primary); color: #fff; border-radius: 50%; }

    .modal-footer {
      border-top: 1px solid var(--line);
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .selected-text {
      font-size: 13px;
      color: #64748b;
    }

    .actions {
      display: flex;
      gap: 12px;
    }

    .btn-action {
      padding: 8px 24px;
      border-radius: 6px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      font-family: var(--font);
      border: 1px solid transparent;
      transition: all 0.2s;
    }

    .btn-cancel {
      background: #fff;
      border-color: var(--line);
      color: #475569;
    }
    .btn-cancel:hover { background: var(--hover); }

    .btn-apply {
      background: var(--primary);
      color: #fff;
    }
    .btn-apply:hover { background: #1d4ed8; }

  </style>
</head>
<body>

  <div class="modal" id="modalDate">
    <div class="modal-header">
      <h2 class="modal-title">Pilih Tanggal</h2>
      <button class="btn-close" id="btnClose">&times;</button>
    </div>
    
    <div class="modal-divider-dashed"></div>

    <div class="modal-body">
      <div class="sidebar" id="presets"></div>

      <div class="calendar-area">
        <div class="cal-header">
          <div class="cal-header-part">
            <button class="nav-btn" id="prevYear" title="Tahun Sebelumnya">&laquo;</button>
            <span id="titleA">2026 - 08</span>
          </div>
          <div class="cal-header-part">
            <button class="nav-btn" id="prevMonth" title="Bulan Sebelumnya">&lsaquo;</button>
            <button class="nav-btn" id="nextMonth" title="Bulan Berikutnya">&rsaquo;</button>
          </div>
          <div class="cal-header-part">
            <span id="titleB">2026 - 09</span>
            <button class="nav-btn" id="nextYear" title="Tahun Berikutnya">&raquo;</button>
          </div>
        </div>

        <div class="calendars-wrapper">
          <div class="cal">
            <div class="dow" id="dowA"></div>
            <div class="grid" id="gridA"></div>
          </div>
          <div class="cal">
            <div class="dow" id="dowB"></div>
            <div class="grid" id="gridB"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <div class="selected-text" id="selectedText">Dipilih: Semua Tanggal</div>
      <div class="actions">
        <button class="btn-action btn-cancel" id="btnCancel">Batal</button>
        <button class="btn-action btn-apply" id="btnApply">Terapkan</button>
      </div>
    </div>
  </div>

<script>
(function(){
  const __params = new URLSearchParams(window.location.search || '');
  const __embedMode = __params.get('embed') === '1' || __params.get('host') === '1';
  if (__embedMode) document.body.setAttribute('data-embed', '1');

  function pad2(n){ return String(n).padStart(2,"0"); }
  function startOfDay(d){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
  function addDays(d, days){ const x=new Date(d); x.setDate(x.getDate()+days); return x; }
  function addMonths(d, months){ return new Date(d.getFullYear(), d.getMonth()+months, 1); }
  function addYears(d, years){ return new Date(d.getFullYear()+years, d.getMonth(), 1); }
  function fmtISO(d){ return d ? d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()) : ''; }
  function parseISO(s){
    const m = String(s || '').trim().match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if(!m) return null;
    return new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
  }
  function monIndex(jsDay){ return (jsDay + 6) % 7; } // Senin=0

  const today = startOfDay(new Date());
  let baseMonth = new Date(today.getFullYear(), today.getMonth(), 1);
  let startDate = null;
  let endDate = null;
  let activePreset = "all";

  const presetItems = [
    { key:"all", label:"Semua Tanggal", range:()=>({s:null,e:null}) },
    { key:"today", label:"Hari ini", range:()=>({s:today,e:today}) },
    { key:"yesterday", label:"Kemarin", range:()=>({s:addDays(today,-1), e:addDays(today,-1)}) },
    { key:"last7", label:"7 hari terakhir", range:()=>({s:addDays(today,-6), e:today}) },
    { key:"last30", label:"30 hari terakhir", range:()=>({s:addDays(today,-29), e:today}) },
    { key:"thisMonth", label:"Bulan ini", range:()=>{
      return {s:new Date(today.getFullYear(), today.getMonth(), 1), e:new Date(today.getFullYear(), today.getMonth()+1, 0)};
    }},
    { key:"lastMonth", label:"Bulan lalu", range:()=>{
      return {s:new Date(today.getFullYear(), today.getMonth()-1, 1), e:new Date(today.getFullYear(), today.getMonth(), 0)};
    }},
  ];

  function getMonthMatrix(year, month){
    const first = new Date(year, month, 1);
    const firstIdx = monIndex(first.getDay());
    const daysInMonth = new Date(year, month+1, 0).getDate();
    const cells = [];
    
    // Previous month padding
    const prevMonthDays = new Date(year, month, 0).getDate();
    for(let i = firstIdx - 1; i >= 0; i--) cells.push({ date: new Date(year, month-1, prevMonthDays - i), muted:true });
    
    for(let d=1; d<=daysInMonth; d++) cells.push({ date:new Date(year, month, d), muted:false });
    
    // Next month padding
    let nextD = 1;
    while(cells.length < 42) cells.push({ date:new Date(year, month+1, nextD++), muted:true });
    return cells;
  }

  function renderDow(el){
    el.innerHTML = "";
    ["Sen","Sel","Rab","Kam","Jum","Sab","Min"].forEach(d=>{
      const div = document.createElement("div");
      div.textContent = d;
      el.appendChild(div);
    });
  }

  function render(){
    const titleA = document.getElementById("titleA");
    const titleB = document.getElementById("titleB");
    const leftM = baseMonth;
    const rightM = addMonths(baseMonth, 1);
    
    titleA.textContent = leftM.getFullYear() + " - " + pad2(leftM.getMonth()+1);
    titleB.textContent = rightM.getFullYear() + " - " + pad2(rightM.getMonth()+1);

    renderMonth(document.getElementById("gridA"), leftM);
    renderMonth(document.getElementById("gridB"), rightM);
    
    // Update presets UI
    document.querySelectorAll(".preset-btn").forEach(btn => {
      btn.classList.toggle("active", btn.dataset.key === activePreset);
    });

    // Update selected text
    let txt = "Semua Tanggal";
    if(startDate && endDate) {
      if(startDate.getTime() === endDate.getTime()) txt = fmtISO(startDate);
      else txt = fmtISO(startDate) + " s/d " + fmtISO(endDate);
    }
    document.getElementById("selectedText").textContent = "Dipilih: " + txt;
  }

  function renderMonth(el, m){
    el.innerHTML = "";
    const cells = getMonthMatrix(m.getFullYear(), m.getMonth());
    cells.forEach(c => {
      const div = document.createElement("div");
      div.className = "day";
      div.textContent = c.date.getDate();
      if(c.muted) div.classList.add("muted");
      
      const t = c.date.getTime();
      const sT = startDate ? startDate.getTime() : null;
      const eT = endDate ? endDate.getTime() : null;
      
      if(sT && eT) {
        if(t === sT && t === eT) div.classList.add("single-active");
        else if(t === sT) div.classList.add("start");
        else if(t === eT) div.classList.add("end");
        else if(t > sT && t < eT) div.classList.add("in-range");
      } else if(sT && t === sT) {
        div.classList.add("single-active");
      }

      div.addEventListener("click", () => {
        activePreset = "";
        if(!startDate || (startDate && endDate)) {
          startDate = c.date; endDate = null;
        } else {
          endDate = c.date;
          if(endDate < startDate) {
             const temp = startDate; startDate = endDate; endDate = temp;
          }
        }
        render();
      });
      
      el.appendChild(div);
    });
  }

  function initPresets(){
    const cont = document.getElementById("presets");
    presetItems.forEach(p => {
      const btn = document.createElement("button");
      btn.className = "preset-btn";
      btn.textContent = p.label;
      btn.dataset.key = p.key;
      btn.addEventListener("click", () => {
        activePreset = p.key;
        const r = p.range();
        startDate = r.s;
        endDate = r.e;
        if(startDate) baseMonth = new Date(startDate.getFullYear(), startDate.getMonth(), 1);
        render();
      });
      cont.appendChild(btn);
    });
  }

  document.getElementById("prevYear").addEventListener("click", () => { baseMonth = addYears(baseMonth, -1); render(); });
  document.getElementById("nextYear").addEventListener("click", () => { baseMonth = addYears(baseMonth, 1); render(); });
  document.getElementById("prevMonth").addEventListener("click", () => { baseMonth = addMonths(baseMonth, -1); render(); });
  document.getElementById("nextMonth").addEventListener("click", () => { baseMonth = addMonths(baseMonth, 1); render(); });
  
  function closePopup(){
    if(__embedMode) window.parent?.postMessage({ type:'ceo:popup-close' }, '*');
    else document.getElementById("modalDate").style.display = "none";
  }

  document.getElementById("btnClose").addEventListener("click", closePopup);
  document.getElementById("btnCancel").addEventListener("click", closePopup);
  
  document.getElementById("btnApply").addEventListener("click", () => {
    if(__embedMode){
      window.parent?.postMessage({
        type:'ceo:rekap-range-apply',
        start: fmtISO(startDate),
        end: fmtISO(endDate),
        compare: false
      }, '*');
    }
    closePopup();
  });

  renderDow(document.getElementById("dowA"));
  renderDow(document.getElementById("dowB"));
  initPresets();

  const initS = parseISO(__params.get('start'));
  const initE = parseISO(__params.get('end'));
  if(initS || initE){
    startDate = initS || initE;
    endDate = initE || initS;
    activePreset = "";
    baseMonth = new Date(startDate.getFullYear(), startDate.getMonth(), 1);
  } else {
    activePreset = "all";
  }
  
  render();

})();
</script>
</body>
</html>
