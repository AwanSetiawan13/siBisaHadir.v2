<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ads Account | Bisa Media</title>
  <link rel="stylesheet" href="../../../style.css" />
  <link rel="icon" type="image/png" href="../../../media/logo.png" />
  <!-- Boxicons for action icons -->
  <link
    href="https://cdn.jsdelivr.net/npm/sneat-bootstrap-html-admin-template-free@1.0.0/assets/vendor/fonts/boxicons.css"
    rel="stylesheet" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
  <!-- Google Fonts Outfit -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap"
    rel="stylesheet" />
  <style>
    /* Action Dropdown styling */
    .bm-action-dropdown {
      position: relative;
      display: inline-block;
    }

    .bm-action-dropdown .bm-table-action-menu {
      position: absolute !important;
      top: calc(100% + 4px) !important;
      right: 0 !important;
      left: auto !important;
      z-index: 9999 !important;
      min-width: 140px;
      background: #ffffff !important;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15) !important;
      border: 1px solid rgba(0, 0, 0, 0.08) !important;
      border-radius: 8px !important;
      padding: 6px;
      list-style: none;
      margin: 0;
      display: none;
    }

    .bm-action-dropdown .bm-table-action-menu.show {
      display: block !important;
    }

    .uid-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 600;
      color: #2264c6;
      background: rgba(34, 100, 198, 0.08);
      border: 1px solid rgba(34, 100, 198, 0.2);
      font-family: 'Outfit', monospace, sans-serif;
    }

    .ads-account-name {
      font-weight: 600;
      color: #1e293b;
      font-size: 13.5px;
    }

    .business-center-name {
      color: #475569;
      font-size: 13.5px;
      font-weight: 500;
    }
  </style>
</head>

<body class="dashboard-body">
                  <aside id="app-sidebar"></aside>

  <div class="dashboard-shell">
    <header class="topbar">
      <div class="topbar__left">
        <button id="sidebarToggle" class="icon-button icon-button--menu" type="button"
          aria-label="Buka atau tutup sidebar">
          <span></span><span></span><span></span>
        </button>

        <svg class="topbar-search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="10.5" cy="10.5" r="6"></circle>
          <path d="M15 15l5 5"></path>
        </svg>

        <input id="menuSearch" class="menu-search" type="search" placeholder="Cari Menu" />
      </div>

      <div class="topbar__actions">
        <button class="icon-button" type="button" aria-label="Notifikasi">
          <svg class="topbar-action-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 17h14"></path>
            <path d="M8 17v-7a4 4 0 118 0v7"></path>
            <path d="M10 20h4"></path>
          </svg>
        </button>

        <div class="topbar-user-dropdown-wrap">
          <button id="userMenuButton" class="icon-button icon-button--avatar" type="button" aria-label="Menu Pengguna" aria-expanded="false" title="Menu Pengguna">
            <img src="../../../media/avatar.png" alt="Avatar" class="topbar-user-avatar" data-ceo-avatar="" />
          </button>
          <div id="userMenuDropdown" class="user-menu-dropdown">
            <div class="user-menu-dropdown__header">
              <img src="../../../media/avatar.png" alt="Avatar" class="user-menu-dropdown__avatar" data-ceo-avatar="" />
              <div class="user-menu-dropdown__info">
                <span class="user-menu-dropdown__name">Supervisi KOL</span>
                <span class="user-menu-dropdown__role">PT. Bisa Media Grup</span>
              </div>
            </div>
            <div class="user-menu-dropdown__divider"></div>
            <a href="../../../BM/BM_dashboard.html" class="user-menu-dropdown__item">
              <svg class="user-menu-dropdown__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
              </svg>
              <div class="user-menu-dropdown__item-text">
                <span class="user-menu-dropdown__title">Kembali</span>
                <span class="user-menu-dropdown__desc">Buka dashboard utama</span>
              </div>
            </a>
            <a href="../../../login.html" class="user-menu-dropdown__item user-menu-dropdown__item--danger">
              <svg class="user-menu-dropdown__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
              </svg>
              <div class="user-menu-dropdown__item-text">
                <span class="user-menu-dropdown__title">Logout</span>
                <span class="user-menu-dropdown__desc">Keluar dari aplikasi</span>
              </div>
            </a>
          </div>
        </div>
      </div>
    </header>

    <main class="dashboard-content">
      <div class="dashboard-heading">
        <h1>Ads Account</h1>
      </div>

      <section class="panel campaign-panel">
        <div class="campaign-panel__line"></div>

        <div class="campaign-toolbar">
          <div class="campaign-toolbar__left">
            <label class="campaign-search" style="margin-left: 0;">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="10" cy="10" r="5"></circle>
                <path d="M14 14l5 5"></path>
              </svg>
              <input type="search" id="adsAccountSearch" placeholder="Cari...." />
            </label>
          </div>
        </div>

        <div class="table-wrap campaign-table">
          <table id="adsAccountTable">
            <thead>
              <tr>
                <th style="width: 60px; text-align: center;">#</th>
                <th>UID</th>
                <th>Ads Account</th>
                <th>Bisnis Center</th>
              </tr>
            </thead>
            <tbody id="adsAccountTableBody">
              <tr>
                <td style="text-align: center;">1</td>
                <td><span class="uid-badge"><i class="bx bx-id-card"></i> 718294019284</span></td>
                <td><span class="ads-account-name">BisaMedia_TikTok_Ads_01</span></td>
                <td><span class="business-center-name">Bisa Media TikTok BC</span></td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

    </main>

    <footer class="dashboard-footer">&copy; 2026 Bisa Media</footer>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="../../../script.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      // Search Filter
      const searchInput = document.getElementById("adsAccountSearch");
      const tableRows = document.querySelectorAll("#adsAccountTableBody tr");

      if (searchInput) {
        searchInput.addEventListener("input", () => {
          const query = searchInput.value.trim().toLowerCase();
          tableRows.forEach(row => {
            const text = row.textContent.toLowerCase();
            row.style.display = text.includes(query) ? "" : "none";
          });
        });
      }
    });
  </script>
  <script src="../../../sidebar_engine.js?v=4"></script>
</body>

</html>
