      <section class="panel campaign-panel">
        <div class="campaign-panel__line"></div>

        <div class="campaign-toolbar">
          <div class="campaign-toolbar__left">
            <label class="campaign-search" style="margin-left: 0;">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="10" cy="10" r="5"></circle>
                <path d="M14 14l5 5"></path>
              </svg>
              <input type="search" placeholder="Cari...." />
            </label>
          </div>

          <div class="campaign-toolbar__right">
            <button id="btnTambahLeads" class="btn-tambah" type="button">
              + Tambah
            </button>
          </div>
        </div>

        <div class="table-wrap campaign-table">

            <thead>
              <tr>
                <th>#</th>
                <th>Status</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

  <div id="leadsKreatorModal" class="modal-overlay">

        <button id="closeLeadsKreatorModal" class="modal-close" type="button" aria-label="Tutup popup">&times;</button>
      </div>

      <div class="modal-divider"></div>

      <form id="leadsKreatorForm" class="modal-form-grid" style="grid-template-columns: 1fr; gap: 20px;">
        <div class="form-group" style="grid-column: span 6;">
          <label class="form-label">Status</label>
          <input type="text" class="form-input" placeholder="Tambah Status Kreator" required />
        </div>

        <div style="grid-column: span 6; margin-top: 8px;">
          <button class="btn-simpan" type="submit">Simpan</button>
        </div>
